 A customer orders 2 times a month at ₹550 with 29% contribution margin. In how many months is CAC paid back?", "explanation": "Monthly contribution = 319; payback = 800/319 = 2.51 months.", "answer": {"value": 2.507837, "format": "num", "tolerance_abs": 0.012539185}}, {"id": "BF-0205", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "numeric", "difficulty": 3, "stem": "CAC is ₹850. A customer orders 2 times a month at ₹650 with 31% contribution margin. In how many months is CAC paid back?", "explanation": "Monthly contribution = 403; payback = 850/403 = 2.11 months.", "answer": {"value": 2.109181, "format": "num", "tolerance_abs": 0.010545905}}, {"id": "BF-0206", "section_code": "BF", "r1_topic": "Valuation", "type": "mcq", "difficulty": 1, "stem": "A buyback executed at a price above intrinsic value tends to:", "explanation": "Overpaying for stock destroys value for remaining holders.", "options": [{"label": "A", "text": "Reduce share capital but raise intrinsic value"}, {"label": "B", "text": "Transfer value from continuing shareholders to those who sell"}, {"label": "C", "text": "Benefit all shareholders equally"}, {"label": "D", "text": "Have no effect"}], "correct_option": "B"}, {"id": "BF-0207", "section_code": "BF", "r1_topic": "Valuation", "type": "mcq", "difficulty": 2, "stem": "A DCF valuation is very sensitive to the terminal growth rate. A prudent analyst should:", "explanation": "Terminal value often dominates; sensitivity is essential.", "options": [{"label": "A", "text": "Set terminal growth above the economy's long-run growth"}, {"label": "B", "text": "Ignore terminal value entirely"}, {"label": "C", "text": "Pick the highest terminal rate to show upside"}, {"label": "D", "text": "Test a range of terminal growth and discount rates and show the valuation range"}], "correct_option": "D"}, {"id": "BF-0208", "section_code": "BF", "r1_topic": "Valuation", "type": "mcq", "difficulty": 2, "stem": "A company trades at 10x EV/EBITDA while peers trade at 14x. Which is the most careful interpretation?", "explanation": "Relative valuation requires comparability.", "options": [{"label": "A", "text": "Multiples never matter"}, {"label": "B", "text": "It is definitely undervalued"}, {"label": "C", "text": "It is definitely overvalued"}, {"label": "D", "text": "It may be undervalued, or it may deserve a discount due to lower growth, higher risk or weaker returns; further checking is needed"}], "correct_option": "D"}, {"id": "BF-0209", "section_code": "BF", "r1_topic": "Valuation", "type": "mcq", "difficulty": 2, "stem": "Book value per share is ₹200 while the market price is ₹600. Which statement is most reasonable?", "explanation": "Market value reflects expectations, not only historical cost.", "options": [{"label": "A", "text": "The market expects substantial future earnings beyond the recorded assets, such as brand, growth or intangibles"}, {"label": "B", "text": "Book value is always irrelevant"}, {"label": "C", "text": "The company's accounts must be fraudulent"}, {"label": "D", "text": "The stock must be overvalued"}], "correct_option": "A"}, {"id": "BF-0210", "section_code": "BF", "r1_topic": "Valuation", "type": "mcq", "difficulty": 2, "stem": "If the required return on equity rises, the intrinsic value of a stock (all else equal) will:", "explanation": "Higher discount rate lowers present value.", "options": [{"label": "A", "text": "Double"}, {"label": "B", "text": "Fall, since future cash flows are discounted at a higher rate"}, {"label": "C", "text": "Rise"}, {"label": "D", "text": "Stay the same"}], "correct_option": "B"}, {"id": "BF-0211", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 2, "stem": "A company earns net profit of ₹42 crore with 3 crore shares outstanding. At a P/E of 12, what is the share price (₹)?", "explanation": "EPS = 14.000; price = 168.00.", "answer": {"value": 168.0, "format": "inr2", "tolerance_abs": 0.336}}, {"id": "BF-0212", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 2, "stem": "A company earns net profit of ₹54 crore with 3 crore shares outstanding. At a P/E of 22, what is the share price (₹)?", "explanation": "EPS = 18.000; price = 396.00.", "answer": {"value": 396.0, "format": "inr2", "tolerance_abs": 0.792}}, {"id": "BF-0213", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 2, "stem": "A company earns net profit of ₹60 crore with 6 crore shares outstanding. At a P/E of 12, what is the share price (₹)?", "explanation": "EPS = 10.000; price = 120.00.", "answer": {"value": 120.0, "format": "inr2", "tolerance_abs": 0.24}}, {"id": "BF-0214", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 2, "stem": "A company earns net profit of ₹74 crore with 9 crore shares outstanding. At a P/E of 38, what is the share price (₹)?", "explanation": "EPS = 8.222; price = 312.44.", "answer": {"value": 312.444444, "format": "inr2", "tolerance_abs": 0.624888888}}, {"id": "BF-0215", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 2, "stem": "A company's share price is ₹150; it has 32 crore shares. It also has debt of ₹950 crore and cash of ₹310 crore. Compute enterprise value (₹ crore) = market cap + debt − cash.", "explanation": "Market cap = 4800; EV = 4800+950−310 = 5440.", "answer": {"value": 5440, "format": "num", "tolerance_abs": 27.2}}, {"id": "BF-0216", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 2, "stem": "A company's share price is ₹700; it has 22 crore shares. It also has debt of ₹500 crore and cash of ₹260 crore. Compute enterprise value (₹ crore) = market cap + debt − cash.", "explanation": "Market cap = 15400; EV = 15400+500−260 = 15640.", "answer": {"value": 15640, "format": "num", "tolerance_abs": 78.2}}, {"id": "BF-0217", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 2, "stem": "A company's share price is ₹700; it has 38 crore shares. It also has debt of ₹1200 crore and cash of ₹40 crore. Compute enterprise value (₹ crore) = market cap + debt − cash.", "explanation": "Market cap = 26600; EV = 26600+1200−40 = 27760.", "answer": {"value": 27760, "format": "num", "tolerance_abs": 138.8}}, {"id": "BF-0218", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 2, "stem": "A company's share price is ₹730; it has 11 crore shares. It also has debt of ₹800 crore and cash of ₹350 crore. Compute enterprise value (₹ crore) = market cap + debt − cash.", "explanation": "Market cap = 8030; EV = 8030+800−350 = 8480.", "answer": {"value": 8480, "format": "num", "tolerance_abs": 42.4}}, {"id": "BF-0219", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 2, "stem": "A firm has equity ₹510 crore (cost 15%) and debt ₹440 crore (pre-tax cost 8%); tax rate 25%. Compute WACC.", "explanation": "(510×0.15+440×0.0600)/950 = 10.832%.", "answer": {"value": 0.108316, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "BF-0220", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 2, "stem": "A firm has equity ₹520 crore (cost 12%) and debt ₹440 crore (pre-tax cost 9%); tax rate 25%. Compute WACC.", "explanation": "(520×0.12+440×0.0675)/960 = 9.594%.", "answer": {"value": 0.095937, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "BF-0221", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 2, "stem": "A firm has equity ₹600 crore (cost 14%) and debt ₹360 crore (pre-tax cost 9%); tax rate 25%. Compute WACC.", "explanation": "(600×0.14+360×0.0675)/960 = 11.281%.", "answer": {"value": 0.112813, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "BF-0222", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 2, "stem": "A firm has equity ₹720 crore (cost 14%) and debt ₹300 crore (pre-tax cost 11%); tax rate 25%. Compute WACC.", "explanation": "(720×0.14+300×0.0825)/1020 = 12.309%.", "answer": {"value": 0.123088, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "BF-0223", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 2, "stem": "A firm has ₹100 crore of debt at 12% interest and a 22% tax rate. What is the annual interest tax shield (₹ crore)?", "explanation": "Interest 12.0 × 22% = 2.64.", "answer": {"value": 2.64, "format": "num", "tolerance_abs": 0.013200000000000002}}, {"id": "BF-0224", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 2, "stem": "A firm has ₹200 crore of debt at 10% interest and a 30% tax rate. What is the annual interest tax shield (₹ crore)?", "explanation": "Interest 20.0 × 30% = 6.00.", "answer": {"value": 6.0, "format": "num", "tolerance_abs": 0.03}}, {"id": "BF-0225", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 2, "stem": "A firm has ₹200 crore of debt at 12% interest and a 25% tax rate. What is the annual interest tax shield (₹ crore)?", "explanation": "Interest 24.0 × 25% = 6.00.", "answer": {"value": 6.0, "format": "num", "tolerance_abs": 0.03}}, {"id": "BF-0226", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 2, "stem": "A firm has ₹600 crore of debt at 8% interest and a 22% tax rate. What is the annual interest tax shield (₹ crore)?", "explanation": "Interest 48.0 × 22% = 10.56.", "answer": {"value": 10.56, "format": "num", "tolerance_abs": 0.05280000000000001}}, {"id": "BF-0227", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 2, "stem": "Net profit is ₹105 crore and shareholders' equity is ₹552 crore. Compute ROE.", "explanation": "105/552 = 19.02%.", "answer": {"value": 0.190217, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "BF-0228", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 2, "stem": "Net profit is ₹120 crore and shareholders' equity is ₹866 crore. Compute ROE.", "explanation": "120/866 = 13.86%.", "answer": {"value": 0.138568, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "BF-0229", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 2, "stem": "Net profit is ₹185 crore and shareholders' equity is ₹1588 crore. Compute ROE.", "explanation": "185/1588 = 11.65%.", "answer": {"value": 0.116499, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "BF-0230", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 2, "stem": "Net profit is ₹95 crore and shareholders' equity is ₹731 crore. Compute ROE.", "explanation": "95/731 = 13.00%.", "answer": {"value": 0.129959, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "BF-0231", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 3, "stem": "A company has EBITDA of ₹110 crore and comparable firms trade at 12x EV/EBITDA. Net debt is ₹250 crore and there are 31 crore shares. What is the implied value per share (₹)?", "explanation": "EV = 1320; equity = 1320−250 = 1070; per share = 34.52.", "answer": {"value": 34.516129, "format": "inr2", "tolerance_abs": 0.069032258}}, {"id": "BF-0232", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 3, "stem": "A company has EBITDA of ₹120 crore and comparable firms trade at 7x EV/EBITDA. Net debt is ₹750 crore and there are 17 crore shares. What is the implied value per share (₹)?", "explanation": "EV = 840; equity = 840−750 = 90; per share = 5.29.", "answer": {"value": 5.294118, "format": "inr2", "tolerance_abs": 0.010588236000000001}}, {"id": "BF-0233", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 3, "stem": "A company has EBITDA of ₹150 crore and comparable firms trade at 6x EV/EBITDA. Net debt is ₹800 crore and there are 19 crore shares. What is the implied value per share (₹)?", "explanation": "EV = 900; equity = 900−800 = 100; per share = 5.26.", "answer": {"value": 5.263158, "format": "inr2", "tolerance_abs": 0.010526315999999999}}, {"id": "BF-0234", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 3, "stem": "A company has EBITDA of ₹250 crore and comparable firms trade at 12x EV/EBITDA. Net debt is ₹250 crore and there are 40 crore shares. What is the implied value per share (₹)?", "explanation": "EV = 3000; equity = 3000−250 = 2750; per share = 68.75.", "answer": {"value": 68.75, "format": "inr2", "tolerance_abs": 0.1375}}, {"id": "BF-0235", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 3, "stem": "A firm's revenue is ₹1000L, net profit ₹88L, total assets ₹1174L and equity ₹451L. Using DuPont, what is the equity multiplier (assets ÷ equity)?", "explanation": "1174/451 = 2.603. (ROE = margin × turnover × multiplier = 19.51%.)", "answer": {"value": 2.603104, "format": "x", "tolerance_abs": 0.013015520000000001}}, {"id": "BF-0236", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 3, "stem": "A firm's revenue is ₹1100L, net profit ₹68L, total assets ₹1368L and equity ₹775L. Using DuPont, what is the equity multiplier (assets ÷ equity)?", "explanation": "1368/775 = 1.765. (ROE = margin × turnover × multiplier = 8.77%.)", "answer": {"value": 1.765161, "format": "x", "tolerance_abs": 0.01}}, {"id": "BF-0237", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 3, "stem": "A firm's revenue is ₹800L, net profit ₹55L, total assets ₹1135L and equity ₹358L. Using DuPont, what is the equity multiplier (assets ÷ equity)?", "explanation": "1135/358 = 3.170. (ROE = margin × turnover × multiplier = 15.36%.)", "answer": {"value": 3.170391, "format": "x", "tolerance_abs": 0.015851955}}, {"id": "BF-0238", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 3, "stem": "A firm's revenue is ₹900L, net profit ₹50L, total assets ₹912L and equity ₹373L. Using DuPont, what is the equity multiplier (assets ÷ equity)?", "explanation": "912/373 = 2.445. (ROE = margin × turnover × multiplier = 13.40%.)", "answer": {"value": 2.44504, "format": "x", "tolerance_abs": 0.0122252}}, {"id": "BF-0239", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "mcq", "difficulty": 2, "stem": "A company has net profit ₹18 crore and 6 crore shares. The market gives it a P/E of 20. What is the implied share price and what does the P/E signal?", "explanation": "EPS = 18/6 = 3; price = 3×20 = 60. High P/E often reflects growth expectations (or risk).", "options": [{"label": "A", "text": "₹360; price = net profit × P/E ÷ 1 crore"}, {"label": "B", "text": "Cannot be determined without the dividend payout ratio"}, {"label": "C", "text": "₹60; investors pay ₹20 per ₹1 of annual earnings, signalling expectations of faster future earnings growth"}, {"label": "D", "text": "₹3; the P/E equals the price when profit and shares are known"}], "correct_option": "C"}, {"id": "BF-0240", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "mcq", "difficulty": 2, "stem": "A company's dividend yield is 6%, far above peers, and its payout ratio is 140% of earnings. What does this suggest?", "explanation": "Payout above 100% can't continue without drawing on reserves or debt.", "options": [{"label": "A", "text": "Debt must be zero"}, {"label": "B", "text": "The stock is certainly undervalued"}, {"label": "C", "text": "Earnings are growing rapidly"}, {"label": "D", "text": "The dividend may be unsustainable because it exceeds earnings"}], "correct_option": "D"}, {"id": "BF-0241", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "mcq", "difficulty": 2, "stem": "ROE rises from 12% to 18% solely because the firm took on more debt. What is the right conclusion?", "explanation": "DuPont: equity multiplier boosts ROE at the cost of risk.", "options": [{"label": "A", "text": "Asset turnover must have risen"}, {"label": "B", "text": "The firm became more efficient operationally"}, {"label": "C", "text": "Leverage magnified returns but also raised financial risk; operating performance did not necessarily improve"}, {"label": "D", "text": "Risk fell because ROE rose"}], "correct_option": "C"}, {"id": "BF-0242", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "mcq", "difficulty": 2, "stem": "Two firms have equal profits, but A trades at P/E 12 and B at P/E 30. What does this most likely imply?", "explanation": "P/E embeds growth and risk expectations; not proof of mispricing.", "options": [{"label": "A", "text": "The market expects B to grow earnings faster or considers it less risky"}, {"label": "B", "text": "B is certainly overvalued"}, {"label": "C", "text": "A is more profitable"}, {"label": "D", "text": "B has higher dividends"}], "correct_option": "A"}, {"id": "BF-0243", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "mcq", "difficulty": 2, "stem": "Why is EV/EBITDA often preferred to P/E when comparing companies with different debt levels?", "explanation": "EV/EBITDA is capital-structure-neutral.", "options": [{"label": "A", "text": "EV includes debt and EBITDA is before interest, so it is less affected by capital structure"}, {"label": "B", "text": "It cannot be affected by accounting policies"}, {"label": "C", "text": "It uses market price of equity only"}, {"label": "D", "text": "It ignores tax completely and always favours highly levered firms"}], "correct_option": "A"}, {"id": "BF-0244", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "mcq", "difficulty": 1, "stem": "Negative working capital in a supermarket chain usually signals:", "explanation": "Fast cash sales with slow supplier payment can produce negative WC as a healthy model; it's not automatically distress.", "options": [{"label": "A", "text": "Imminent insolvency in every case"}, {"label": "B", "text": "Customers pay at the till while suppliers are paid after weeks, so suppliers effectively finance operations"}, {"label": "C", "text": "That the company has no current assets"}, {"label": "D", "text": "Excessive inventory"}], "correct_option": "B"}, {"id": "BF-0245", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "mcq", "difficulty": 1, "stem": "Which item is NOT part of working capital?", "explanation": "Working capital covers current assets and current liabilities only.", "options": [{"label": "A", "text": "Trade receivables"}, {"label": "B", "text": "Trade payables"}, {"label": "C", "text": "Inventory"}, {"label": "D", "text": "Long-term bank loan repayable in 7 years"}], "correct_option": "D"}, {"id": "BF-0246", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "mcq", "difficulty": 2, "stem": "A manufacturer cuts inventory days from 80 to 50 without changing sales. What happens?", "explanation": "Lower inventory days free cash; the trade-off is availability risk.", "options": [{"label": "A", "text": "Payable days automatically rise by 30"}, {"label": "B", "text": "Net profit falls because holding inventory earns income"}, {"label": "C", "text": "Cash conversion cycle shortens and cash is released, though stock-outs may raise service risk"}, {"label": "D", "text": "Gross margin must rise by the same percentage"}], "correct_option": "C"}, {"id": "BF-0247", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "mcq", "difficulty": 2, "stem": "A retailer's receivable days rise from 30 to 55 while sales stay flat. What is the most direct impact?", "explanation": "Slower collection ties up cash; profit is unaffected unless bad debts follow.", "options": [{"label": "A", "text": "Inventory turnover rises automatically"}, {"label": "B", "text": "More cash is locked in receivables, so working capital needs and possibly borrowing rise"}, {"label": "C", "text": "Profit falls by the same amount as the extra receivables"}, {"label": "D", "text": "Depreciation increases"}], "correct_option": "B"}, {"id": "BF-0248", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "mcq", "difficulty": 2, "stem": "A supplier offers a 2% discount for payment within 10 days instead of net 40. Annualised, this discount is approximately:", "explanation": "2/98 × 365/30 ≈ 24.8% annualised.", "options": [{"label": "A", "text": "Exactly 12%"}, {"label": "B", "text": "2% — a trivial saving"}, {"label": "C", "text": "Over 24% — taking the discount is attractive unless the firm can borrow at a higher cost"}, {"label": "D", "text": "About 6%"}], "correct_option": "C"}, {"id": "BF-0249", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "mcq", "difficulty": 2, "stem": "If a company extends customers' credit terms from 30 to 60 days to boost sales, what must be compared?", "explanation": "Credit is a financing decision with costs.", "options": [{"label": "A", "text": "The extra contribution from added sales against the financing cost and bad-debt risk of slower collection"}, {"label": "B", "text": "Nothing, since credit is free"}, {"label": "C", "text": "Only sales growth"}, {"label": "D", "text": "Only the cost of goods sold"}], "correct_option": "A"}, {"id": "BF-0250", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "mcq", "difficulty": 3, "stem": "Company A has a current ratio of 2.0 (mostly inventory); Company B has 1.2 (mostly cash and receivables). In a sudden liquidity squeeze which is more likely to meet obligations?", "explanation": "Quality of current assets matters; the quick ratio is a better test.", "options": [{"label": "A", "text": "A, because inventory is as liquid as cash"}, {"label": "B", "text": "Neither, because liquidity depends only on profit"}, {"label": "C", "text": "B may be better placed because its current assets are more liquid; inventory may sell slowly or at a discount"}, {"label": "D", "text": "A, because a higher current ratio always means greater liquidity"}], "correct_option": "C"}, {"id": "PF-0001", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "mcq", "difficulty": 1, "stem": "FOMO in a hot IPO frenzy typically causes investors to:", "explanation": "Fear of missing out drives momentum chasing.", "options": [{"label": "A", "text": "Ignore social media"}, {"label": "B", "text": "Pay high prices based on others' returns instead of valuation"}, {"label": "C", "text": "Reduce position sizes"}, {"label": "D", "text": "Become more patient"}], "correct_option": "B"}, {"id": "PF-0002", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "mcq", "difficulty": 1, "stem": "Which approach best counters emotion-driven investing?", "explanation": "Pre-commitment reduces behavioural errors.", "options": [{"label": "A", "text": "Waiting for a 'sure' signal"}, {"label": "B", "text": "Following tips from social media"}, {"label": "C", "text": "A written plan with automatic SIPs and periodic rebalancing rules"}, {"label": "D", "text": "Checking prices hourly"}], "correct_option": "C"}, {"id": "PF-0003", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "mcq", "difficulty": 2, "stem": "A trader sells winning stocks quickly to 'lock in gains' but holds losing stocks for years. This is the:", "explanation": "People sell winners early and ride losers.", "options": [{"label": "A", "text": "Disposition effect"}, {"label": "B", "text": "Mean reversion"}, {"label": "C", "text": "Rebalancing discipline"}, {"label": "D", "text": "Equity risk premium"}], "correct_option": "A"}, {"id": "PF-0004", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "mcq", "difficulty": 2, "stem": "After a friend's tip that a stock will 'double', an investor reads only articles supporting the thesis and dismisses critical reports. Which bias is this?", "explanation": "Seeking evidence that supports prior beliefs.", "options": [{"label": "A", "text": "Home bias"}, {"label": "B", "text": "Availability heuristic"}, {"label": "C", "text": "Confirmation bias"}, {"label": "D", "text": "Hindsight bias"}], "correct_option": "C"}, {"id": "PF-0005", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "mcq", "difficulty": 2, "stem": "An investor beats the market for two years with a few lucky bets, doubles his concentrated position and says 'I've cracked it.' Which bias is most relevant?", "explanation": "Short track records are poor evidence of skill.", "options": [{"label": "A", "text": "Overconfidence driven by attributing luck to skill"}, {"label": "B", "text": "Status quo bias"}, {"label": "C", "text": "Mental accounting"}, {"label": "D", "text": "Loss aversion"}], "correct_option": "A"}, {"id": "PF-0006", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "mcq", "difficulty": 2, "stem": "An investor refuses to sell a stock bought at ₹500 now trading at ₹300, saying 'I'll sell when it gets back to ₹500.' This is most closely:", "explanation": "The purchase price is irrelevant to future returns.", "options": [{"label": "A", "text": "Anchoring on the purchase price combined with reluctance to realise a loss (disposition effect)"}, {"label": "B", "text": "Diversification"}, {"label": "C", "text": "Rational rebalancing"}, {"label": "D", "text": "Herding"}], "correct_option": "A"}, {"id": "PF-0007", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "mcq", "difficulty": 2, "stem": "An investor says: 'I bought at the peak, so I must wait to break even before selling.' The most rational response is:", "explanation": "Break-even is irrelevant; forward-looking comparison matters.", "options": [{"label": "A", "text": "Hold until the price reaches the purchase price"}, {"label": "B", "text": "Evaluate whether the asset is the best use of the money today, ignoring the purchase price"}, {"label": "C", "text": "Sell all other assets"}, {"label": "D", "text": "Buy more to average the price"}], "correct_option": "B"}, {"id": "PF-0008", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "mcq", "difficulty": 2, "stem": "Keeping 90% of savings in the bank because 'that's what my parents did' without comparing alternatives is:", "explanation": "Preference for the default.", "options": [{"label": "A", "text": "Status quo bias"}, {"label": "B", "text": "Overconfidence"}, {"label": "C", "text": "Herding"}, {"label": "D", "text": "Loss aversion only"}], "correct_option": "A"}, {"id": "PF-0009", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "mcq", "difficulty": 2, "stem": "People feel the pain of a ₹10,000 loss more strongly than the joy of a ₹10,000 gain. This asymmetry is called:", "explanation": "Prospect theory.", "options": [{"label": "A", "text": "Loss aversion"}, {"label": "B", "text": "Time preference"}, {"label": "C", "text": "Inflation illusion"}, {"label": "D", "text": "Risk-free arbitrage"}], "correct_option": "A"}, {"id": "PF-0010", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "mcq", "difficulty": 2, "stem": "Someone treats a tax refund as 'free money' and spends it on a luxury item while carrying credit-card debt at 40% interest. This reflects:", "explanation": "Money is not fungible in the person's mind.", "options": [{"label": "A", "text": "Compound interest"}, {"label": "B", "text": "Inflation illusion"}, {"label": "C", "text": "Diversification"}, {"label": "D", "text": "Mental accounting"}], "correct_option": "D"}, {"id": "PF-0011", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "mcq", "difficulty": 3, "stem": "A mid-cap stock has risen 180% in three months with no change in fundamentals. Priya's college WhatsApp group and two colleagues are buying and posting gains; she buys too — 'so many people can't be wrong.' A week later it falls 40% in a day. What behavioural trap led to her decision?", "explanation": "Her stated reason is social proof, which is herding. Recency and FOMO can co-exist, but the decision rule she articulates is imitation.", "options": [{"label": "A", "text": "Anchoring — she anchored on her colleagues' expectations"}, {"label": "B", "text": "Herding — she followed the crowd's actions instead of doing her own analysis"}, {"label": "C", "text": "Loss aversion — she bought only to avoid realising a loss"}, {"label": "D", "text": "Recency bias — the 180% rise dominated her thinking about the stock's future"}], "correct_option": "B"}, {"id": "PF-0012", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "mcq", "difficulty": 3, "stem": "After reading about a recent plane crash, a traveller buys a large travel insurance policy for every trip but ignores far likelier medical risks. Which heuristic is at work?", "explanation": "Salient events distort probability estimates.", "options": [{"label": "A", "text": "Home bias"}, {"label": "B", "text": "Availability heuristic — vivid recent events seem more probable"}, {"label": "C", "text": "Hindsight bias"}, {"label": "D", "text": "Anchoring"}], "correct_option": "B"}, {"id": "PF-0013", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "mcq", "difficulty": 3, "stem": "An investor sells all equity after a 30% market fall 'to stop the pain', then waits two years to re-enter and misses most of the recovery. Which lesson best captures what went wrong?", "explanation": "Selling in panic converts temporary declines into permanent losses.", "options": [{"label": "A", "text": "The investor should have borrowed to buy more"}, {"label": "B", "text": "Selling is always better than holding"}, {"label": "C", "text": "Markets never recover, so selling was right"}, {"label": "D", "text": "Emotion-driven exits crystallise losses and risk missing the rebound; a pre-set allocation and rebalancing plan reduces this"}], "correct_option": "D"}, {"id": "PF-0014", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "mcq", "difficulty": 3, "stem": "In early 2020 small-caps in Rohan's portfolio fell 55%. He sold them all and moved to large-caps. Four years later small-caps have recovered and outperformed by a wide margin, yet he still refuses them: 'I saw what they can do.' Which pattern best explains his ongoing decision?", "explanation": "The refusal persists years after recovery, driven by the emotional pain of the loss. Recency would favour the recent recovery, not a crash four years ago; nothing in the stem shows market-timing confidence or inertia.", "options": [{"label": "A", "text": "Overconfidence — he thinks he can time small-cap markets consistently"}, {"label": "B", "text": "Recency bias — he overweights the single vivid crash and ignores four years of strong recovery"}, {"label": "C", "text": "Loss aversion — he avoids small-caps to prevent the pain of another loss, putting pain-avoidance ahead of analysis"}, {"label": "D", "text": "Status quo bias — switching back from the default requires effort"}], "correct_option": "C"}, {"id": "PF-0015", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "mcq", "difficulty": 3, "stem": "In mid-2021 a fund manager published a report with only Buy ratings on real-estate stocks. The sector fell 25% next year. She now says, 'I always had reservations about leverage; I discussed it internally, I just didn't publish it.' Which bias is most evident?", "explanation": "The published record shows no reservations; claiming she 'always knew' after the fall is hindsight bias.", "options": [{"label": "A", "text": "Confirmation bias — she selectively highlights bearish remarks while ignoring her published view"}, {"label": "B", "text": "Overconfidence — she still believes her Buy ratings were right"}, {"label": "C", "text": "Anchoring — she is stuck at mid-2021 peak prices"}, {"label": "D", "text": "Hindsight bias — she is retroactively rewriting her past beliefs to match the outcome"}], "correct_option": "D"}, {"id": "PF-0016", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "numeric", "difficulty": 2, "stem": "A bond with face value ₹1,000 and a 6% coupon trades at ₹1012. What is its current yield?", "explanation": "Coupon ₹60/1012 = 5.93%.", "answer": {"value": 0.059289, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "PF-0017", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "numeric", "difficulty": 2, "stem": "A bond with face value ₹1,000 and a 6% coupon trades at ₹1014. What is its current yield?", "explanation": "Coupon ₹60/1014 = 5.92%.", "answer": {"value": 0.059172, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "PF-0018", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "numeric", "difficulty": 2, "stem": "A bond with face value ₹1,000 and a 6% coupon trades at ₹1097. What is its current yield?", "explanation": "Coupon ₹60/1097 = 5.47%.", "answer": {"value": 0.054695, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "PF-0019", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "numeric", "difficulty": 2, "stem": "A bond with face value ₹1,000 and a 8% coupon trades at ₹918. What is its current yield?", "explanation": "Coupon ₹80/918 = 8.71%.", "answer": {"value": 0.087146, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "PF-0020", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "numeric", "difficulty": 3, "stem": "A zero-coupon bond (₹2,00,000 face, 9 years). If the required return rises from 4% to 5%, by what % does its price fall?", "explanation": "Price ratio = ((1+0.04)/(1+0.05))^9 → fall = 8.25%.", "answer": {"value": 0.082521, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "PF-0021", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "numeric", "difficulty": 3, "stem": "A zero-coupon bond (₹5,00,000 face, 10 years). If the required return rises from 4% to 7%, by what % does its price fall?", "explanation": "Price ratio = ((1+0.04)/(1+0.07))^10 → fall = 24.75%.", "answer": {"value": 0.247519, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "PF-0022", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "numeric", "difficulty": 3, "stem": "A zero-coupon bond (₹6,00,000 face, 5 years). If the required return rises from 6% to 8%, by what % does its price fall?", "explanation": "Price ratio = ((1+0.06)/(1+0.08))^5 → fall = 8.92%.", "answer": {"value": 0.089226, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "PF-0023", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "numeric", "difficulty": 3, "stem": "A zero-coupon bond (₹7,00,000 face, 10 years). If the required return rises from 5% to 6%, by what % does its price fall?", "explanation": "Price ratio = ((1+0.05)/(1+0.060000000000000005))^10 → fall = 9.04%.", "answer": {"value": 0.090434, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "PF-0024", "section_code": "PF", "r1_topic": "Income, tax and budgeting", "type": "mcq", "difficulty": 1, "stem": "An emergency fund should typically be:", "explanation": "Liquidity and stability matter.", "options": [{"label": "A", "text": "Only a month of income in crypto"}, {"label": "B", "text": "3–6 months of essential expenses in liquid, low-risk instruments"}, {"label": "C", "text": "Zero if you have a credit card"}, {"label": "D", "text": "12 months of luxury spending in equity"}], "correct_option": "B"}, {"id": "PF-0025", "section_code": "PF", "r1_topic": "Income, tax and budgeting", "type": "mcq", "difficulty": 1, "stem": "Lifestyle inflation means:", "explanation": "Higher income with the same savings rate gains little.", "options": [{"label": "A", "text": "Falling prices of lifestyle products"}, {"label": "B", "text": "A tax on lifestyle goods"}, {"label": "C", "text": "Spending rising in step with income, so savings rate does not improve"}, {"label": "D", "text": "Inflation caused by luxury goods"}], "correct_option": "C"}, {"id": "PF-0026", "section_code": "PF", "r1_topic": "Income, tax and budgeting", "type": "mcq", "difficulty": 1, "stem": "The 50/30/20 guideline suggests allocating income to:", "explanation": "A simple budgeting heuristic.", "options": [{"label": "A", "text": "50% wants, 30% needs, 20% tax"}, {"label": "B", "text": "50% savings, 30% rent, 20% fun"}, {"label": "C", "text": "50% needs, 30% wants, 20% savings and debt repayment"}, {"label": "D", "text": "100% investments"}], "correct_option": "C"}, {"id": "PF-0027", "section_code": "PF", "r1_topic": "Income, tax and budgeting", "type": "mcq", "difficulty": 1, "stem": "Which gives a better picture of financial health: income or net worth?", "explanation": "High income with high debt can still mean low net worth.", "options": [{"label": "A", "text": "Credit card limit"}, {"label": "B", "text": "Neither matters"}, {"label": "C", "text": "Income, as it shows spending power only"}, {"label": "D", "text": "Net worth, because it captures what you own minus what you owe"}], "correct_option": "D"}, {"id": "PF-0028", "section_code": "PF", "r1_topic": "Income, tax and budgeting", "type": "mcq", "difficulty": 1, "stem": "Which is the best description of 'paying yourself first'?", "explanation": "Automation prevents spending the savings.", "options": [{"label": "A", "text": "Paying all bills late"}, {"label": "B", "text": "Automatically transferring a fixed amount to savings/investments as soon as income arrives"}, {"label": "C", "text": "Spending first and saving what remains"}, {"label": "D", "text": "Withdrawing savings monthly"}], "correct_option": "B"}, {"id": "PF-0029", "section_code": "PF", "r1_topic": "Income, tax and budgeting", "type": "mcq", "difficulty": 2, "stem": "A person earns ₹80,000/month, spends ₹55,000 on needs and wants and invests ₹10,000. What is the most accurate description of the remaining ₹15,000?", "explanation": "Unassigned money leaks; zero-based budgeting gives every rupee a job.", "options": [{"label": "A", "text": "It is an expense that reduces net worth"}, {"label": "B", "text": "Unallocated surplus that should be assigned to goals (emergency fund, debt repayment, investments) or it tends to leak into spending"}, {"label": "C", "text": "It should always go to a savings account earning zero interest"}, {"label": "D", "text": "It is a guaranteed saving because it was not spent"}], "correct_option": "B"}, {"id": "PF-0030", "section_code": "PF", "r1_topic": "Income, tax and budgeting", "type": "mcq", "difficulty": 2, "stem": "Sameer has ₹1,50,000 in a 5-year locked FD, ₹40,000 in NPS, ₹65,000 in savings and ₹20,000 in a liquid fund. Which amount counts towards his emergency fund?", "explanation": "Only accessible assets count.", "options": [{"label": "A", "text": "₹1,90,000 (FD + NPS)"}, {"label": "B", "text": "₹2,75,000 (everything)"}, {"label": "C", "text": "₹65,000 (savings only)"}, {"label": "D", "text": "₹85,000 (savings + liquid fund)"}], "correct_option": "D"}, {"id": "PF-0031", "section_code": "PF", "r1_topic": "Time value of money and compounding", "type": "numeric", "difficulty": 1, "stem": "A deposit pays 6% nominal, compounded 2 times a year. What is the effective annual rate?", "explanation": "(1+0.06/2)^2−1 = 6.090%.", "answer": {"value": 0.0609, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "PF-0032", "section_code": "PF", "r1_topic": "Time value of money and compounding", "type": "numeric", "difficulty": 1, "stem": "A deposit pays 9% nominal, compounded 12 times a year. What is the effective annual rate?", "explanation": "(1+0.09/12)^12−1 = 9.381%.", "answer": {"value": 0.093807, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "PF-0033", "section_code": "PF", "r1_topic": "Time value of money and compounding", "type": "numeric", "difficulty": 1, "stem": "A deposit pays 9% nominal, compounded 4 times a year. What is the effective annual rate?", "explanation": "(1+0.09/4)^4−1 = 9.308%.", "answer": {"value": 0.093083, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "PF-0034", "section_code": "PF", "r1_topic": "Time value of money and compounding", "type": "numeric", "difficulty": 1, "stem": "₹2,78,000 grew to ₹9,75,000 in 8 years. What is the CAGR?", "explanation": "(975000/278000)^(1/8)−1 = 16.98%.", "answer": {"value": 0.169823, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "PF-0035", "section_code": "PF", "r1_topic": "Time value of money and compounding", "type": "numeric", "difficulty": 1, "stem": "₹55,000 grew to ₹1,03,000 in 5 years. What is the CAGR?", "explanation": "(103000/55000)^(1/5)−1 = 13.37%.", "answer": {"value": 0.133692, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "PF-0036", "section_code": "PF", "r1_topic": "Time value of money and compounding", "type": "numeric", "difficulty": 1, "stem": "₹90,000 grew to ₹2,07,000 in 7 years. What is the CAGR?", "explanation": "(207000/90000)^(1/7)−1 = 12.64%.", "answer": {"value": 0.126355, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "PF-0037", "section_code": "PF", "r1_topic": "Time value of money and compounding", "type": "numeric", "difficulty": 1, "stem": "₹95,000 grew to ₹1,20,000 in 4 years. What is the CAGR?", "explanation": "(120000/95000)^(1/4)−1 = 6.01%.", "answer": {"value": 0.060143, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "PF-0038", "section_code": "PF", "r1_topic": "Time value of money and compounding", "type": "numeric", "difficulty": 2, "stem": "How much must be invested today in an FD paying 10% p.a. compounded quarterly to reach ₹11,00,000 in 9 years?", "explanation": "1,100,000/(1+0.1/4)^36 = 452,203.", "answer": {"value": 452203.095631, "format": "inr", "tolerance_abs": 904.406191262}}, {"id": "PF-0039", "section_code": "PF", "r1_topic": "Time value of money and compounding", "type": "numeric", "difficulty": 2, "stem": "How much must be invested today in an FD paying 10% p.a. compounded quarterly to reach ₹26,00,000 in 5 years?", "explanation": "2,600,000/(1+0.1/4)^20 = 1,586,704.", "answer": {"value": 1586704.451433, "format": "inr", "tolerance_abs": 3173.408902866}}, {"id": "PF-0040", "section_code": "PF", "r1_topic": "Time value of money and compounding", "type": "numeric", "difficulty": 2, "stem": "How much must be invested today in an FD paying 6% p.a. compounded quarterly to reach ₹16,00,000 in 4 years?", "explanation": "1,600,000/(1+0.06/4)^16 = 1,260,850.", "answer": {"value": 1260849.662912, "format": "inr", "tolerance_abs": 2521.699325824}}, {"id": "PF-0041", "section_code": "PF", "r1_topic": "Time value of money and compounding", "type": "numeric", "difficulty": 2, "stem": "How much must be invested today in an FD paying 6% p.a. compounded quarterly to reach ₹28,00,000 in 7 years?", "explanation": "2,800,000/(1+0.06/4)^28 = 1,845,478.", "answer": {"value": 1845477.898181, "format": "inr", "tolerance_abs": 3690.955796362}}, {"id": "PF-0042", "section_code": "PF", "r1_topic": "Time value of money and compounding", "type": "numeric", "difficulty": 2, "stem": "Rohan invests ₹15,000 at the end of every month for 9 years in a fund earning 12% p.a. (compounded monthly). What is the final value?", "explanation": "FV of an ordinary annuity = 2,893,389.", "answer": {"value": 2893388.688997, "format": "inr", "tolerance_abs": 5786.777377994}}, {"id": "PF-0043", "section_code": "PF", "r1_topic": "Time value of money and compounding", "type": "numeric", "difficulty": 2, "stem": "Sana invests ₹6,000 at the end of every month for 8 years in a fund earning 11% p.a. (compounded monthly). What is the final value?", "explanation": "FV of an ordinary annuity = 917,185.", "answer": {"value": 917184.508182, "format": "inr", "tolerance_abs": 1834.3690163640001}}, {"id": "PF-0044", "section_code": "PF", "r1_topic": "Time value of money and compounding", "type": "numeric", "difficulty": 2, "stem": "Tanvi invests ₹11,000 at the end of every month for 5 years in a fund earning 11% p.a. (compounded monthly). What is the final value?", "explanation": "FV of an ordinary annuity = 874,699.", "answer": {"value": 874698.876544, "format": "inr", "tolerance_abs": 1749.397753088}}, {"id": "PF-0045", "section_code": "PF", "r1_topic": "Time value of money and compounding", "type": "numeric", "difficulty": 2, "stem": "To build ₹46,00,000 in 10 years at 11% p.a. (monthly compounding, end-of-month investments), what monthly SIP is needed?", "explanation": "SIP = G·r/((1+r)^n−1) = 21,198.", "answer": {"value": 21198.338528, "format": "inr", "tolerance_abs": 42.396677056}}, {"id": "PF-0046", "section_code": "PF", "r1_topic": "Time value of money and compounding", "type": "numeric", "difficulty": 2, "stem": "To build ₹47,00,000 in 7 years at 9% p.a. (monthly compounding, end-of-month investments), what monthly SIP is needed?", "explanation": "SIP = G·r/((1+r)^n−1) = 40,369.", "answer": {"value": 40368.667822, "format": "inr", "tolerance_abs": 80.73733564400001}}, {"id": "PF-0047", "section_code": "PF", "r1_topic": "Time value of money and compounding", "type": "numeric", "difficulty": 2, "stem": "To build ₹61,00,000 in 20 years at 13% p.a. (monthly compounding, end-of-month investments), what monthly SIP is needed?", "explanation": "SIP = G·r/((1+r)^n−1) = 5,383.", "answer": {"value": 5382.785055, "format": "inr", "tolerance_abs": 10.76557011}}, {"id": "PF-0048", "section_code": "PF", "r1_topic": "Time value of money and compounding", "type": "numeric", "difficulty": 2, "stem": "To build ₹69,00,000 in 11 years at 10% p.a. (monthly compounding, end-of-month investments), what monthly SIP is needed?", "explanation": "SIP = G·r/((1+r)^n−1) = 28,887.", "answer": {"value": 28887.154635, "format": "inr", "tolerance_abs": 57.774309269999996}}, {"id": "PF-0049", "section_code": "PF", "r1_topic": "Time value of money and compounding", "type": "numeric", "difficulty": 2, "stem": "Using the Rule of 72, what annual return is needed to grow money ion_code": "PF", "r1_topic": "Time value of money and compounding", "type": "numeric", "difficulty": 3, "stem": "₹28,00,000 grows at a gross 11% p.a. in two funds: one with expense ratio 0.8%, the other 2.0%. After 15 years (net return = gross − expense ratio), how much more does the cheaper fund hold?", "explanation": "Net 0.1020 vs 0.0900; difference after 15 years = 1,820,426.", "answer": {"value": 1820425.880433, "format": "inr", "tolerance_abs": 3640.851760866}}, {"id": "PF-0065", "section_code": "PF", "r1_topic": "Time value of money and compounding", "type": "numeric", "difficulty": 3, "stem": "₹9,00,000 grows at a gross 12% p.a. in two funds: one with expense ratio 1.0%, the other 2.4%. After 12 years (net return = gross − expense ratio), how much more does the cheaper fund hold?", "explanation": "Net 0.1100 vs 0.0960; difference after 12 years = 444,839.", "answer": {"value": 444839.183921, "format": "inr", "tolerance_abs": 889.678367842}}, {"id": "PF-0066", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "mcq", "difficulty": 1, "stem": "Owning ten stocks from the same sector provides:", "explanation": "Concentration in one sector remains.", "options": [{"label": "A", "text": "Zero risk"}, {"label": "B", "text": "Full diversification"}, {"label": "C", "text": "Limited diversification because they share sector risk"}, {"label": "D", "text": "Guaranteed returns"}], "correct_option": "C"}, {"id": "PF-0067", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "mcq", "difficulty": 1, "stem": "Rebalancing a portfolio back to 60:40 after equity rallies means:", "explanation": "Rebalancing enforces buy-low/sell-high discipline.", "options": [{"label": "A", "text": "Buying more equity"}, {"label": "B", "text": "Selling bonds"}, {"label": "C", "text": "Selling some equity and buying bonds to restore target weights"}, {"label": "D", "text": "Doing nothing"}], "correct_option": "C"}, {"id": "PF-0068", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "mcq", "difficulty": 1, "stem": "Which investor most needs a high allocation to liquid, low-risk assets?", "explanation": "Short horizon ⇒ capital preservation.", "options": [{"label": "A", "text": "A 25-year-old saving for retirement"}, {"label": "B", "text": "One who needs the money for a down payment in 12 months"}, {"label": "C", "text": "One with a 30-year horizon"}, {"label": "D", "text": "One with large unused credit limits"}], "correct_option": "B"}, {"id": "PF-0069", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "mcq", "difficulty": 2, "stem": "Portfolio A (60% equity, 40% bonds) and Portfolio B (100% equity). In a severe equity crash, which will usually fall less?", "explanation": "Asset allocation drives risk.", "options": [{"label": "A", "text": "Both will fall equally"}, {"label": "B", "text": "B, since equity has no downside"}, {"label": "C", "text": "B, because equities rebound"}, {"label": "D", "text": "A, because the bond portion cushions the fall"}], "correct_option": "D"}, {"id": "PF-0070", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "mcq", "difficulty": 3, "stem": "An investor compares four 50:50 two-asset portfolios with Indian equity: Nifty Next 50 (corr +0.95), corporate bonds (+0.55), G-Secs (−0.30), listed real estate (+0.80). Which gives the strongest genuine diversification in a downturn?", "explanation": "Lower (especially negative) correlation reduces risk the most.", "options": [{"label": "A", "text": "Listed real estate (+0.80), since property is an independent asset class"}, {"label": "B", "text": "G-Secs (correlation −0.30), because they tend to move opposite to equity in stress"}, {"label": "C", "text": "Corporate bonds (+0.55), because credit spreads widen alongside equity selloffs"}, {"label": "D", "text": "Nifty Next 50 (+0.95), because it is a different set of stocks"}], "correct_option": "B"}, {"id": "PF-0071", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "mcq", "difficulty": 3, "stem": "An investor holds both government bonds and equity mutual funds. A friend asks: 'Why hold bonds when equity gives better long-term returns?' What is the most logically useful reason to hold both?", "explanation": "Diversification works through imperfect or negative correlation, smoothing the portfolio.", "options": [{"label": "A", "text": "Bonds and equities rise together in bull markets, compounding returns during growth"}, {"label": "B", "text": "Bonds often hold steady or rise when equity falls, so negative correlation reduces portfolio volatility without sacrificing all long-term returns"}, {"label": "C", "text": "Bonds are more liquid than equity funds, giving faster access to cash in a bear run"}, {"label": "D", "text": "Indian tax law treats long-term bond gains better than equity gains under the new regime"}], "correct_option": "B"}, {"id": "PF-0072", "section_code": "PF", "r1_topic": "Investments and investment behaviour", "type": "mcq", "difficulty": 3, "stem": "Two investors each hold 50% Indian equity. One adds 50% in a gold ETF (correlation about 0.0 to equity), the other adds 50% in a second Indian equity index fund (correlation about 0.95). Which statement is most accurate?", "explanation": "Diversification benefit rises as correlation falls.", "options": [{"label": "A", "text": "The gold combination offers real diversification; the second equity fund adds little because the two move almost together"}, {"label": "B", "text": "The two equity funds diversify best since both are equity and grow together"}, {"label": "C", "text": "Both give identical risk because each is 50:50"}, {"label": "D", "text": "The gold combination has higher risk because assets differ"}], "correct_option": "A"}, {"id": "PF-0073", "section_code": "PF", "r1_topic": "Insurance and risk", "type": "mcq", "difficulty": 1, "stem": "Before investing through an adviser, you should verify:", "explanation": "Registration provides recourse.", "options": [{"label": "A", "text": "That they promise returns"}, {"label": "B", "text": "That they are a friend"}, {"label": "C", "text": "That they have many followers"}, {"label": "D", "text": "That the adviser is registered with the appropriate regulator"}], "correct_option": "D"}, {"id": "PF-0074", "section_code": "PF", "r1_topic": "Insurance and risk", "type": "mcq", "difficulty": 2, "stem": "An unregulated scheme promises 3% monthly returns with referral bonuses. This is most likely:", "explanation": "Unsustainable returns and referral rewards signal a Ponzi scheme.", "options": [{"label": "A", "text": "A Ponzi/pyramid structure where early investors are paid from later deposits"}, {"label": "B", "text": "A bank FD"}, {"label": "C", "text": "A safe government plan"}, {"label": "D", "text": "A regulated mutual fund"}], "correct_option": "A"}, {"id": "PF-0075", "section_code": "PF", "r1_topic": "Insurance and risk", "type": "mcq", "difficulty": 2, "stem": "You receive a message: 'Your KYC expires today; click the link and enter your OTP.' What should you do?", "explanation": "OTP phishing is a common scam.", "options": [{"label": "A", "text": "Ignore and report it; banks never ask for OTPs via links"}, {"label": "B", "text": "Share the OTP to avoid account closure"}, {"label": "C", "text": "Forward it to friends"}, {"label": "D", "text": "Click the link immediately"}], "correct_option": "A"}, {"id": "PF-0076", "section_code": "PF", "r1_topic": "Net worth and goals", "type": "mcq", "difficulty": 1, "stem": "For a goal 3 years away, which allocation is most appropriate?", "explanation": "Short horizon → capital stability.", "options": [{"label": "A", "text": "100% small-cap equity"}, {"label": "B", "text": "100% unlisted shares"}, {"label": "C", "text": "Mostly low-volatility debt instruments"}, {"label": "D", "text": "100% crypto"}], "correct_option": "C"}, {"id": "PF-0077", "section_code": "PF", "r1_topic": "Net worth and goals", "type": "mcq", "difficulty": 1, "stem": "Which is a SMART financial goal?", "explanation": "Specific, measurable, time-bound.", "options": [{"label": "A", "text": "Invest someday"}, {"label": "B", "text": "Get rich"}, {"label": "C", "text": "Save more"}, {"label": "D", "text": "Save ₹5 lakh for a down payment by December 2028 via ₹14,000 monthly SIP"}], "correct_option": "D"}, {"id": "PF-0078", "section_code": "PF", "r1_topic": "Net worth and goals", "type": "mcq", "difficulty": 1, "stem": "Why should financial plans include inflation?", "explanation": "Goals are priced in future rupees.", "options": [{"label": "A", "text": "Inflation never affects goals"}, {"label": "B", "text": "It guarantees returns"}, {"label": "C", "text": "Because future costs rise, so the target corpus must be larger than today's price"}, {"label": "D", "text": "It reduces taxes"}], "correct_option": "C"}, {"id": "PF-0079", "section_code": "PF", "r1_topic": "Net worth and goals", "type": "mcq", "difficulty": 2, "stem": "A couple has two goals: a down payment in 4 years and retirement in 30. What is the sensible approach?", "explanation": "Goal-based investing.", "options": [{"label": "A", "text": "Fund each goal with an asset mix matching its horizon rather than one combined portfolio"}, {"label": "B", "text": "Put everything in equity"}, {"label": "C", "text": "Put everything in FDs"}, {"label": "D", "text": "Ignore the retirement goal"}], "correct_option": "A"}, {"id": "PF-0080", "section_code": "PF", "r1_topic": "Time value of money and compounding", "type": "mcq", "difficulty": 2, "stem": "After tax, an FD's return can be below inflation. What does this mean for purchasing power?", "explanation": "Negative real return erodes value.", "options": [{"label": "A", "text": "It doubles"}, {"label": "B", "text": "Money in the FD loses real value even though the balance grows in rupee terms"}, {"label": "C", "text": "Purchasing power rises"}, {"label": "D", "text": "It is unaffected"}], "correct_option": "B"}, {"id": "PF-0081", "section_code": "PF", "r1_topic": "Time value of money and compounding", "type": "mcq", "difficulty": 2, "stem": "An FD pays 7% and inflation is 6%. The approximate real return before tax is:", "explanation": "Real ≈ nominal − inflation.", "options": [{"label": "A", "text": "−6%"}, {"label": "B", "text": "13%"}, {"label": "C", "text": "About 1%"}, {"label": "D", "text": "7%"}], "correct_option": "C"}, {"id": "PF-0082", "section_code": "PF", "r1_topic": "Time value of money and compounding", "type": "mcq", "difficulty": 2, "stem": "Education costs rising 8% a year will cause a ₹10 lakh course to cost roughly how much in 9 years?", "explanation": "Rule of 72: 72/8 = 9 years to double.", "options": [{"label": "A", "text": "₹12 lakh"}, {"label": "B", "text": "About ₹20 lakh"}, {"label": "C", "text": "₹10 lakh"}, {"label": "D", "text": "₹80 lakh"}], "correct_option": "B"}, {"id": "PF-0083", "section_code": "PF", "r1_topic": "Insurance and risk", "type": "mcq", "difficulty": 1, "stem": "A high deductible health plan typically has:", "explanation": "Trade-off between premium and cost-sharing.", "options": [{"label": "A", "text": "Zero claim risk"}, {"label": "B", "text": "Higher premiums"}, {"label": "C", "text": "Lower premiums but higher out-of-pocket cost when claims arise"}, {"label": "D", "text": "No deductible"}], "correct_option": "C"}, {"id": "PF-0084", "section_code": "PF", "r1_topic": "Insurance and risk", "type": "mcq", "difficulty": 1, "stem": "Adverse selection in health insurance occurs when:", "explanation": "Information asymmetry.", "options": [{"label": "A", "text": "People who expect higher claims are more likely to buy cover, raising insurer costs"}, {"label": "B", "text": "Insurers deny all claims"}, {"label": "C", "text": "Healthy people are charged more"}, {"label": "D", "text": "Policies are cancelled at renewal"}], "correct_option": "A"}, {"id": "PF-0085", "section_code": "PF", "r1_topic": "Insurance and risk", "type": "mcq", "difficulty": 1, "stem": "Moral hazard in insurance means:", "explanation": "Behaviour changes after coverage.", "options": [{"label": "A", "text": "Insured people may take more risk because they are protected"}, {"label": "B", "text": "Only sick people buy insurance"}, {"label": "C", "text": "Premiums rise with inflation"}, {"label": "D", "text": "Insurers charge too much"}], "correct_option": "A"}, {"id": "PF-0086", "section_code": "PF", "r1_topic": "Insurance and risk", "type": "mcq", "difficulty": 1, "stem": "The main purpose of term life insurance is:", "explanation": "Term cover is pure protection.", "options": [{"label": "A", "text": "Saving tax only"}, {"label": "B", "text": "Income protection for dependants in case of the policyholder's death"}, {"label": "C", "text": "Investing for returns"}, {"label": "D", "text": "Retirement income"}], "correct_option": "B"}, {"id": "PF-0087", "section_code": "PF", "r1_topic": "Insurance and risk", "type": "mcq", "difficulty": 1, "stem": "Why should you not buy insurance primarily as an investment?", "explanation": "Buy term + invest separately is a common principle.", "options": [{"label": "A", "text": "Mixing protection and investment often means inadequate cover and weak returns versus keeping them separate"}, {"label": "B", "text": "Insurers cannot invest"}, {"label": "C", "text": "Returns are always negative"}, {"label": "D", "text": "Taxes make it illegal"}], "correct_option": "A"}, {"id": "PF-0088", "section_code": "PF", "r1_topic": "Insurance and risk", "type": "mcq", "difficulty": 2, "stem": "Naina compares Policy P (₹9,000, no deductible) and Q (₹4,000, ₹20,000 deductible per claim) with a 15% claim probability. The expected cost of Q is:", "explanation": "Expected cost = premium + p × deductible = 7,000 < 9,000.", "options": [{"label": "A", "text": "₹7,000 (4,000 + 0.15 × 20,000), making Q cheaper than P"}, {"label": "B", "text": "₹ ons", "type": "sheet", "difficulty": 3, "stem": "A company has revenue ₹1500L, net profit ₹155L, total assets ₹2059L and shareholders' equity ₹1109L. Using the DuPont identity (net margin × asset turnover × equity multiplier), calculate ROE.", "explanation": "155/1500 × 1500/2059 × 2059/1109 = 155/1109 = 13.98%.", "answer": {"value": 0.139766, "format": "pct", "tolerance_abs": 0.0005}, "sheet": {"rows": [{"row": 1, "label": "Revenue (₹ lakh)", "format": "num", "value": 1500, "cells": "B1"}, {"row": 2, "label": "Net profit (₹ lakh)", "format": "num", "value": 155, "cells": "B2"}, {"row": 3, "label": "Total assets (₹ lakh)", "format": "num", "value": 2059, "cells": "B3"}, {"row": 4, "label": "Shareholders' equity (₹ lakh)", "format": "num", "value": 1109, "cells": "B4"}], "answer_cell": "B5", "answer_label": "ROE (format as %)", "solution_formula": "=(B2/B1)*(B1/B3)*(B3/B4)"}}, {"id": "SM-0248", "section_code": "SM", "r1_topic": "Formulae and Foundations", "type": "sheet", "difficulty": 3, "stem": "A company has revenue ₹1500L, net profit ₹83L, total assets ₹1326L and shareholders' equity ₹793L. Using the DuPont identity (net margin × asset turnover × equity multiplier), calculate ROE.", "explanation": "83/1500 × 1500/1326 × 1326/793 = 83/793 = 10.47%.", "answer": {"value": 0.104666, "format": "pct", "tolerance_abs": 0.0005}, "sheet": {"rows": [{"row": 1, "label": "Revenue (₹ lakh)", "format": "num", "value": 1500, "cells": "B1"}, {"row": 2, "label": "Net profit (₹ lakh)", "format": "num", "value": 83, "cells": "B2"}, {"row": 3, "label": "Total assets (₹ lakh)", "format": "num", "value": 1326, "cells": "B3"}, {"row": 4, "label": "Shareholders' equity (₹ lakh)", "format": "num", "value": 793, "cells": "B4"}], "answer_cell": "B5", "answer_label": "ROE (format as %)", "solution_formula": "=(B2/B1)*(B1/B3)*(B3/B4)"}}, {"id": "SM-0249", "section_code": "SM", "r1_topic": "Formulae and Foundations", "type": "sheet", "difficulty": 3, "stem": "A company has revenue ₹2300L, net ["Sales from (₹)", "Commission rate"], "origin": "A1", "rows": [[0, 0], [50000, 0.02], [100000, 0.035], [200000, 0.05]]}, "answer_cell": "E2", "answer_label": "Commission (₹)", "solution_formula": "=E1*VLOOKUP(E1,A2:B5,2,TRUE)"}}, {"id": "SM-0254", "section_code": "SM", "r1_topic": "Lookups and data joins", "type": "sheet", "difficulty": 2, "stem": "Slab lower limits are in A2:A5 and rates in B2:B5. E1 holds income ₹9,50,000. Return the rate of the band the income falls in (as a decimal).", "explanation": "MATCH with type 1 returns the position of the largest limit ≤ 950,000, which is 800,000 (3rd). INDEX gives 10%.", "answer": {"value": 0.1, "format": "pct", "tolerance_abs": 0.0001}, "sheet": {"rows": [{"row": 1, "label": "Income (₹)", "format": "num", "value": 950000, "cells": "E1"}], "table": {"headers": ["Income from (₹)", "Rate"], "origin": "A1", "rows": [[0, 0], [400000, 0.05], [800000, 0.1], [1200000, 0.15]]}, "answer_cell": "E2", "answer_label": "Band rate", "solution_formula": "=INDEX(B2:B5,MATCH(E1,A2:A5,1))"}}, {"id": "SM-0255", "section_code": "SM", "r1_topic": "Lookups and data joins", "type": "sheet", "difficulty": 3, "stem": "Sales by region and quarter are in A1:E4. G1 holds the region South and G2 holds the quarter Q3. Return the matching sales using a two-way lookup.", "explanation": "Row match gives 2 (South), column match gives 3 (Q3). INDEX(B2:E4,2,3) = 110.", "answer": {"value": 110, "format": "num", "tolerance_abs": 0.01}, "sheet": {"rows": [{"row": 1, "label": "Region", "format": "text", "value": "South", "cells": "G1"}, {"row": 2, "label": "Quarter", "format": "text", "value": "Q3", "cells": "G2"}], "table": {"headers": ["Region", "Q1", "Q2", "Q3", "Q4"], "origin": "A1", "rows": [["North", 120, 135, 150, 160], ["South", 90, 95, 110, 105], ["East", 70, 85, 80, 100]]}, "answer_cell": "G3", "answer_label": "Sales", "solution_formula": "=INDEX(B2:E4,MATCH(G1,A2:A4,0),MATCH(G2,B1:E1,0))"}}, {"id": "SM-0256", "section_code": "SM", "r1_topic": "Lookups and data joins", "type": "sheet", "difficulty": 2, "stem": "SKUs are in A2:A5 and status in B2:B5. E1 holds K19, which is not in the list. Return the status, or the text Not stocked when the SKU is missing, using XLOOKUP.", "explanation": "XLOOKUP's fourth argument is the value returned when there is no match, so no IFERROR is needed.", "answer": {"value": "Not stocked", "format": "text", "tolerance_abs": 0}, "sheet": {"rows": [{"row": 1, "label": "SKU", "format": "text", "value": "K19", "cells": "E1"}], "table": {"headers": ["SKU", "Status"], "origin": "A1", "rows": [["K10", "In stock"], ["K11", "Low"], ["K12", "In stock"], ["K13", "Out"]]}, "answer_cell": "E2", "answer_label": "Status", "solution_formula": "=XLOOKUP(E1,A2:A5,B2:B5,\"Not stocked\")"}}, {"id": "SM-0257", "section_code": "SM", "r1_topic": "Formulae and Foundations", "type": "sheet", "difficulty": 2, "stem": "Sales lines are in A2:C9. Find total revenue for region North AND product Pen using one function.", "explanation": "North+Pen rows are 400, 310 and 90. In SUMIFS the sum range comes first.", "answer": {"value": 800, "format": "num", "tolerance_abs": 0.01}, "sheet": {"rows": [{"row": 1, "label": "Region", "format": "text", "value": "North", "cells": "E1"}, {"row": 2, "label": "Product", "format": "text", "value": "Pen", "cells": "E2"}], "table": {"headers": ["Region", "Product", "Revenue (₹)"], "origin": "A1", "rows": [["North", "Pen", 400], ["North", "Marker", 650], ["South", "Pen", 520], ["North", "Pen", 310], ["East", "Pen", 280], ["South", "Marker", 700], ["North", "Marker", 150], ["North", "Pen", 90]]}, "answer_cell": "E3", "answer_label": "Revenue (₹)", "solution_formula": "=SUMIFS(C2:C9,A2:A9,E1,B2:B9,E2)"}}, {"id": "SM-0258", "section_code": "SM", "r1_topic": "Formulae and Foundations", "type": "sheet", "difficulty": 2, "stem": "Using the same sales table in A2:C9, count how many lines are for region South OR have revenue above ₹500. (Hint: COUNTIFS cannot do OR directly.)", "explanation": "South lines: 2. Revenue above 500: 650, 520 and 700, so 3. Lines that are both: 520 and 700, so 2. OR count = 2 + 3 − 2 = 3. Adding the two counts double-counts the overlap, so subtract it.", "answer": {"value": 3, "format": "int", "tolerance_abs": 0.5}, "sheet": {"rows": [{"row": 1, "label": "Region", "format": "text", "value": "South", "cells": "E1"}, {"row": 2, "label": "Threshold (₹)", "format": "num", "value": 500, "cells": "E2"}], "table": {"headers": ["Region", "Product", "Revenue (₹)"], "origin": "A1", "rows": [["North", "Pen", 400], ["North", "Marker", 650], ["South", "Pen", 520], ["North", "Pen", 310], ["East", "Pen", 280], ["South", "Marker", 700], ["North", "Marker", 150], ["North", "Pen", 90]]}, "answer_cell": "E3", "answer_label": "Count of lines", "solution_formula": "=COUNTIF(A2:A9,E1)+COUNTIF(C2:C9,\">\"&E2)-COUNTIFS(A2:A9,E1,C2:C9,\">\"&E2)"}}, {"id": "SM-0259", "section_code": "SM", "r1_topic": "Lookups and data joins", "type": "sheet", "difficulty": 3, "stem": "A price list is in A2:B5 and an order list (code in D2:D4, quantity in E2:E4). Compute the total order value with a single formula that joins the lists on the code.", "explanation": "SUMIF looks up the price of each ordered code (55, 40, 70). Times quantities 10, 20, 5: 550 + 800 + 350 = 1,700.", "answer": {"value": 1700, "format": "num", "tolerance_abs": 0.01}, "sheet": {"rows": [], "table": {"headers": ["Code", "Price (₹)", "", "Order code", "Qty"], "origin": "A1", "rows": [["A1", 40, "", "B2", 10], ["B2", 55, "", "A1", 20], ["C3", 70, "", "C3", 5], ["D4", 95, "", "", ""]]}, "answer_cell": "G1", "answer_label": "Order value (₹)", "solution_formula": "=SUMPRODUCT(SUMIF(A2:A5,D2:D4,B2:B5),E2:E4)"}}, {"id": "SM-0260", "section_code": "SM", "r1_topic": "Lookups and data joins", "type": "sheet", "difficulty": 2, "stem": "IDs are in A2:A5 and amounts in B2:B5. ID 501 appears twice. What does =VLOOKUP(501,A2:B5,2,FALSE) return?", "explanation": "VLOOKUP stops at the first match, so the second 501 row (4,800) is never seen. Use SUMIF if you need the total.", "answer": {"value": 2000, "format": "num", "tolerance_abs": 0.01}, "sheet": {"rows": [], "table": {"headers": ["ID", "Amount (₹)"], "origin": "A1", "rows": [[501, 2000], [502, 3500], [501, 4800], [503, 1200]]}, "answer_cell": "D1", "answer_label": "Result", "solution_formula": "=VLOOKUP(501,A2:B5,2,FALSE)"}}, {"id": "SM-0261", "section_code": "SM", "r1_topic": "Lookups and data joins", "type": "sheet", "difficulty": 1, "stem": "Items are in A2:A6. Return the position of Marker in that range.", "explanation": "MATCH returns the relative position inside the range, not the sheet row. Marker is 3rd in A2:A6.", "answer": {"value": 3, "format": "int", "tolerance_abs": 0.5}, "sheet": {"rows": [], "table": {"headers": ["Item"], "origin": "A1", "rows": [["Notebook"], ["Pen"], ["Marker"], ["Folder"], ["Stapler"]]}, "answer_cell": "C1", "answer_label": "Position", "solution_formula": "=MATCH(\"Marker\",A2:A6,0)"}}, {"id": "SM-0262", "section_code": "SM", "r1_topic": "Lookups and data joins", "type": "sheet", "difficulty": 1, "stem": "Grade boundaries are in A2:B6, sorted ascending. E1 holds marks 72. Return the grade.", "explanation": "72 is at least 70 but below 85, so the largest limit not above 72 is 70, grade B.", "answer": {"value": "B", "format": "text", "tolerance_abs": 0}, "sheet": {"rows": [{"row": 1, "label": "Marks", "format": "num", "value": 72, "cells": "E1"}], "table": {"headers": ["Marks from", "Grade"], "origin": "A1", "rows": [[0, "F"], [40, "D"], [55, "C"], [70, "B"], [85, "A"]]}, "answer_cell": "E2", "answer_label": "Grade", "solution_formula": "=VLOOKUP(E1,A2:B6,2,TRUE)"}}, {"id": "SM-0263", "section_code": "SM", "r1_topic": "Formulae and Foundations", "type": "sheet", "difficulty": 1, "stem": "Fixed cost ₹1,25,000, price ₹80, variable cost ₹35 per unit. How many whole units must be sold to break even? Use a function that never leaves you short.", "explanation": "125,000 / 45 = 2,777.8, so 2,778 units. ROUNDUP is the safe habit: if the result were 2,777.4, ROUND would give 2,777 and leave you short of break-even.", "answer": {"value": 2778, "format": "int", "tolerance_abs": 0.5}, "sheet": {"rows": [{"row": 1, "label": "Fixed cost (₹)", "format": "num", "value": 125000, "cells": "B1"}, {"row": 2, "label": "Price (₹)", "format": "num", "value": 80, "cells": "B2"}, {"row": 3, "label": "Variable cost (₹)", "format": "num", "value": 35, "cells": "B3"}], "table": null, "answer_cell": "B4", "answer_label": "Break-even units", "solution_formula": "=ROUNDUP(B1/(B2-B3),0)"}}, {"id": "SM-0264", "section_code": "SM", "r1_topic": "Formulae and Foundations", "type": "sheet", "difficulty": 2, "stem": "Weights are in B2:B4 and scores in C2:C4. Compute the weighted average score.", "explanation": "0.4×82 + 0.35×74 + 0.25×90 = 32.8 + 25.9 + 22.5 = 81.2.", "answer": {"value": 81.2, "format": "num", "tolerance_abs": 0.01}, "sheet": {"rows": [], "table": {"headers": ["Subject", "Weight", "Score"], "origin": "A1", "rows": [["Maths", 0.4, 82], ["Economics", 0.35, 74], ["English", 0.25, 90]]}, "answer_cell": "E1", "answer_label": "Weighted score", "solution_formula": "=SUMPRODUCT(B2:B4,C2:C4)"}}, {"id": "SM-0265", "section_code": "SM", "r1_topic": "Formulae and Foundations", "type": "sheet", "difficulty": 2, "stem": "Sales are in B1. Bonus rule: nothing below ₹5 lakh; 2% of sales from ₹5 lakh to under ₹10 lakh; 3% from ₹10 lakh. Sales are ₹7,40,000. Use a nested IF.", "explanation": "Test the highest tier first. 7,40,000 is in the 2% band: 14,800.", "answer": {"value": 14800, "format": "inr", "tolerance_abs": 1}, "sheet": {"rows": [{"row": 1, "label": "Sales (₹)", "format": "num", "value": 740000, "cells": "B1"}], "table": null, "answer_cell": "B2", "answer_label": "Bonus (₹)", "solution_formula": "=IF(B1>=1000000,B1*3%,IF(B1>=500000,B1*2%,0))"}}, {"id": "SM-0266", "section_code": "SM", "r1_topic": "Formulae and Foundations", "type": "mcq", "difficulty": 1, "stem": "Cell C2 holds =B2*$F$1. You copy it to C3. What does C3 contain?", "explanation": "Relative parts (B2) shift down one row; $F$1 is fully locked, so it stays.", "options": [{"label": "A", "text": "=B3*$F$2"}, {"label": "B", "text": "=B3*$F$1"}, {"label": "C", "text": "=B2*$F$1"}, {"label": "D", "text": "=B3*F2"}], "correct_option": "B"}, {"id": "SM-0267", "section_code": "SM", "r1_topic": "Formulae and Foundations", "type": "mcq", "difficulty": 2, "stem": "Cell D2 holds =B2*D$1 (a tax rate in row 1 for each column). You copy it one column right and one row down to E3. What does E3 contain?", "explanation": "B2 moves one column and one row to C3. D$1 keeps row 1 but the column moves to E, giving E$1.", "options": [{"label": "A", "text": "=C3*D$1"}, {"label": "B", "text": "=C3*E$2"}, {"label": "C", "text": "=B2*E$1"}, {"label": "D", "text": "=C3*E$1"}], "correct_option": "D"}, {"id": "SM-0268", "section_code": "SM", "r1_topic": "Formulae and Foundations", "type": "mcq", "difficulty": 1, "stem": "Which is the correct argument order?", "explanation": "SUMIFS puts the range to add first. SUMIF puts it last, which is the common mix-up.", "options": [{"label": "A", "text": "SUMIFS(sum_range, criterion1, criteria_range1)"}, {"label": "B", "text": "SUMIFS(criteria_range1, criterion1, sum_range)"}, {"label": "C", "text": "SUMIFS(sum_range, criteria_range1, criterion1, ...)"}, {"label": "D", "text": "SUMIFS(criterion1, criteria_range1, sum_range)"}], "correct_option": "C"}, {"id": "SM-0269", "section_code": "SM", "r1_topic": "Formulae and Foundations", "type": "mcq", "difficulty": 2, "stem": "A column of amounts imported from a bank statement is left-aligned and =SUM returns 0. The most likely cause is:", "explanation": "Left-aligned numbers are text. Convert with VALUE(), multiply by 1, or Text-to-Columns.", "options": [{"label": "A", "text": "The numbers are stored as text"}, {"label": "B", "text": "SUM does not work on imported data"}, {"label": "C", "text": "The numbers are negative"}, {"label": "D", "text": "The column has too many rows"}], "correct_option": "A"}, {"id": "SM-0270", "section_code": "SM", "r1_topic": "Formulae and Foundations", "type": "mcq", "difficulty": 2, "stem": "You need the number of whole delivery trucks for 1,230 boxes when each truck carries 100. Which formula is right?", "explanation": "12.3 trucks means 13 are needed. ROUND gives 12 and ROUNDDOWN 12, both short.", "options": [{"label": "A", "text": "=ROUNDUP(1230/100,0)"}, {"label": "B", "text": "=ROUND(1230/100,0)"}, {"label": "C", "text": "=ROUNDDOWN(1230/100,0)"}, {"label": "D", "text": "=1230/100"}], "correct_option": "A"}, {"id": "SM-0271", "section_code": "SM", "r1_topic": "Formulae and Foundations", "type": "mcq", "difficulty": 2, "stem": "B2 holds the rate 8%. What does =100*(1+B2)^3 return?", "explanation": "1.08^3 = 1.259712, so 125.97. Adding 8% three times (124) is simple interest.", "options": [{"label": "A", "text": "126.00"}, {"label": "B", "text": "125.97"}, {"label": "C", "text": "108.00"}, {"label": "D", "text": "124.00"}], "correct_option": "B"}, {"id": "SM-0272", "section_code": "SM", "r1_topic": "Formulae and Foundations", "type": "mcq", "difficulty": 1, "stem": "A cell formatted as % shows 12%. What value does the cell actually hold?", "explanation": "Percent format only changes the display. Typing 12% stores 0.12.", "options": [{"label": "A", "text": "0.012"}, {"label": "B", "text": "1.2"}, {"label": "C", "text": "12"}, {"label": "D", "text": "0.12"}], "correct_option": "D"}, {"id": "SM-0273", "section_code": "SM", "r1_topic": "Formulae and Foundations", "type": "mcq", "difficulty": 3, "stem": "=IF(A1>=50,\"Pass\",IF(A1>=35,\"Grace\",\"Fail\")) is entered for marks. If the order of the two tests were swapped, what goes wrong?", "explanation": "IF stops at the first true test. Testing >=35 first catches 80 as true, returning Grace.", "options": [{"label": "A", "text": "Nothing; the result is identical"}, {"label": "B", "text": "The formula returns an error"}, {"label": "C", "text": "Every mark of 35 or more would show Grace, so nobody would ever pass"}, {"label": "D", "text": "Only marks of exactly 50 are affected"}], "correct_option": "C"}, {"id": "SM-0274", "section_code": "SM", "r1_topic": "Formulae and Foundations", "type": "mcq", "difficulty": 2, "stem": "Which function returns the date 6 months after the date in A1?", "explanation": "A1+6 adds 6 days. EDATE moves by calendar months.", "options": [{"label": "A", "text": "=EDATE(A1,6)"}, {"label": "B", "text": "=DATEDIF(A1,6)"}, {"label": "C", "text": "=A1+6"}, {"label": "D", "text": "=MONTH(A1)+6"}], "correct_option": "A"}, {"id": "SM-0275", "section_code": "SM", "r1_topic": "Formulae and Foundations", "type": "mcq", "difficulty": 2, "stem": "=COUNTA(A1:A10) differs from =COUNT(A1:A10) because COUNTA:", "explanation": "COUNT counts numeric cells; COUNTA counts anything not empty.", "options": [{"label": "A", "text": "Counts only blank cells"}, {"label": "B", "text": "Counts all non-blank cells, including text"}, {"label": "C", "text": "Counts only numbers"}, {"label": "D", "text": "Counts only text"}], "correct_option": "B"}, {"id": "SM-0276", "section_code": "SM", "r1_topic": "Financial Functions", "type": "mcq", "difficulty": 2, "stem": "=PMT(9%/12,60,2500000) returns a negative number. The cleanest way to display the EMI as a positive figure is:", "explanation": "Cash you receive (the loan) is positive, so the payment you owe comes out negative. Flip the sign, keeping monthly rate and months consistent.", "options": [{"label": "A", "text": "=ABS(PMT(9%,5,2500000))"}, {"label": "B", "text": "=-PMT(9%/12,60,2500000)"}, {"label": "C", "text": "=PMT(9%/12,60,-2500000*-1)"}, {"label": "D", "text": "=PMT(9%,60,2500000)"}], "correct_option": "B"}, {"id": "SM-0277", "section_code": "SM", "r1_topic": "Financial Functions", "type": "mcq", "difficulty": 2, "stem": "Cash flows: C1 = −5,00,000 (today), C2:C6 = inflows for years 1 to 5. The correct NPV is:", "explanation": "NPV discounts the first value by one period. Today's outflow must sit outside the function.", "options": [{"label": "A", "text": "=NPV(rate,C1:C6)*(1+rate)^-1"}, {"label": "B", "text": "=NPV(rate,C1:C6)"}, {"label": "C", "text": "=NPV(rate,C2:C6)"}, {"label": "D", "text": "=NPV(rate,C2:C6)+C1"}], "correct_option": "D"}, {"id": "SM-0278", "section_code": "SM", "r1_topic": "Financial Functions", "type": "mcq", "difficulty": 2, "stem": "For SIP of ₹5,000 at the START of every month, the FV function needs which setting?", "explanation": "type 1 means payments at the beginning of each period (annuity due). Use monthly rate and months.", "options": [{"label": "A", "text": "rate as annual %"}, {"label": "B", "text": "nper in years"}, {"label": "C", "text": "type = 1"}, {"label": "D", "text": "type = 0"}], "correct_option": "C"}, {"id": "SM-0279", "section_code": "SM", "r1_topic": "Financial Functions", "type": "mcq", "difficulty": 3, "stem": "Why does =IRR(A1:A5) return #NUM! for the cash flows 100, 200, 300, 400, 500?", "explanation": "IRR needs a sign change. With only inflows, NPV is positive at every rate.", "options": [{"label": "A", "text": "IRR needs at least 10 values"}, {"label": "B", "text": "IRR cannot handle round numbers"}, {"label": "C", "text": "There is no negative cash flow, so no rate can make NPV zero"}, {"label": "D", "text": "The values must be sorted"}], "correct_option": "C"}, {"id": "SM-0280", "section_code": "SM", "r1_topic": "Financial Functions", "type": "mcq", "difficulty": 3, "stem": "You use =NPER(1.5%,-15000,300000). What does it return?", "explanation": "Rate 1.5% a month, payment −15,000, loan +300,000. The result is a number of periods.", "options": [{"label": "A", "text": "About 24 months to clear the loan"}, {"label": "B", "text": "The balance after 15 months"}, {"label": "C", "text": "The interest paid"}, {"label": "D", "text": "About 300 months"}], "correct_option": "A"}, {"id": "SM-0281", "section_code": "SM", "r1_t
