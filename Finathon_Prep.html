<title>Finathon Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: a ledger-paper workspace. Left rail of topics, a reading column, and a drill desk that works one question at a time. */
:root{
  --bg:#EFF1EA; --surface:#FAFAF6; --surface2:#E6EAE1; --ink:#13211C; --muted:#56655F; --rule:#CFD6CB;
  --accent:#0E6B58; --accent-ink:#FFFFFF; --accent-soft:#D7EBE3; --gold:#A8610A; --gold-soft:#F6E7CC;
  --good:#1D7A3C; --good-soft:#DCEFE2; --bad:#B3261E; --bad-soft:#F6DBD8; --focus:#0E6B58;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1613; --surface:#14211C; --surface2:#1C2D26; --ink:#E4EDE8; --muted:#97A9A1; --rule:#2B3F37;
  --accent:#4FC3A5; --accent-ink:#06211A; --accent-soft:#17352C; --gold:#E3A24A; --gold-soft:#3A2D14;
  --good:#5BC27F; --good-soft:#163523; --bad:#F08A82; --bad-soft:#3E1B18; --focus:#4FC3A5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1613; --surface:#14211C; --surface2:#1C2D26; --ink:#E4EDE8; --muted:#97A9A1; --rule:#2B3F37;
  --accent:#4FC3A5; --accent-ink:#06211A; --accent-soft:#17352C; --gold:#E3A24A; --gold-soft:#3A2D14;
  --good:#5BC27F; --good-soft:#163523; --bad:#F08A82; --bad-soft:#3E1B18; --focus:#4FC3A5; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15.5px/1.6 var(--f-body);padding-inline:16px;margin:0}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto;padding-block:0 56px}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap;margin-inline:-16px;padding-inline:16px}
.brand{font:700 22px/1 var(--f-display);letter-spacing:-.01em;margin-right:auto;display:flex;align-items:baseline;gap:8px}
.brand small{font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.tabs{display:flex;gap:4px}
.tab{background:none;border:1px solid transparent;border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab:hover:not([aria-selected="true"]){border-color:var(--rule);color:var(--ink)}
.iconbtn{background:none;border:1px solid var(--rule);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted)}
/* study layout */
.study{display:grid;grid-template-columns:270px minmax(0,1fr);gap:40px;padding-top:28px}
.rail{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - 90px);overflow:auto;padding-right:6px}
.rail h4{font:500 11px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.rail h4:first-child{margin-top:0}
.rail button{display:flex;width:100%;text-align:left;gap:8px;background:none;border:0;border-radius:6px;padding:7px 8px;cursor:pointer;color:var(--ink);line-height:1.35}
.rail button:hover{background:var(--surface2)}
.rail button[aria-current="true"]{background:var(--accent-soft);font-weight:600}
.rail .dot{flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);margin-top:6px}
.rail .dot.done{background:var(--good);border-color:var(--good)}
.rail .emph{font:500 10px var(--f-mono);color:var(--gold);margin-left:auto;white-space:nowrap;align-self:center}
.mobsel{display:none}
.reader{min-width:0;max-width:760px}
.crumb{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.reader h1{font:700 clamp(30px,5vw,44px)/1.08 var(--f-display);letter-spacing:-.02em;margin:6px 0 10px;text-wrap:balance}
.reader h3{font:700 21px/1.25 var(--f-display);margin:34px 0 8px;text-wrap:balance}
.reader p,.reader li{max-width:68ch}
.reader ul,.reader ol{padding-left:22px}
.reader li{margin:4px 0}
.reader .lead{font-size:18px;line-height:1.55;color:var(--ink);border-bottom:1px solid var(--rule);padding-bottom:20px;margin-bottom:6px}
code{font:400 .88em var(--f-mono);background:var(--surface2);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.fx{font:400 14px/1.7 var(--f-mono);background:var(--surface2);border-radius:6px;padding:10px 14px;margin:10px 0;overflow-x:auto;white-space:normal}
.fx code{background:none;padding:0}
.why,.eg,.trap,.try{border-radius:8px;padding:12px 16px;margin:16px 0;font-size:15px}
.why{background:var(--accent-soft)}
.eg{background:var(--surface);border:1px solid var(--rule)}
.trap{background:var(--gold-soft)}
.try{border:1.5px dashed var(--accent)}
.eg table,.why table{margin:10px 0}
.tw{overflow-x:auto;margin:12px 0;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
.tw table{border-collapse:collapse;width:100%;min-width:420px;font-size:14.5px}
.tw th{background:var(--surface2);text-align:left;font-weight:600}
.tw th,.tw td{padding:7px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
.tw tr:last-child td{border-bottom:0}
.tw td:has(b){font-variant-numeric:tabular-nums}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px;padding-top:20px;border-top:1px solid var(--rule)}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* overview */
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:22px}
.part{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px}
.part h2{font:700 20px var(--f-display);margin:0 0 4px}
.part p{margin:0 0 10px;color:var(--muted);font-size:14px}
.part button{display:flex;justify-content:space-between;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--rule);padding:9px 0;cursor:pointer;text-align:left}
.part button:hover span:first-child{text-decoration:underline}
.part .n{font:400 12px var(--f-mono);color:var(--muted);white-space:nowrap}
.plan{margin-top:26px}
/* drill */
.desk{padding-top:28px;max-width:860px;margin-inline:auto}
.desk h1{font:700 clamp(28px,4.5vw,38px)/1.1 var(--f-display);margin:0 0 6px;letter-spacing:-.02em}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:20px;margin-top:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.row label.cap{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:100%}
.chip{border:1px solid var(--rule);background:var(--bg);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select,input[type=text],input[type=number]{background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;max-width:100%}
select{min-width:220px}
.sess-head{display:flex;gap:12px;align-items:center;margin-top:22px;font:500 12px var(--f-mono);color:var(--muted);flex-wrap:wrap}
.bar{flex:1;min-width:120px;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.qcard{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:22px;margin-top:12px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.qmeta span{background:var(--surface2);padding:2px 8px;border-radius:4px}
.stem{font-size:17.5px;line-height:1.55;margin:14px 0;max-width:70ch}
.opts{display:grid;gap:8px;margin:14px 0}
.opt{display:flex;gap:12px;text-align:left;width:100%;border:1px solid var(--rule);background:var(--bg);border-radius:8px;padding:11px 14px;cursor:pointer}
.opt b{font:500 13px var(--f-mono);color:var(--muted);flex:none;width:16px;padding-top:2px}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ans{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.ans input{font:500 17px var(--f-mono);width:min(260px,100%)}
.hint{font-size:13px;color:var(--muted)}
.grid{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;margin:12px 0;background:var(--bg)}
.grid table{border-collapse:collapse;font:400 13px var(--f-mono);min-width:100%}
.grid th{background:var(--surface2);font-weight:500;color:var(--muted);padding:3px 10px;border:1px solid var(--rule);text-align:center;position:sticky;top:0}
.grid th.rn{width:34px}
.grid td{border:1px solid var(--rule);padding:4px 10px;white-space:nowrap;font-variant-numeric:tabular-nums;min-width:64px}
.grid td.lab{font-family:var(--f-body);color:var(--muted);white-space:normal;min-width:180px}
.grid td.hdr{background:var(--surface2);font-weight:600}
.grid td.tgt{background:var(--gold-soft);color:var(--gold);font-weight:500}
.grid td.num{text-align:right}
.task{background:var(--gold-soft);border-radius:8px;padding:10px 14px;font-size:14.5px;margin:10px 0}
.fb{border-radius:8px;padding:14px 16px;margin-top:14px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb h4{margin:0 0 4px;font:700 16px var(--f-display)}
.fb p{margin:6px 0}
.fb .fx{background:var(--surface)}
.sum{font:700 52px/1 var(--f-display);letter-spacing:-.02em}
.misslist{display:grid;gap:8px;margin-top:12px}
.miss{background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:10px 14px;font-size:14.5px}
/* progress */
.prog{padding-top:28px;max-width:900px;margin-inline:auto}
.prog h1{font:700 clamp(28px,4.5vw,38px)/1.1 var(--f-display);margin:0 0 6px}
.ptable{display:grid;gap:2px;margin-top:14px}
.prow{display:grid;grid-template-columns:minmax(0,1.6fr) 90px minmax(80px,1fr) 70px;gap:12px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--rule);font-size:14.5px}
.prow.h{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--ink)}
.prow .nm{display:flex;flex-direction:column;min-width:0}
.prow .nm small{color:var(--muted)}
.meter{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.lo{background:var(--bad)} .meter i.mid{background:var(--gold)}
.pnum{font:500 14px var(--f-mono);text-align:right}
.sechead{font:700 18px var(--f-display);margin:26px 0 0}
.note{color:var(--muted);font-size:14px;max-width:70ch}
[hidden]{display:none!important}
@media (max-width:860px){
  .study{grid-template-columns:minmax(0,1fr);gap:16px}
  .rail{display:none}
  .mobsel{display:block;width:100%;margin-top:4px}
  .brand{width:100%}
  .prow{grid-template-columns:minmax(0,1fr) 64px 60px}
  .prow .meter,.prow.h .mt{display:none}
}
@media (prefers-reduced-motion:no-preference){.fb{animation:rise .18s ease-out}@keyframes rise{from{opacity:.0;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">Finathon Prep <small>IIMB x ACUMO · Round 1</small></div>

      <button class="tab" role="tab" id="tab-study" data-view="study">Study</button>
      <button class="tab" role="tab" id="tab-drill" data-view="drill">Drill</button>
      <button class="tab" role="tab" id="tab-progress" data-view="progress">Progress</button>
    </nav>
    <button class="iconbtn" id="themebtn" aria-label="Switch light or dark theme">Theme</button>
  </header>
  <main id="main"></main>
</div>

<script>
const DATA = {"questions": [{"id": "BF-0001", "section_code": "BF", "r1_topic": "Financial Statements", "type": "mcq", "difficulty": 1, "stem": "A contingent liability (e.g., a pending lawsuit) is generally:", "explanation": "Probable and estimable ⇒ recognised.", "options": [{"label": "A", "text": "Disclosed in notes unless a loss is probable and measurable, in which case it is recognised"}, {"label": "B", "text": "Recorded as revenue"}, {"label": "C", "text": "Ignored completely"}, {"label": "D", "text": "Always recorded as an asset"}], "correct_option": "A"}, {"id": "BF-0002", "section_code": "BF", "r1_topic": "Financial Statements", "type": "mcq", "difficulty": 1, "stem": "A firm increases its provision for doubtful debts. This:", "explanation": "Provisions are expenses recognised in advance.", "options": [{"label": "A", "text": "Increases profit"}, {"label": "B", "text": "Reduces current profit and receivables (net), but does not itself move cash"}, {"label": "C", "text": "Has no balance sheet effect"}, {"label": "D", "text": "Increases cash"}], "correct_option": "B"}, {"id": "BF-0003", "section_code": "BF", "r1_topic": "Financial Statements", "type": "mcq", "difficulty": 1, "stem": "Which is the best indicator that reported profits are of low quality?", "explanation": "Divergence between profit and cash is a red flag.", "options": [{"label": "A", "text": "Moderate capex"}, {"label": "B", "text": "Consistent dividend payouts"}, {"label": "C", "text": "Profits rising while operating cash flow stagnates or falls and receivables balloon"}, {"label": "D", "text": "Stable gross margins"}], "correct_option": "C"}, {"id": "BF-0004", "section_code": "BF", "r1_topic": "Financial Statements", "type": "mcq", "difficulty": 2, "stem": "A company recognises revenue from a 3-year contract entirely in Year 1 though services are delivered over three years. This:", "explanation": "Revenue should match delivery.", "options": [{"label": "A", "text": "Overstates Year 1 profit and understates later years, violating revenue-recognition principles"}, {"label": "B", "text": "Reduces Year 1 taxes"}, {"label": "C", "text": "Is conservative accounting"}, {"label": "D", "text": "Has no effect on profit"}], "correct_option": "A"}, {"id": "BF-0005", "section_code": "BF", "r1_topic": "Financial Statements", "type": "mcq", "difficulty": 2, "stem": "Management extends the useful life of machines from 5 to 8 years. What is the immediate effect?", "explanation": "Depreciation is an estimate; longer lives boost profits.", "options": [{"label": "A", "text": "Profit falls"}, {"label": "B", "text": "Cash increases"}, {"label": "C", "text": "Annual depreciation falls and reported profit rises, with no change in cash"}, {"label": "D", "text": "Assets decrease"}], "correct_option": "C"}, {"id": "BF-0006", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 1, "stem": "A company has cash ₹15L, receivables ₹40L, inventory ₹25L, trade payables ₹30L, short-term borrowings ₹20L and a long-term loan of ₹120L. What is working capital (₹ lakh)?", "explanation": "80 − 50 = 30. The long-term loan is not a current liability.", "answer": {"value": 30, "format": "num", "tolerance_abs": 0.15}}, {"id": "BF-0007", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 1, "stem": "A company has cash ₹50L, receivables ₹20L, inventory ₹35L, trade payables ₹40L, short-term borrowings ₹40L and a long-term loan of ₹110L. What is working capital (₹ lakh)?", "explanation": "105 − 80 = 25. The long-term loan is not a current liability.", "answer": {"value": 25, "format": "num", "tolerance_abs": 0.125}}, {"id": "BF-0008", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 1, "stem": "A company has cash ₹50L, receivables ₹45L, inventory ₹45L, trade payables ₹25L, short-term borrowings ₹35L and a long-term loan of ₹100L. What is working capital (₹ lakh)?", "explanation": "140 − 60 = 80. The long-term loan is not a current liability.", "answer": {"value": 80, "format": "num", "tolerance_abs": 0.4}}, {"id": "BF-0009", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 1, "stem": "A company has cash ₹55L, receivables ₹10L, inventory ₹20L, trade payables ₹50L, short-term borrowings ₹45L and a long-term loan of ₹100L. What is working capital (₹ lakh)?", "explanation": "85 − 95 = -10. The long-term loan is not a current liability.", "answer": {"value": -10, "format": "num", "tolerance_abs": 0.05}}, {"id": "BF-0010", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 2, "stem": "A balance sheet shows total assets of ₹100L, financed by share capital ₹25L, retained earnings ₹20L and a term loan of ₹25L. The balance is split equally between trade payables and accrued expenses. What are accrued expenses (₹ lakh)?", "explanation": "Assets = liabilities + equity. Remaining = 100−25−20−25 = 30; half = 15.0.", "answer": {"value": 15.0, "format": "num", "tolerance_abs": 0.075}}, {"id": "BF-0011", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 2, "stem": "A balance sheet shows total assets of ₹130L, financed by share capital ₹32L, retained earnings ₹28L and a term loan of ₹42L. The balance is split equally between trade payables and accrued expenses. What are accrued expenses (₹ lakh)?", "explanation": "Assets = liabilities + equity. Remaining = 130−32−28−42 = 28; half = 14.0.", "answer": {"value": 14.0, "format": "num", "tolerance_abs": 0.07}}, {"id": "BF-0012", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 2, "stem": "A balance sheet shows total assets of ₹171L, financed by share capital ₹42L, retained earnings ₹41L and a term loan of ₹48L. The balance is split equally between trade payables and accrued expenses. What are accrued expenses (₹ lakh)?", "explanation": "Assets = liabilities + equity. Remaining = 171−42−41−48 = 40; half = 20.0.", "answer": {"value": 20.0, "format": "num", "tolerance_abs": 0.1}}, {"id": "BF-0013", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 2, "stem": "A balance sheet shows total assets of ₹181L, financed by share capital ₹45L, retained earnings ₹36L and a term loan of ₹62L. The balance is split equally between trade payables and accrued expenses. What are accrued expenses (₹ lakh)?", "explanation": "Assets = liabilities + equity. Remaining = 181−45−36−62 = 38; half = 19.0.", "answer": {"value": 19.0, "format": "num", "tolerance_abs": 0.095}}, {"id": "BF-0014", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 2, "stem": "A firm's annual credit sales are ₹3500 lakh and year-end receivables are ₹481 lakh. Using 365 days, how many days of sales are outstanding (DSO)?", "explanation": "481/3500×365 = 50.2 days.", "answer": {"value": 50.161429, "format": "num", "tolerance_abs": 0.250807145}}, {"id": "BF-0015", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 2, "stem": "A firm's annual credit sales are ₹5000 lakh and year-end receivables are ₹420 lakh. Using 365 days, how many days of sales are outstanding (DSO)?", "explanation": "420/5000×365 = 30.7 days.", "answer": {"value": 30.66, "format": "num", "tolerance_abs": 0.1533}}, {"id": "BF-0016", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 2, "stem": "A firm's annual credit sales are ₹6200 lakh and year-end receivables are ₹619 lakh. Using 365 days, how many days of sales are outstanding (DSO)?", "explanation": "619/6200×365 = 36.4 days.", "answer": {"value": 36.441129, "format": "num", "tolerance_abs": 0.182205645}}, {"id": "BF-0017", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 2, "stem": "A firm's annual credit sales are ₹8800 lakh and year-end receivables are ₹1405 lakh. Using 365 days, how many days of sales are outstanding (DSO)?", "explanation": "1405/8800×365 = 58.3 days.", "answer": {"value": 58.275568, "format": "num", "tolerance_abs": 0.29137784}}, {"id": "BF-0018", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 2, "stem": "Current assets are ₹110L (of which inventory is ₹46L) and current liabilities are ₹210L. Calculate the quick ratio (excluding inventory).", "explanation": "(110−46)/210 = 0.30.", "answer": {"value": 0.304762, "format": "x", "tolerance_abs": 0.01}}, {"id": "BF-0019", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 2, "stem": "Current assets are ₹150L (of which inventory is ₹60L) and current liabilities are ₹260L. Calculate the quick ratio (excluding inventory).", "explanation": "(150−60)/260 = 0.35.", "answer": {"value": 0.346154, "format": "x", "tolerance_abs": 0.01}}, {"id": "BF-0020", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 2, "stem": "Current assets are ₹270L (of which inventory is ₹131L) and current liabilities are ₹270L. Calculate the quick ratio (excluding inventory).", "explanation": "(270−131)/270 = 0.51.", "answer": {"value": 0.514815, "format": "x", "tolerance_abs": 0.01}}, {"id": "BF-0021", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 2, "stem": "Current assets are ₹390L (of which inventory is ₹186L) and current liabilities are ₹170L. Calculate the quick ratio (excluding inventory).", "explanation": "(390−186)/170 = 1.20.", "answer": {"value": 1.2, "format": "x", "tolerance_abs": 0.01}}, {"id": "BF-0022", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 3, "stem": "A company collects receivables in 32 days, holds inventory for 80 days and pays suppliers after 55 days. What is its cash conversion cycle (days)? If a supplier now extends credit by 10 more day ash basis.", "options": [{"label": "A", "text": "Only when cash is received"}, {"label": "B", "text": "At the end of the financial year"}, {"label": "C", "text": "When the invoice is printed"}, {"label": "D", "text": "When it is earned, regardless of when cash is received"}], "correct_option": "D"}, {"id": "BF-0027", "section_code": "BF", "r1_topic": "Financial Statements", "type": "mcq", "difficulty": 1, "stem": "Which statement about risk and required return is correct?", "explanation": "Risk-return trade-off.", "options": [{"label": "A", "text": "Higher risk investments must offer higher expected returns to attract capital"}, {"label": "B", "text": "Required return falls as risk rises"}, {"label": "C", "text": "Safer projects must always earn more"}, {"label": "D", "text": "Risk and return are unrelated"}], "correct_option": "A"}, {"id": "BF-0028", "section_code": "BF", "r1_topic": "Financial Statements", "type": "mcq", "difficulty": 2, "stem": "A company capitalises ₹10 crore of costs that should have been expensed. What is the immediate effect?", "explanation": "Capitalising defers expenses to future periods.", "options": [{"label": "A", "text": "No effect on profit"}, {"label": "B", "text": "Cash is understated"}, {"label": "C", "text": "Current profit is overstated, assets are overstated, and future depreciation will be higher"}, {"label": "D", "text": "Profit is understated"}], "correct_option": "C"}, {"id": "BF-0029", "section_code": "BF", "r1_topic": "Financial Statements", "type": "mcq", "difficulty": 2, "stem": "A firm switches from FIFO to weighted-average inventory costing in a period of rising prices. What typically happens to reported profit?", "explanation": "Under rising prices FIFO gives lower COGS and higher profit.", "options": [{"label": "A", "text": "Profit falls, since average cost is higher than FIFO's older, cheaper cost of goods sold"}, {"label": "B", "text": "Nothing changes in either profit or tax"}, {"label": "C", "text": "Profit rises"}, {"label": "D", "text": "Cash falls by the difference"}], "correct_option": "A"}, {"id": "BF-0030", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "numeric", "difficulty": 2, "stem": "COGS is ₹3500 lakh and average inventory is ₹615 lakh. What is the inventory turnover (times a year)?", "explanation": "3500/615 = 5.69 times.", "answer": {"value": 5.691057, "format": "x", "tolerance_abs": 0.028455285}}, {"id": "BF-0031", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "numeric", "difficulty": 2, "stem": "COGS is ₹4200 lakh and average inventory is ₹1028 lakh. What is the inventory turnover (times a year)?", "explanation": "4200/1028 = 4.09 times.", "answer": {"value": 4.085603, "format": "x", "tolerance_abs": 0.020428015}}, {"id": "BF-0032", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "numeric", "difficulty": 2, "stem": "COGS is ₹7200 lakh and average inventory is ₹1521 lakh. What is the inventory turnover (times a year)?", "explanation": "7200/1521 = 4.73 times.", "answer": {"value": 4.733728, "format": "x", "tolerance_abs": 0.02366864}}, {"id": "BF-0033", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 1, "stem": "A company with highly cyclical sales and high fixed costs faces:", "explanation": "Operating leverage amplifies cyclicality.", "options": [{"label": "A", "text": "Stable profits"}, {"label": "B", "text": "Low operating risk"}, {"label": "C", "text": "Immunity to downturns"}, {"label": "D", "text": "Volatile profits that swing sharply with demand"}], "correct_option": "D"}, {"id": "BF-0034", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 1, "stem": "A start-up with 85% of revenue from one customer faces:", "explanation": "Customer concentration is a key business risk.", "options": [{"label": "A", "text": "Concentration risk: losing that customer could wipe out cash flows"}, {"label": "B", "text": "Lower credit risk"}, {"label": "C", "text": "Higher diversification"}, {"label": "D", "text": "No risk since revenue is stable"}], "correct_option": "A"}, {"id": "BF-0035", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 1, "stem": "Which is the best example of operational risk?", "explanation": "Operational risk arises from internal processes and events.", "options": [{"label": "A", "text": "The rupee weakens"}, {"label": "B", "text": "A factory fire halts production for six weeks"}, {"label": "C", "text": "Interest rates increase"}, {"label": "D", "text": "Equity markets fall"}], "correct_option": "B"}, {"id": "BF-0036", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 1, "stem": "Margin of safety measures:", "explanation": "Margin of safety = (actual − break-even) ÷ actual.", "options": [{"label": "A", "text": "The tax rate applied to profit"}, {"label": "B", "text": "The ratio of debt to equity"}, {"label": "C", "text": "How far sales can fall before the business hits break-even"}, {"label": "D", "text": "The cash buffer needed for emergencies"}], "correct_option": "C"}, {"id": "BF-0037", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 1, "stem": "Operating leverage is highest for a firm that has:", "explanation": "DOL = contribution/EBIT; larger fixed cost base → larger DOL.", "options": [{"label": "A", "text": "A high tax rate"}, {"label": "B", "text": "High fixed costs relative to variable costs, so small sales changes cause large profit swings"}, {"label": "C", "text": "Zero sales growth"}, {"label": "D", "text": "Only variable costs"}], "correct_option": "B"}, {"id": "BF-0038", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 2, "stem": "A juice stall's total fixed costs are ₹67,000 including ₹15,000 rent. To compute break-even glasses, what fixed cost should be used?", "explanation": "Don't double-count a component already included in the total.", "options": [{"label": "A", "text": "₹15,000 — only rent matters"}, {"label": "B", "text": "₹52,000 — exclude rent as it is a sunk cost"}, {"label": "C", "text": "₹67,000 — rent is already part of the total fixed costs"}, {"label": "D", "text": "₹82,000 — add rent on top"}], "correct_option": "C"}, {"id": "BF-0039", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 2, "stem": "A product's contribution margin ratio is 40%, fixed costs ₹2,00,000. What is break-even revenue and what happens if variable cost per unit rises?", "explanation": "BE revenue = fixed ÷ CM ratio = 2,00,000/0.40; lower CM ratio → higher BE.", "options": [{"label": "A", "text": "₹2,00,000; break-even is just fixed costs"}, {"label": "B", "text": "₹8,00,000; break-even uses 25% margin"}, {"label": "C", "text": "₹5,00,000; higher variable cost lowers break-even because costs are higher"}, {"label": "D", "text": "₹5,00,000; a higher variable cost lowers the CM ratio, raising break-even revenue"}], "correct_option": "D"}, {"id": "BF-0040", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 2, "stem": "Doubling fixed costs, with price and variable cost per unit unchanged, will:", "explanation": "BE units = fixed ÷ unit contribution.", "options": [{"label": "A", "text": "Halve the break-even volume"}, {"label": "B", "text": "Leave break-even unchanged"}, {"label": "C", "text": "Raise unit contribution"}, {"label": "D", "text": "Double the break-even volume"}], "correct_option": "D"}, {"id": "BF-0041", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "numeric", "difficulty": 1, "stem": "A Jaipur block-print label sells 360 kurtas a month at ₹1,900 each; variable cost is ₹995 per unit and fixed costs are ₹31,000 a month. What is
