E revenue = 70,000/0.4091 = 171,111.", "answer": {"value": 171111.111111, "format": "inr", "tolerance_abs": 342.222222222}}, {"id": "BF-0051", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "numeric", "difficulty": 2, "stem": "A product sells for ₹550 with a variable cost of ₹275. Fixed costs are ₹55,000 a month. What revenue is needed to break even?", "explanation": "CM ratio = 0.5000; BE revenue = 55,000/0.5000 = 110,000.", "answer": {"value": 110000.0, "format": "inr", "tolerance_abs": 220.0}}, {"id": "BF-0052", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "numeric", "difficulty": 2, "stem": "A product sells for ₹550 with a variable cost of ₹285. Fixed costs are ₹55,000 a month. What revenue is needed to break even?", "explanation": "CM ratio = 0.4818; BE revenue = 55,000/0.4818 = 114,151.", "answer": {"value": 114150.943396, "format": "inr", "tolerance_abs": 228.301886792}}, {"id": "BF-0053", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "numeric", "difficulty": 2, "stem": "A shop sells two products. Product A: 240 units at ₹110, variable cost ₹60. Product B: 110 units at ₹670, variable cost ₹335. Common fixed costs are ₹30,000. What is total profit?", "explanation": "A contributes 12,000, B contributes 36,850; total 48,850 − 30,000 = 18,850.", "answer": {"value": 18850, "format": "inr", "tolerance_abs": 37.7}}, {"id": "BF-0054", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "numeric", "difficulty": 2, "stem": "A shop sells two products. Product A: 250 units at ₹190, variable cost ₹104. Product B: 230 units at ₹550, variable cost ₹275. Common fixed costs are ₹20,000. What is total profit?", "explanation": "A contributes 21,500, B contributes 63,250; total 84,750 − 20,000 = 64,750.", "answer": {"value": 64750, "format": "inr", "tolerance_abs": 129.5}}, {"id": "BF-0055", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "numeric", "difficulty": 2, "stem": "A shop sells two products. Product A: 400 units at ₹110, variable cost ₹60. Product B: 160 units at ₹320, variable cost ₹160. Common fixed costs are ₹55,000. What is total profit?", "explanation": "A contributes 20,000, B contributes 25,600; total 45,600 − 55,000 = -9,400.", "answer": {"value": -9400, "format": "inr", "tolerance_abs": 18.8}}, {"id": "BF-0056", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "numeric", "difficulty": 2, "stem": "A shop sells two products. Product A: 400 units at ₹200, variable cost ₹110. Product B: 250 units at ₹340, variable cost ₹170. Common fixed costs are ₹25,000. What is total profit?", "explanation": "A contributes 36,000, B contributes 42,500; total 78,500 − 25,000 = 53,500.", "answer": {"value": 53500, "format": "inr", "tolerance_abs": 107.0}}, {"id": "BF-0057", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "numeric", "difficulty": 3, "stem": "A company's total contribution is ₹3,50,000 and its fixed costs are ₹1,75,000. If sales volume grows 11% (prices and unit costs constant), by what % will operating profit grow?", "explanation": "DOL = 350,000/175,000 = 2.000; profit growth = 2.000×11% = 22.00%.", "answer": {"value": 0.22, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "BF-0058", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "numeric", "difficulty": 3, "stem": "A company's total contribution is ₹4,00,000 and its fixed costs are ₹2,40,000. If sales volume grows 15% (prices and unit costs constant), by what % will operating profit grow?", "explanation": "DOL = 400,000/160,000 = 2.500; profit growth = 2.500×15% = 37.50%.", "answer": {"value": 0.375, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "BF-0059", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "numeric", "difficulty": 3, "stem": "A company's total contribution is ₹4,50,000 and its fixed costs are ₹2,66,000. If sales volume grows 15% (prices and unit costs constant), by what % will operating profit grow?", "explanation": "DOL = 450,000/184,000 = 2.446; profit growth = 2.446×15% = 36.68%.", "answer": {"value": 0.366848, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "BF-0060", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "numeric", "difficulty": 3, "stem": "A company's total contribution is ₹5,50,000 and its fixed costs are ₹3,35,000. If sales volume grows 13% (prices and unit costs constant), by what % will operating profit grow?", "explanation": "DOL = 550,000/215,000 = 2.558; profit growth = 2.558×13% = 33.26%.", "answer": {"value": 0.332558, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "BF-0061", "section_code": "BF", "r1_topic": "Valuation", "type": "mcq", "difficulty": 1, "stem": "A project has NPV = 0 at the firm's cost of capital. This means:", "explanation": "NPV = 0 ⇒ IRR = cost of capital.", "options": [{"label": "A", "text": "It earns exactly the required return, neither creating nor destroying value"}, {"label": "B", "text": "It should be rejected because it adds no cash"}, {"label": "C", "text": "It has a payback of exactly zero years"}, {"label": "D", "text": "It makes zero profit"}], "correct_option": "A"}, {"id": "BF-0062", "section_code": "BF", "r1_topic": "Valuation", "type": "mcq", "difficulty": 1, "stem": "Depreciation tax shield equals:", "explanation": "Depreciation reduces taxable income.", "options": [{"label": "A", "text": "Tax × interest"}, {"label": "B", "text": "Depreciation × (1 − tax rate) always"}, {"label": "C", "text": "Depreciation × tax rate"}, {"label": "D", "text": "Depreciation ÷ tax rate"}], "correct_option": "C"}, {"id": "BF-0063", "section_code": "BF", "r1_topic": "Valuation", "type": "mcq", "difficulty": 1, "stem": "Discounted payback period differs from simple payback because it:", "explanation": "Discounting shrinks later cash flows, lengthening recovery time.", "options": [{"label": "A", "text": "Ignores the initial investment"}, {"label": "B", "text": "Discounts cash flows before accumulating them, so it is always at least as long as simple payback"}, {"label": "C", "text": "Uses accounting profit instead of cash"}, {"label": "D", "text": "Includes only the first cash flow"}], "correct_option": "B"}, {"id": "BF-0064", "section_code": "BF", "r1_topic": "Valuation", "type": "mcq", "difficulty": 1, "stem": "Raising the discount rate from 10% to 14% will most likely:", "explanation": "Longer-duration cash flows are more rate-sensitive.", "options": [{"label": "A", "text": "Reduce all projects' NPV by exactly 4%"}, {"label": "B", "text": "Reduce the NPV of a project whose cash flows come mostly in later years by more than one with early cash flows"}, {"label": "C", "text": "Increase NPV for all projects"}, {"label": "D", "text": "Leave NPV unchanged but change payback"}], "correct_option": "B"}, {"id": "BF-0065", "section_code": "BF", "r1_topic": "Valuation", "type": "mcq", "difficulty": 1, "stem": "When capital is rationed, the firm should rank projects by:", "explanation": "PI maximises NPV under a constraint.", "options": [{"label": "A", "text": "Highest IRR only"}, {"label": "B", "text": "Lowest payback only"}, {"label": "C", "text": "Profitability index (NPV per rupee of investment), subject to the budget"}, {"label": "D", "text": "Largest absolute cost"}], "correct_option": "C"}, {"id": "BF-0066", "section_code": "BF", "r1_topic": "Valuation", "type": "mcq", "difficulty": 1, "stem": "Which discount rate should be used for a risky new product line?", "explanation": "Discount rate must match the risk of the cash flows.", "options": [{"label": "A", "text": "The risk-free rate regardless of risk"}, {"label": "B", "text": "The prevailing savings account rate"}, {"label": "C", "text": "The firm's historical dividend yield"}, {"label": "D", "text": "A rate reflecting the project's risk (often above the firm's average cost of capital)"}], "correct_option": "D"}, {"id": "BF-0067", "section_code": "BF", "r1_topic": "Valuation", "type": "mcq", "difficulty": 2, "stem": "A firm spent ₹8 lakh on a market study last year. It must now decide whether to launch. How should the ₹8 lakh be treated?", "explanation": "Sunk costs are irrecoverable and irrelevant to forward-looking choices.", "options": [{"label": "A", "text": "Added to the project's initial investment"}, {"label": "B", "text": "Ignored in the decision as a sunk cost; only future incremental cash flows matter"}, {"label": "C", "text": "Subtracted from the expected inflows in Year 1"}, {"label": "D", "text": "Treated as a risk premium on the discount rate"}], "correct_option": "B"}, {"id": "BF-0068", "section_code": "BF", "r1_topic": "Valuation", "type": "mcq", "difficulty": 2, "stem": "A project with conventional cash flows has IRR 14% and cost of capital 12%. At 16% cost of capital the NPV would be:", "explanation": "NPV = 0 at IRR; above IRR, NPV is negative.", "options": [{"label": "A", "text": "Unchanged"}, {"label": "B", "text": "Zero"}, {"label": "C", "text": "Positive"}, {"label": "D", "text": "Negative"}], "correct_option": "D"}, {"id": "BF-0069", "section_code": "BF", "r1_topic": "Valuation", "type": "mcq", "difficulty": 2, "stem": "Two mutually exclusive projects: X has IRR 25% but NPV ₹10 lakh; Y has IRR 18% but NPV ₹30 lakh (both at 12% cost of capital). Which should the firm choose and why?", "explanation": "NPV is the value-additive criterion; IRR ignores scale.", "options": [{"label": "A", "text": "Neither — IRR above cost of capital is irrelevant"}, {"label": "B", "text": "X — because IRR is the true return and NPV is just an estimate"}, {"label": "C", "text": "Y — for mutually exclusive projects, higher NPV adds more absolute value even though IRR is lower"}, {"label": "D", "text": "X — higher IRR always dominates"}], "correct_option": "C"}, {"id": "BF-0070", "section_code": "BF", "r1_topic": "Valuation", "type": "mcq", "difficulty": 2, "stem": "Two projects: P returns ₹100 in Year 1 and ₹0 later; Q returns ₹0 in Year 1 and ₹130 in Year 2. The cost of capital is 20%. Which has the higher PV of inflows?", "explanation": "PV(Q) = 130/1.44 = 90.28 > 83.33 = PV(P).", "options": [{"label": "A", "text": "They are equal"}, {"label": "B", "text": "Cannot be determined"}, {"label": "C", "text": "P, as earlier cash is always worth more"}, {"label": "D", "text": "P (PV ≈ 83.3) versus Q (PV ≈ 90.3) — Q is higher"}], "correct_option": "D"}, {"id": "BF-0071", "section_code": "BF", "r1_topic": "Valuation", "type": "mcq", "difficulty": 3, "stem": "Meera can tutor for 4 hours at ₹850/hour or attend a workshop costing ₹2,500 fees plus ₹500 travel. She cannot do both. What is the opportunity cost of attending the workshop?", "explanation": "Opportunity cost = value of the next-best alternative forgone (explicit fees are separate cash costs).", "options": [{"label": "A", "text": "₹3,000 — fees and travel only"}, {"label": "B", "text": "₹6,400 — tutoring income plus fees and travel"}, {"label": "C", "text": "₹0 — tuition income is not a real cost"}, {"label": "D", "text": "₹3,400 — the tutoring income she gives up"}], "correct_option": "D"}, {"id": "BF-0072", "section_code": "BF", "r1_topic": "Valuation", "type": "mcq", "difficulty": 3, "stem": "Project M pays back in 3 years with NPV ₹22 lakh. Project N pays back in 5 years with NPV ₹55 lakh. A manager rejects N only because of the longer payback. What is the fundamental flaw?", "explanation": "NPV measures value created; payback ignores cash flows beyond cut-off (and discounting). The decisive flaw here is the ignored later cash flows.", "options": [{"label": "A", "text": "A 5-year payback exposes the firm to excessive reinvestment risk"}, {"label": "B", "text": "Payback ignores all cash flows after the recovery date, so it measures speed of recovery, not total value created"}, {"label": "C", "text": "Payback periods can only be compared if both projects have identical investment amounts"}, {"label": "D", "text": "Payback ignores the time value of money, so ₹1 in Year 1 equals ₹1 in Year 5, which is the only issue"}], "correct_option": "B"}, {"id": "BF-0073", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 1, "stem": "A project costs ₹12,00,000 and returns ₹2,40,000 a year. What is the payback period (years)?", "explanation": "1,200,000/240,000 = 5.00.", "answer": {"value": 5.0, "format": "num", "tolerance_abs": 0.025}}, {"id": "BF-0074", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 1, "stem": "A project costs ₹21,00,000 and returns ₹3,50,000 a year. What is the payback period (years)?", "explanation": "2,100,000/350,000 = 6.00.", "answer": {"value": 6.0, "format": "num", "tolerance_abs": 0.03}}, {"id": "BF-0075", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 1, "stem": "A project costs ₹31,00,000 and returns ₹5,16,666 a year. What is the payback period (years)?", "explanation": "3,100,000/516,666 = 6.00.", "answer": {"value": 6.000008, "format": "num", "tolerance_abs": 0.030000040000000002}}, {"id": "BF-0076", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 1, "stem": "A project costs ₹8,00,000 and returns ₹1,33,333 a year. What is the payback period (years)?", "explanation": "800,000/133,333 = 6.00.", "answer": {"value": 6.000015, "format": "num", "tolerance_abs": 0.030000075}}, {"id": "BF-0077", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 2, "stem": "Arjun can either tutor for 8 hours at ₹600 per hour, or attend a workshop that costs ₹3,600 in fees plus ₹900 in travel. She cannot do both. What is the opportunity cost of attending the workshop (the value of the best alternative forgone)?", "explanation": "Opportunity cost = next-best alternative forgone = 8×600 = 4,800. The fees and travel are explicit costs, not the forgone alternative.", "answer": {"value": 4800, "format": "inr", "tolerance_abs": 9.6}}, {"id": "BF-0078", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 2, "stem": "Kavya can either tutor for 8 hours at ₹1,100 per hour, or attend a workshop that costs ₹3,600 in fees plus ₹800 in travel. She cannot do both. What is the opportunity cost of attending the workshop (the value of the best alternative forgone)?", "explanation": "Opportunity cost = next-best alternative forgone = 8×1100 = 8,800. The fees and travel are explicit costs, not the forgone alternative.", "answer": {"value": 8800, "format": "inr", "tolerance_abs": 17.6}}, {"id": "BF-0079", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 2, "stem": "Varun can either tutor for 4 hours at ₹800 per hour, or attend a workshop that costs ₹3,800 in fees plus ₹300 in travel. She cannot do both. What is the opportunity cost of attending the workshop (the value of the best alternative forgone)?", "explanation": "Opportunity cost = next-best alternative forgone = 4×800 = 3,200. The fees and travel are explicit costs, not the forgone alternative.", "answer": {"value": 3200, "format": "inr", "tolerance_abs": 6.4}}, {"id": "BF-0080", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 2, "stem": "Varun can either tutor for 6 hours at ₹900 per hour, or attend a workshop that costs ₹2,800 in fees plus ₹600 in travel. She cannot do both. What is the opportunity cost of attending the workshop (the value of the best alternative forgone)?", "explanation": "Opportunity cost = next-best alternative forgone = 6×900 = 5,400. The fees and travel are explicit costs, not the forgone alternative.", "answer": {"value": 5400, "format": "inr", "tolerance_abs": 10.8}}, {"id": "BF-0081", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 3, "stem": "A company owes ₹10,00,000 at 12% with an annual year-end repayment of ₹2,50,000. What is the principal outstanding right after the year-2 payment?", "explanation": "Balance = P(1+i)^2 − A·((1+i)^2−1)/i = 724,400.", "answer": {"value": 724400.0, "format": "inr", "tolerance_abs": 1448.8}}, {"id": "BF-0082", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 3, "stem": "A company owes ₹10,00,000 at 12% with an annual year-end repayment of ₹2,80,000. What is the principal outstanding right after the year-2 payment?", "explanation": "Balance = P(1+i)^2 − A·((1+i)^2−1)/i = 660,800.", "answer": {"value": 660800.0, "format": "inr", "tolerance_abs": 1321.6000000000001}}, {"id": "BF-0083", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 3, "stem": "A company owes ₹25,00,000 at 9% with an annual year-end repayment of ₹6,50,000. What is the principal outstanding right after the year-3 payment?", "explanation": "Balance = P(1+i)^3 − A·((1+i)^3−1)/i = 1,106,807.", "answer": {"value": 1106807.5, "format": "inr", "tolerance_abs": 2213.6150000000002}}, {"id": "BF-0084", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 3, "stem": "A company owes ₹29,00,000 at 12% with an annual year-end repayment of ₹5,90,000. What is the principal outstanding right after the year-2 payment?", "explanation": "Balance = P(1+i)^2 − A·((1+i)^2−1)/i = 2,386,960.", "answer": {"value": 2386960.0, "format": "inr", "tolerance_abs": 4773.92}}, {"id": "BF-0085", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 3, "stem": "A firm borrows ₹120 crore at 11% and repays in 9 equal year-end instalments. Find the annual instalment (₹ crore).", "explanation": "A = L·i/(1−(1+i)^−n) = 21.672.", "answer": {"value": 21.6722, "format": "num", "tolerance_abs": 0.108361}}, {"id": "BF-0086", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 3, "stem": "A firm borrows ₹140 crore at 9% and repays in 8 equal year-end instalments. Find the annual instalment (₹ crore).", "explanation": "A = L·i/(1−(1+i)^−n) = 25.294.", "answer": {"value": 25.294413, "format": "num", "tolerance_abs": 0.126472065}}, {"id": "BF-0087", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 3, "stem": "A firm borrows ₹260 crore at 9% and repays in 7 equal year-end instalments. Find the annual instalment (₹ crore).", "explanation": "A = L·i/(1−(1+i)^−n) = 51.660.", "answer": {"value": 51.659534, "format": "num", "tolerance_abs": 0.25829767000000003}}, {"id": "BF-0088", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 3, "stem": "A firm borrows ₹270 crore at 13% and repays in 5 equal year-end instalments. Find the annual instalment (₹ crore).", "explanation": "A = L·i/(1−(1+i)^−n) = 76.765.", "answer": {"value": 76.764927, "format": "num", "tolerance_abs": 0.383824635}}, {"id": "BF-0089", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 3, "stem": "A project costs ₹19,00,000 and returns ₹5,80,000, ₹6,90,000, ₹10,10,000 at the end of years 1, 2 and 3. The discount rate is 10%. Calculate NPV.", "explanation": "PV of inflows = 1,856,349; NPV = -43,651.", "answer": {"value": -43651.389932, "format": "inr", "tolerance_abs": 87.302779864}}, {"id": "BF-0090", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 3, "stem": "A project costs ₹19,00,000 and returns ₹8,20,000, ₹6,30,000, ₹8,70,000 at the end of years 1, 2 and 3. The discount rate is 9%. Calculate NPV.", "explanation": "PV of inflows = 1,954,352; NPV = 54,352.", "answer": {"value": 54351.601393, "format": "inr", "tolerance_abs": 108.70320278599999}}, {"id": "BF-0091", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 3, "stem": "A project costs ₹19,00,000 and returns ₹8,50,000, ₹7,50,000, ₹5,90,000 at the end of years 1, 2 and 3. The discount rate is 12%. Calculate NPV.", "explanation": "PV of inflows = 1,776,774; NPV = -123,226.", "answer": {"value": -123225.674198, "format": "inr", "tolerance_abs": 246.451348396}}, {"id": "BF-0092", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 3, "stem": "A project costs ₹30,00,000 and returns ₹13,60,000, ₹16,30,000, ₹15,00,000 at the end of years 1, 2 and 3. The discount rate is 13%. Calculate NPV.", "explanation": "PV of inflows = 3,519,644; NPV = 519,644.", "answer": {"value": 519644.160325, "format": "inr", "tolerance_abs": 1039.28832065}}, {"id": "BF-0093", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 3, "stem": "The present value of a project's future cash inflows is ₹17,00,000 and its initial investment is ₹12,00,000. What is the profitability index (PV of inflows ÷ investment)?", "explanation": "1,700,000/1,200,000 = 1.417. PI > 1 ⇔ NPV > 0.", "answer": {"value": 1.416667, "format": "x", "tolerance_abs": 0.01}}, {"id": "BF-0094", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 3, "stem": "The present value of a project's future cash inflows is ₹21,20,000 and its initial investment is ₹17,00,000. What is the profitability index (PV of inflows ÷ investment)?", "explanation": "2,120,000/1,700,000 = 1.247. PI > 1 ⇔ NPV > 0.", "answer": {"value": 1.247059, "format": "x", "tolerance_abs": 0.01}}, {"id": "BF-0095", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 3, "stem": "The present value of a project's future cash inflows is ₹24,90,000 and its initial investment is ₹16,00,000. What is the profitability index (PV of inflows ÷ investment)?", "explanation": "2,490,000/1,600,000 = 1.556. PI > 1 ⇔ NPV > 0.", "answer": {"value": 1.55625, "format": "x", "tolerance_abs": 0.01}}, {"id": "BF-0096", "section_code": "BF", "r1_topic": "Valuation", "type": "numeric", "difficulty": 3, "stem": "The present value of a project's future cash inflows is ₹72,80,000 and its initial investment is ₹50,00,000. What is the profitability index (PV of inflows ÷ investment)?", "explanation": "7,280,000/5,000,000 = 1.456. PI > 1 ⇔ NPV > 0.", "answer": {"value": 1.456, "format": "x", "tolerance_abs": 0.01}}, {"id": "BF-0097", "section_code": "BF", "r1_topic": "Valuation", "type": "mcq", "difficulty": 1, "stem": "A higher debt-to-equity ratio generally means:", "explanation": "D/E measures leverage.", "options": [{"label": "A", "text": "More retained earnings"}, {"label": "B", "text": "Lower interest obligations"}, {"label": "C", "text": "Greater reliance on borrowed funds and higher financial risk"}, {"label": "D", "text": "Higher liquidity"}], "correct_option": "C"}, {"id": "BF-0098", "section_code": "BF", "r1_topic": "Valuation", "type": "mcq", "difficulty": 1, "stem": "Interest coverage of 1.2x indicates:", "explanation": "Coverage = EBIT ÷ interest; near 1 is risky.", "options": [{"label": "A", "text": "A thin cushion: a small fall in EBIT could leave the firm unable to pay interest"}, {"label": "B", "text": "Very safe borrowing"}, {"label": "C", "text": "That the firm has no debt"}, {"label": "D", "text": "That interest is tax-free"}], "correct_option": "A"}, {"id": "BF-0099", "section_code": "BF", "r1_topic": "Valuation", "type": "mcq", "difficulty": 2, "stem": "A firm replaces expensive equity with cheap debt. WACC falls at first, then rises. Why?", "explanation": "Trade-off theory: tax shield vs distress costs.", "options": [{"label": "A", "text": "Because equity investors reward leverage unconditionally"}, {"label": "B", "text": "Because debt becomes more expensive only for small firms"}, {"label": "C", "text": "Beyond a point, higher leverage raises distress risk and the cost of both debt and equity"}, {"label": "D", "text": "Because taxes disappear at high debt"}], "correct_option": "C"}, {"id": "BF-0100", "section_code": "BF", "r1_topic": "Valuation", "type": "mcq", "difficulty": 2, "stem": "Why does debt financing have a lower after-tax cost than its stated interest rate?", "explanation": "After-tax cost of debt = kd × (1 − t).", "options": [{"label": "A", "text": "Lenders give discounts to profitable firms"}, {"label": "B", "text": "Interest is paid out of retained earnings"}, {"label": "C", "text": "Interest is tax-deductible, so the interest tax shield reduces the effective cost"}, {"label": "D", "text": "Debt has no repayment obligation"}], "correct_option": "C"}, {"id": "BF-0101", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 1, "stem": "A company's operating cash flow is ₹120 crore and capital expenditure is ₹100 crore. What is free cash flow (₹ crore)?", "explanation": "FCF = OCF − capex = 20.", "answer": {"value": 20, "format": "num", "tolerance_abs": 0.1}}, {"id": "BF-0102", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 1, "stem": "A company's operating cash flow is ₹280 crore and capital expenditure is ₹244 crore. What is free cash flow (₹ crore)?", "explanation": "FCF = OCF − capex = 36.", "answer": {"value": 36, "format": "num", "tolerance_abs": 0.18}}, {"id": "BF-0103", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 1, "stem": "A company's operating cash flow is ₹330 crore and capital expenditure is ₹132 crore. What is free cash flow (₹ crore)?", "explanation": "FCF = OCF − capex = 198.", "answer": {"value": 198, "format": "num", "tolerance_abs": 0.99}}, {"id": "BF-0104", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 1, "stem": "A company's operating cash flow is ₹380 crore and capital expenditure is ₹221 crore. What is free cash flow (₹ crore)?", "explanation": "FCF = OCF − capex = 159.", "answer": {"value": 159, "format": "num", "tolerance_abs": 0.795}}, {"id": "BF-0105", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 2, "stem": "Equipment costing ₹11,00,000 has a 7-year life and salvage value ₹1,00,000; straight-line depreciation is used. What is its net book value after 2 years?", "explanation": "Annual dep = 142,857; NBV = 814,286.", "answer": {"value": 814285.714286, "format": "inr", "tolerance_abs": 1628.571428572}}, {"id": "BF-0106", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 2, "stem": "Equipment costing ₹14,00,000 has a 9-year life and salvage value ₹10,000; straight-line depreciation is used. What is its net book value after 7 years?", "explanation": "Annual dep = 154,444; NBV = 318,889.", "answer": {"value": 318888.888889, "format": "inr", "tolerance_abs": 637.777777778}}, {"id": "BF-0107", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 2, "stem": "Equipment costing ₹31,00,000 has a 10-year life and salvage value ₹2,80,000; straight-line depreciation is used. What is its net book value after 6 years?", "explanation": "Annual dep = 282,000; NBV = 1,408,000.", "answer": {"value": 1408000.0, "format": "inr", "tolerance_abs": 2816.0}}, {"id": "BF-0108", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 2, "stem": "Equipment costing ₹35,00,000 has a 9-year life and salvage value ₹2,00,000; straight-line depreciation is used. What is its net book value after 2 years?", "explanation": "Annual dep = 366,667; NBV = 2,766,667.", "answer": {"value": 2766666.666667, "format": "inr", "tolerance_abs": 5533.333333334}}, {"id": "BF-0109", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 2, "stem": "PAT is ₹130L; depreciation ₹25L; receivables rose ₹65L; inventory rose ₹40L; payables rose ₹15L. What is operating cash flow (₹ lakh)?", "explanation": "130+25−65−40+15 = 65.", "answer": {"value": 65, "format": "num", "tolerance_abs": 0.325}}, {"id": "BF-0110", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 2, "stem": "PAT is ₹220L; depreciation ₹55L; receivables rose ₹65L; inventory rose ₹40L; payables rose ₹10L. What is operating cash flow (₹ lakh)?", "explanation": "220+55−65−40+10 = 180.", "answer": {"value": 180, "format": "num", "tolerance_abs": 0.9}}, {"id": "BF-0111", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 2, "stem": "PAT is ₹80L; depreciation ₹15L; receivables rose ₹10L; inventory rose ₹10L; payables rose ₹25L. What is operating cash flow (₹ lakh)?", "explanation": "80+15−10−10+25 = 100.", "answer": {"value": 100, "format": "num", "tolerance_abs": 0.5}}, {"id": "BF-0112", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 2, "stem": "PAT is ₹80L; depreciation ₹25L; receivables rose ₹10L; inventory rose ₹30L; payables rose ₹15L. What is operating cash flow (₹ lakh)?", "explanation": "80+25−10−30+15 = 80.", "answer": {"value": 80, "format": "num", "tolerance_abs": 0.4}}, {"id": "BF-0113", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 3, "stem": "A start-up shows net profit of ₹43 lakh. Depreciation was ₹2L; unpaid customer invoices rose by ₹58L; inventory rose by ₹16L; supplier credit rose by ₹9L. Ignoring investing and financing, what was the change in cash (₹ lakh; negative = fall)?", "explanation": "43+2−58−16+9 = -20. Profit and cash differ because of working-capital build-up.", "answer": {"value": -20, "format": "num", "tolerance_abs": 0.1}}, {"id": "BF-0114", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 3, "stem": "A start-up shows net profit of ₹71 lakh. Depreciation was ₹1L; unpaid customer invoices rose by ₹105L; inventory rose by ₹13L; supplier credit rose by ₹0L. Ignoring investing and financing, what was the change in cash (₹ lakh; negative = fall)?", "explanation": "71+1−105−13+0 = -46. Profit and cash differ because of working-capital build-up.", "answer": {"value": -46, "format": "num", "tolerance_abs": 0.23}}, {"id": "BF-0115", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 3, "stem": "A start-up shows net profit of ₹75 lakh. Depreciation was ₹8L; unpaid customer invoices rose by ₹89L; inventory rose by ₹15L; supplier credit rose by ₹10L. Ignoring investing and financing, what was the change in cash (₹ lakh; negative = fall)?", "explanation": "75+8−89−15+10 = -11. Profit and cash differ because of working-capital build-up.", "answer": {"value": -11, "format": "num", "tolerance_abs": 0.055}}, {"id": "BF-0116", "section_code": "BF", "r1_topic": "Financial Statements", "type": "numeric", "difficulty": 3, "stem": "A start-up shows net profit of ₹77 lakh. Depreciation was ₹7L; unpaid customer invoices rose by ₹86L; inventory rose by ₹7L; supplier credit rose by ₹5L. Ignoring investing and financing, what was the change in cash (₹ lakh; negative = fall)?", "explanation": "77+7−86−7+5 = -4. Profit and cash differ because of working-capital build-up.", "answer": {"value": -4, "format": "num", "tolerance_abs": 0.02}}, {"id": "BF-0117", "section_code": "BF", "r1_topic": "Financial Statements", "type": "mcq", "difficulty": 1, "stem": "Why is depreciation added back in the indirect-method operating cash flow?", "explanation": "Depreciation is a non-cash charge; adding it back reverses its effect on cash.", "options": [{"label": "A", "text": "It reduced profit but involved no cash payment in the period"}, {"label": "B", "text": "It is a cash expense that the company recovers later from the bank"}, {"label": "C", "text": "It converts capital expenditure into operating expenditure"}, {"label": "D", "text": "It represents a tax refund received during the year"}], "correct_option": "A"}, {"id": "BF-0118", "section_code": "BF", "r1_topic": "Financial Statements", "type": "mcq", "difficulty": 2, "stem": "A firm's free cash flow is negative while profit is positive. Which is the most plausible reading?", "explanation": "Negative FCF with positive profit is common for fast-growing, capital-hungry firms; sustainability depends on funding and returns.", "options": [{"label": "A", "text": "The firm must be about to default within the year"}, {"label": "B", "text": "Profit is certainly fictitious"}, {"label": "C", "text": "Free cash flow includes dividends, which always make it negative"}, {"label": "D", "text": "It is in an investment phase (heavy capex/working capital), so growth is being funded by borrowing or equity rather than internally"}], "correct_option": "D"}, {"id": "BF-0119", "section_code": "BF", "r1_topic": "Financial Statements", "type": "mcq", "difficulty": 2, "stem": "A listed firm reports strong PAT growth for the third year, yet its CFO draws on the overdraft to pay salaries. How is this possible?", "explanation": "Accrual profit ≠ cash. Growth often needs working capital and capex; profitable firms can still be cash-starved.", "options": [{"label": "A", "text": "The overdraft is a risk-transfer device that lets the firm avoid ever running short of cash, so salaries are paid from it by design"}, {"label": "B", "text": "Tax payments are so high that nothing remains for operations, which means the reported PAT figure is wrong"}, {"label": "C", "text": "It is not possible: sustained PAT growth always generates surplus cash, so the overdraft must be for something else"}, {"label": "D", "text": "Profit is booked on credit sales and capex/stock build-up, so cash can be trapped in receivables, inventory or fixed assets while profit looks healthy"}], "correct_option": "D"}, {"id": "BF-0120", "section_code": "BF", "r1_topic": "Financial Statements", "type": "mcq", "difficulty": 2, "stem": "A pharma company reports ₹300 crore PAT but operating cash flow of only ₹90 crore. Which combination best explains the gap?", "explanation": "Rising receivables and inventory consume cash without reducing profit. Depreciation is non-cash and is added back (it raises OCF relative to PAT); dividends are financing flows; falling inventory raises OCF.", "options": [{"label": "A", "text": "Receivables grew ₹140 crore on long credit terms and inventory rose ₹70 crore, so cash is tied up even though profit is recognised"}, {"label": "B", "text": "Inventory fell by ₹210 crore, releasing cash, which would push OCF above PAT rather than below it"}, {"label": "C", "text": "The company paid ₹210 crore of dividends, which is recorded in operating cash flow and lowers it"}, {"label": "D", "text": "Depreciation of ₹210 crore was charged; because it reduces profit, operating cash flow must be lower than PAT"}], "correct_option": "A"}, {"id": "BF-0121", "section_code": "BF", "r1_topic": "Financial Statements", "type": "mcq", "difficulty": 2, "stem": "An e-commerce start-up shows ₹40 lakh net profit but its bank balance fell ₹22 lakh. Which explanation fits best?", "explanation": "Credit sales and capitalised spend explain a profit-cash gap. Depreciation is non-cash; tax paid would also hit profit, so it does not create a gap.", "options": [{"label": "A", "text": "The accountant has certainly erred, since a profitable business cannot see its bank balance fall"}, {"label": "B", "text": "₹55 lakh of revenue was billed on 60-day credit and warehouse racking worth ₹7 lakh was capitalised, so cash went out before profit turned into cash"}, {"label": "C", "text": "₹62 lakh of depreciation was charged and depreciation directly reduces the bank balance every year"}, {"label": "D", "text": "₹62 lakh of advance tax was paid; advance tax reduces cash but also reduces reported profit by the same amount"}], "correct_option": "B"}, {"id": "BF-0122", "section_code": "BF", "r1_topic": "Financial Statements", "type": "mcq", "difficulty": 2, "stem": "Which of the following increases operating cash flow without changing profit?", "explanation": "Longer payables defer cash outflow; the P&L is unchanged. The other options change profit or merely move accounting entries.", "options": [{"label": "A", "text": "Negotiating 30 extra days of supplier credit"}, {"label": "B", "text": "Capitalising routine maintenance as an asset"}, {"label": "C", "text": "Switching depreciation from straight-line to a faster method"}, {"label": "D", "text": "Booking a large credit sale on the last day of the year"}], "correct_option": "A"}, {"id": "BF-0123", "section_code": "BF", "r1_topic": "Financial Statements", "type": "mcq", "difficulty": 3, "stem": "Two companies each earn ₹100 crore PAT. A has depreciation of ₹80 crore and capex of ₹20 crore; B has depreciation of ₹5 crore and capex of ₹90 crore. Ignoring working capital, which has the stronger free cash flow?", "explanation": "FCF ≈ PAT + dep − capex. A = 100+80−20 = 160; B = 100+5−90 = 15.", "options": [{"label": "A", "text": "B: higher capex means more investment and therefore higher free cash flow"}, {"label": "B", "text": "B: lower depreciation means higher profit quality, which means higher FCF"}, {"label": "C", "text": "Both are identical because PAT is the same"}, {"label": "D", "text": "A: PAT + depreciation − capex = 160 versus B's 15"}], "correct_option": "D"}, {"id": "BF-0124", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 1, "stem": "Average cost per unit falls as output rises mainly because:", "explanation": "Economies of scale via fixed-cost absorption.", "options": [{"label": "A", "text": "Revenue falls"}, {"label": "B", "text": "Depreciation increases"}, {"label": "C", "text": "Variable cost per unit falls to zero"}, {"label": "D", "text": "Fixed costs are spread over more units"}], "correct_option": "D"}, {"id": "BF-0125", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 2, "stem": "A cost that increases in steps when activity crosses certain thresholds (like hiring a supervisor per 50 workers) is a:", "explanation": "Step costs are fixed within ranges.", "options": [{"label": "A", "text": "Purely variable cost"}, {"label": "B", "text": "Step-fixed (semi-fixed) cost"}, {"label": "C", "text": "Sunk cost"}, {"label": "D", "text": "Opportunity cost"}], "correct_option": "B"}, {"id": "BF-0126", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 2, "stem": "A taxi's driver salary is paid monthly regardless of trips, while fuel depends on distance. Driver salary is a:", "explanation": "Behaviour with volume determines classification.", "options": [{"label": "A", "text": "Fixed cost; fuel is a variable cost"}, {"label": "B", "text": "Both variable"}, {"label": "C", "text": "Both fixed"}, {"label": "D", "text": "Variable cost; fuel is fixed"}], "correct_option": "A"}, {"id": "BF-0127", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 2, "stem": "A firm can make a component for ₹40 (₹28 variable + ₹12 allocated fixed overhead that continues regardless) or buy it for ₹35. What should it do?", "explanation": "Unavoidable fixed overhead is irrelevant; compare ₹35 with avoidable cost ₹28.", "options": [{"label": "A", "text": "Make, since fixed overhead is irrelevant and buying adds cost always"}, {"label": "B", "text": "Buy, since ₹35 is less than ₹40"}, {"label": "C", "text": "Buy, because outsourcing always reduces risk"}, {"label": "D", "text": "Buy only if the supplier price is below ₹28; here making it is cheaper on an incremental basis"}], "correct_option": "D"}, {"id": "BF-0128", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 2, "stem": "A manager insists on continuing a failing project because ₹5 crore has already been invested. This reflects:", "explanation": "Past outlays are irrecoverable.", "options": [{"label": "A", "text": "The sunk-cost fallacy; the decision should depend only on future costs and benefits"}, {"label": "B", "text": "Application of NPV rules"}, {"label": "C", "text": "Prudent risk management"}, {"label": "D", "text": "A proper opportunity-cost analysis"}], "correct_option": "A"}, {"id": "BF-0129", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 2, "stem": "A product line shows an accounting loss after allocated overhead but still has positive contribution. Closing it will:", "explanation": "Shutdown decisions use avoidable costs.", "options": [{"label": "A", "text": "Increase contribution margin of the remaining lines"}, {"label": "B", "text": "Probably reduce total profit, because the allocated fixed overhead remains and must be absorbed by other lines"}, {"label": "C", "text": "Leave profit unchanged"}, {"label": "D", "text": "Increase total profit by the amount of the loss"}], "correct_option": "B"}, {"id": "BF-0130", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 2, "stem": "Which cost is irrelevant when deciding whether to expand production next year?", "explanation": "Only future, incremental, avoidable costs matter.", "options": [{"label": "A", "text": "Extra labour needed"}, {"label": "B", "text": "Increase in electricity usage"}, {"label": "C", "text": "Money already spent on last year's plant that cannot be recovered"}, {"label": "D", "text": "Cost of additional raw material"}], "correct_option": "C"}, {"id": "BF-0131", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 3, "stem": "A bakery has spare capacity. A caterer offers a one-off order at ₹70 per cake; variable cost is ₹55 and fixed costs are already covered by regular sales. Full cost per cake is ₹85. Should the order be accepted?", "explanation": "Incremental analysis: compare price with incremental (variable) cost when capacity is idle.", "options": [{"label": "A", "text": "Yes — it contributes ₹15 per cake towards profit, and fixed costs do not change"}, {"label": "B", "text": "No — one-off orders always damage regular pricing"}, {"label": "C", "text": "No — price is below full cost of ₹85, so each cake loses ₹15"}, {"label": "D", "text": "Only if fixed costs are halved first"}], "correct_option": "A"}, {"id": "BF-0132", "section_code": "BF", "r1_topic": "Financial Statements", "type": "mcq", "difficulty": 1, "stem": "A company pays a ₹5 crore dividend. Which is correct?", "explanation": "Dividends are distributions, not expenses.", "options": [{"label": "A", "text": "Liabilities rise ₹5 crore"}, {"label": "B", "text": "Profit falls ₹5 crore"}, {"label": "C", "text": "Cash and retained earnings both fall by ₹5 crore; no effect on the income statement"}, {"label": "D", "text": "Revenue falls ₹5 crore"}], "correct_option": "C"}, {"id": "BF-0133", "section_code": "BF", "r1_topic": "Financial Statements", "type": "mcq", "difficulty": 1, "stem": "Deferred tax liability arises when:", "explanation": "Timing differences create deferred tax.", "options": [{"label": "A", "text": "Taxable profit is temporarily lower than accounting profit (e.g., faster tax depreciation)"}, {"label": "B", "text": "The firm has losses"}, {"label": "C", "text": "Revenue is deferred"}, {"label": "D", "text": "The firm pays more tax than due"}], "correct_option": "A"}, {"id": "BF-0134", "section_code": "BF", "r1_topic": "Financial Statements", "type": "mcq", "difficulty": 1, "stem": "Which item is a non-current liability?", "explanation": "Due beyond 12 months.", "options": [{"label": "A", "text": "Bank overdraft"}, {"label": "B", "text": "Trade payables"}, {"label": "C", "text": "Outstanding wages"}, {"label": "D", "text": "A 10-year debenture"}], "correct_option": "D"}, {"id": "BF-0135", "section_code": "BF", "r1_topic": "Valuation", "type": "mcq", "difficulty": 1, "stem": "A bank loan with a floating interest rate exposes the borrower to:", "explanation": "Floating-rate liabilities reprice with rates.", "options": [{"label": "A", "text": "Exchange-rate risk only"}, {"label": "B", "text": "Inflation risk only"}, {"label": "C", "text": "Interest-rate risk: higher market rates raise the cost of servicing the loan"}, {"label": "D", "text": "No risk at all"}], "correct_option": "C"}, {"id": "BF-0136", "section_code": "BF", "r1_topic": "Valuation", "type": "mcq", "difficulty": 1, "stem": "Issuing new equity instead of debt to fund a project will typically:", "explanation": "Equity has no mandatory payments but dilutes ownership.", "options": [{"label": "A", "text": "Raise the debt-to-equity ratio"}, {"label": "B", "text": "Lower the number of shares outstanding"}, {"label": "C", "text": "Increase interest tax shield"}, {"label": "D", "text": "Dilute existing shareholders but avoid fixed interest and lower financial risk"}], "correct_option": "D"}, {"id": "BF-0137", "section_code": "BF", "r1_topic": "Valuation", "type": "mcq", "difficulty": 2, "stem": "A firm factors its receivables: it receives 85% of invoice value now and the balance (minus fee) later. The main benefit is:", "explanation": "Factoring accelerates cash at a price.", "options": [{"label": "A", "text": "Faster cash conversion without waiting for customers to pay, at the cost of a fee"}, {"label": "B", "text": "Elimination of credit sales"}, {"label": "C", "text": "Lower revenue recognition"}, {"label": "D", "text": "A permanent reduction in COGS"}], "correct_option": "A"}, {"id": "BF-0138", "section_code": "BF", "r1_topic": "Valuation", "type": "mcq", "difficulty": 2, "stem": "An importer owes USD in 6 months and the rupee is depreciating. Which action best reduces the risk?", "explanation": "Forwards hedge FX risk.", "options": [{"label": "A", "text": "Waiting and buying USD at the spot rate later"}, {"label": "B", "text": "Increasing prices of local products"}, {"label": "C", "text": "Buying USD forward to lock in today's rate"}, {"label": "D", "text": "Paying invoices late to benefit from depreciation"}], "correct_option": "C"}, {"id": "BF-0139", "section_code": "BF", "r1_topic": "Valuation", "type": "mcq", "difficulty": 2, "stem": "Why might a growing business with strong profits still need working-capital finance?", "explanation": "Growth consumes working capital.", "options": [{"label": "A", "text": "Profit is paid out as dividends daily"}, {"label": "B", "text": "Depreciation consumes cash"}, {"label": "C", "text": "Because growth lowers margins automatically"}, {"label": "D", "text": "Rising sales require more inventory and receivables before the cash comes in"}], "correct_option": "D"}, {"id": "BF-0140", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 2, "stem": "A firm expects sales to grow 10% but cost of goods sold to grow 14%. What happens to gross margin?", "explanation": "Margin = (rev − COGS)/rev.", "options": [{"label": "A", "text": "It remains unchanged"}, {"label": "B", "text": "It can't be determined"}, {"label": "C", "text": "It falls, because costs grow faster than revenue"}, {"label": "D", "text": "It rises"}], "correct_option": "C"}, {"id": "BF-0141", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 2, "stem": "A model's revenue forecast assumes 25% growth for five years. A sceptic says that is aggressive. What is the best response?", "explanation": "Scenario analysis tests assumption risk.", "options": [{"label": "A", "text": "Replace revenue with last year's profit"}, {"label": "B", "text": "Ignore it; forecasts can't be tested"}, {"label": "C", "text": "Use the highest growth rate in every scenario"}, {"label": "D", "text": "Run sensitivity/scenario analysis with lower growth cases to see how valuation or cash needs change"}], "correct_option": "D"}, {"id": "BF-0142", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 2, "stem": "In a financial model, which should be kept as a separate input rather than hard-coded in formulas?", "explanation": "Inputs separated from calculations make models auditable and flexible.", "options": [{"label": "A", "text": "Row totals"}, {"label": "B", "text": "Intermediate sums"}, {"label": "C", "text": "Cell borders"}, {"label": "D", "text": "Key assumptions such as growth rate, tax rate and discount rate"}], "correct_option": "D"}, {"id": "BF-0143", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 2, "stem": "Revenue is forecast as volume × price. Volume grows 5% and price falls 3%. The correct revenue growth is approximately:", "explanation": "Growth factors multiply.", "options": [{"label": "A", "text": "1.05 × 0.97 − 1 ≈ +1.85%"}, {"label": "B", "text": "+8% (5% + 3%)"}, {"label": "C", "text": "+15%"}, {"label": "D", "text": "+2% (5% − 3%)"}], "correct_option": "A"}, {"id": "BF-0144", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "mcq", "difficulty": 1, "stem": "Which change raises EPS without any increase in net profit?", "explanation": "EPS = profit ÷ shares; fewer shares increase it.", "options": [{"label": "A", "text": "A rights issue at a discount"}, {"label": "B", "text": "A share buyback that reduces shares outstanding"}, {"label": "C", "text": "Raising the dividend payout"}, {"label": "D", "text": "Issuing bonus debentures"}], "correct_option": "B"}, {"id": "BF-0145", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "mcq", "difficulty": 2, "stem": "A company's gross margin is stable but net margin has halved. The most likely culprit is:", "explanation": "Stable gross margin ⇒ the pressure lies below gross profit.", "options": [{"label": "A", "text": "A cut in depreciation"}, {"label": "B", "text": "Higher operating expenses, interest or taxes below the gross-profit line"}, {"label": "C", "text": "A change in cost of goods sold per unit"}, {"label": "D", "text": "A sudden increase in selling price"}], "correct_option": "B"}, {"id": "BF-0146", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "mcq", "difficulty": 2, "stem": "A firm reports a 'one-time' gain of ₹40 crore from selling a building. Why should analysts adjust for it?", "explanation": "Quality of earnings depends on recurring operating profit.", "options": [{"label": "A", "text": "It reduces tax paid"}, {"label": "B", "text": "Gains are never real income"}, {"label": "C", "text": "It is non-recurring, so it overstates sustainable operating earnings"}, {"label": "D", "text": "It improves cash conversion"}], "correct_option": "C"}, {"id": "BF-0147", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "mcq", "difficulty": 2, "stem": "Company A and B both have ₹100 crore EBITDA. A has depreciation ₹10 crore; B ₹60 crore. Which statement is most accurate?", "explanation": "EBITDA ignores capital intensity; EBIT reflects asset wear.", "options": [{"label": "A", "text": "A's EBIT is higher, but B's heavier depreciation suggests a more capital-intensive business needing ongoing reinvestment"}, {"label": "B", "text": "Both have identical profitability on every measure"}, {"label": "C", "text": "B is more profitable because depreciation is non-cash"}, {"label": "D", "text": "A must have lower cash flows because depreciation is lower"}], "correct_option": "A"}, {"id": "BF-0148", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "mcq", "difficulty": 2, "stem": "Which is the correct order of profit measures from top to bottom of an income statement?", "explanation": "Costs are deducted step by step: COGS, opex, depreciation, interest, tax.", "options": [{"label": "A", "text": "Gross profit → revenue → EBIT → PAT"}, {"label": "B", "text": "Revenue → gross profit → EBITDA → EBIT → PBT → PAT"}, {"label": "C", "text": "Revenue → PAT → EBIT → gross profit"}, {"label": "D", "text": "Revenue → EBIT → gross profit → EBITDA → PAT"}], "correct_option": "B"}, {"id": "BF-0149", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "numeric", "difficulty": 1, "stem": "A company has EBIT of ₹180 lakh and interest expense of ₹30 lakh. Find the interest coverage ratio (times).", "explanation": "180/30 = 6.00x.", "answer": {"value": 6.0, "format": "x", "tolerance_abs": 0.03}}, {"id": "BF-0150", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "numeric", "difficulty": 1, "stem": "A company has EBIT of ₹260 lakh and interest expense of ₹40 lakh. Find the interest coverage ratio (times).", "explanation": "260/40 = 6.50x.", "answer": {"value": 6.5, "format": "x", "tolerance_abs": 0.0325}}, {"id": "BF-0151", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "numeric", "difficulty": 1, "stem": "A company has EBIT of ₹400 lakh and interest expense of ₹70 lakh. Find the interest coverage ratio (times).", "explanation": "400/70 = 5.71x.", "answer": {"value": 5.714286, "format": "x", "tolerance_abs": 0.028571430000000002}}, {"id": "BF-0152", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "numeric", "difficulty": 1, "stem": "A company's revenue is ₹240 crore, cost of revenue ₹145 crore and selling & distribution expenses ₹57 crore. Calculate the gross margin %.", "explanation": "(240−145)/240 = 39.58%. Selling expenses are below the gross-profit line.", "answer": {"value": 0.395833, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "BF-0153", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "numeric", "difficulty": 1, "stem": "A company's revenue is ₹530 crore, cost of revenue ₹287 crore and selling & distribution expenses ₹145 crore. Calculate the gross margin %.", "explanation": "(530−287)/530 = 45.85%. Selling expenses are below the gross-profit line.", "answer": {"value": 0.458491, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "BF-0154", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "numeric", "difficulty": 1, "stem": "A company's revenue is ₹790 crore, cost of revenue ₹436 crore and selling & distribution expenses ₹212 crore. Calculate the gross margin %.", "explanation": "(790−436)/790 = 44.81%. Selling expenses are below the gross-profit line.", "answer": {"value": 0.448101, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "BF-0155", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "numeric", "difficulty": 1, "stem": "A company's revenue is ₹820 crore, cost of revenue ₹485 crore and selling & distribution expenses ₹201 crore. Calculate the gross margin %.", "explanation": "(820−485)/820 = 40.85%. Selling expenses are below the gross-profit line.", "answer": {"value": 0.408537, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "BF-0156", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "numeric", "difficulty": 1, "stem": "A firm reports revenue ₹1170L, COGS ₹751L, other operating costs (excluding depreciation) ₹94L and depreciation ₹37L. What is EBITDA (₹ lakh)?", "explanation": "EBITDA = 1170−751−94 = 325. EBIT would additionally subtract depreciation (288).", "answer": {"value": 325, "format": "num", "tolerance_abs": 1.625}}, {"id": "BF-0157", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "numeric", "difficulty": 1, "stem": "A firm reports revenue ₹500L, COGS ₹260L, other operating costs (excluding depreciation) ₹72L and depreciation ₹23L. What is EBITDA (₹ lakh)?", "explanation": "EBITDA = 500−260−72 = 168. EBIT would additionally subtract depreciation (145).", "answer": {"value": 168, "format": "num", "tolerance_abs": 0.84}}, {"id": "BF-0158", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "numeric", "difficulty": 1, "stem": "A firm reports revenue ₹650L, COGS ₹333L, other operating costs (excluding depreciation) ₹53L and depreciation ₹41L. What is EBITDA (₹ lakh)?", "explanation": "EBITDA = 650−333−53 = 264. EBIT would additionally subtract depreciation (223).", "answer": {"value": 264, "format": "num", "tolerance_abs": 1.32}}, {"id": "BF-0159", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "numeric", "difficulty": 1, "stem": "A firm reports revenue ₹690L, COGS ₹369L, other operating costs (excluding depreciation) ₹86L and depreciation ₹47L. What is EBITDA (₹ lakh)?", "explanation": "EBITDA = 690−369−86 = 235. EBIT would additionally subtract depreciation (188).", "answer": {"value": 235, "format": "num", "tolerance_abs": 1.175}}, {"id": "BF-0160", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "numeric", "difficulty": 2, "stem": "A brand sells 160 lakh units a month at ₹85. Volume will grow 7% while price falls 5%. What is projected monthly revenue (₹ lakh)?", "explanation": "160×1.07×85×0.95 = 13824.40. Growth rates multiply.", "answer": {"value": 13824.4, "format": "num", "tolerance_abs": 69.122}}, {"id": "BF-0161", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "numeric", "difficulty": 2, "stem": "A brand sells 70 lakh units a month at ₹125. Volume will grow 10% while price falls 6%. What is projected monthly revenue (₹ lakh)?", "explanation": "70×1.10×125×0.94 = 9047.50. Growth rates multiply.", "answer": {"value": 9047.5, "format": "num", "tolerance_abs": 45.237500000000004}}, {"id": "BF-0162", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "numeric", "difficulty": 2, "stem": "A brand sells 90 lakh units a month at ₹115. Volume will grow 8% while price falls 5%. What is projected monthly revenue (₹ lakh)?", "explanation": "90×1.08×115×0.95 = 10619.10. Growth rates multiply.", "answer": {"value": 10619.1, "format": "num", "tolerance_abs": 53.0955}}, {"id": "BF-0163", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "numeric", "difficulty": 2, "stem": "A brand sells 90 lakh units a month at ₹85. Volume will grow 5% while price falls 6%. What is projected monthly revenue (₹ lakh)?", "explanation": "90×1.05×85×0.94 = 7550.55. Growth rates multiply.", "answer": {"value": 7550.55, "format": "num", "tolerance_abs": 37.75275}}, {"id": "BF-0164", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "numeric", "difficulty": 2, "stem": "PAT is ₹294 crore and there are 2 crore shares. Find EPS (₹).", "explanation": "294/2 = 147.00.", "answer": {"value": 147.0, "format": "inr2", "tolerance_abs": 0.294}}, {"id": "BF-0165", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "numeric", "difficulty": 2, "stem": "PAT is ₹63 crore and there are 10 crore shares. Find EPS (₹).", "explanation": "63/10 = 6.30.", "answer": {"value": 6.3, "format": "inr2", "tolerance_abs": 0.0126}}, {"id": "BF-0166", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "numeric", "difficulty": 2, "stem": "PAT is ₹70 crore and there are 15 crore shares. Find EPS (₹).", "explanation": "70/15 = 4.67.", "answer": {"value": 4.666667, "format": "inr2", "tolerance_abs": 0.01}}, {"id": "BF-0167", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "numeric", "difficulty": 2, "stem": "PAT is ₹84 crore and there are 9 crore shares. Find EPS (₹).", "explanation": "84/9 = 9.33.", "answer": {"value": 9.333333, "format": "inr2", "tolerance_abs": 0.018666666}}, {"id": "BF-0168", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "numeric", "difficulty": 2, "stem": "Revenue ₹1330L, COGS ₹672L, operating expenses ₹151L, interest ₹30L, tax rate 25%. What is PAT (₹ lakh)?", "explanation": "PBT = 477; PAT = 477×0.75 = 357.75.", "answer": {"value": 357.75, "format": "num", "tolerance_abs": 1.78875}}, {"id": "BF-0169", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "numeric", "difficulty": 2, "stem": "Revenue ₹1370L, COGS ₹863L, operating expenses ₹123L, interest ₹31L, tax rate 20%. What is PAT (₹ lakh)?", "explanation": "PBT = 353; PAT = 353×0.80 = 282.40.", "answer": {"value": 282.4, "format": "num", "tolerance_abs": 1.412}}, {"id": "BF-0170", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "numeric", "difficulty": 2, "stem": "Revenue ₹330L, COGS ₹200L, operating expenses ₹36L, interest ₹40L, tax rate 25%. What is PAT (₹ lakh)?", "explanation": "PBT = 54; PAT = 54×0.75 = 40.50.", "answer": {"value": 40.5, "format": "num", "tolerance_abs": 0.2025}}, {"id": "BF-0171", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "numeric", "difficulty": 2, "stem": "Revenue ₹590L, COGS ₹315L, operating expenses ₹80L, interest ₹34L, tax rate 30%. What is PAT (₹ lakh)?", "explanation": "PBT = 161; PAT = 161×0.70 = 112.70.", "answer": {"value": 112.7, "format": "num", "tolerance_abs": 0.5635}}, {"id": "BF-0172", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 2, "stem": "Buying equipment saves interest cost relative to leasing but ties up capital. Which factor would most strongly favour leasing?", "explanation": "Leasing transfers obsolescence risk and conserves capital.", "options": [{"label": "A", "text": "Rapid technological obsolescence and limited access to cheap capital"}, {"label": "B", "text": "Very long asset life with stable technology"}, {"label": "C", "text": "A high balance of idle cash earning low returns"}, {"label": "D", "text": "Expectation of a large residual value"}], "correct_option": "A"}, {"id": "BF-0173", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 1, "stem": "A brand raises price 8% and sees volume fall 12%. Demand is:", "explanation": "Elasticity = 12/8 > 1.", "options": [{"label": "A", "text": "Inelastic, so revenue rises"}, {"label": "B", "text": "Perfectly inelastic"}, {"label": "C", "text": "Elastic, so revenue falls"}, {"label": "D", "text": "Unit elastic"}], "correct_option": "C"}, {"id": "BF-0174", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 1, "stem": "Cost-plus pricing sets price at cost plus 30%. Its main weakness is:", "explanation": "Pricing must reflect demand as well as cost.", "options": [{"label": "A", "text": "It ignores customer willingness to pay and competitor prices"}, {"label": "B", "text": "It ignores costs"}, {"label": "C", "text": "It always results in losses"}, {"label": "D", "text": "It assumes zero margin"}], "correct_option": "A"}, {"id": "BF-0175", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 2, "stem": "A premium brand discounts heavily during a sale. Its likely long-term risk is:", "explanation": "Discount dependence erodes pricing power.", "options": [{"label": "A", "text": "Better working capital"}, {"label": "B", "text": "Higher gross margin"}, {"label": "C", "text": "Lower fixed cost"}, {"label": "D", "text": "Weakening brand perception and training customers to wait for discounts"}], "correct_option": "D"}, {"id": "BF-0176", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "mcq", "difficulty": 2, "stem": "A company's inventory turnover falls from 8x to 5x while sales are flat. A plausible reason is:", "explanation": "Turnover = COGS ÷ inventory.", "options": [{"label": "A", "text": "Depreciation increased"}, {"label": "B", "text": "Stock is building up faster than it sells, tying up cash and raising obsolescence risk"}, {"label": "C", "text": "Customers pay faster"}, {"label": "D", "text": "Sales prices rose"}], "correct_option": "B"}, {"id": "BF-0177", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "mcq", "difficulty": 2, "stem": "A firm reports a high ROE of 30%. Before praising it, an analyst should check:", "explanation": "ROE can be inflated by leverage or buybacks.", "options": [{"label": "A", "text": "Only the share price"}, {"label": "B", "text": "Whether the logo is attractive"}, {"label": "C", "text": "Nothing else is needed"}, {"label": "D", "text": "Whether the figure results from high leverage or a small equity base rather than strong operations"}], "correct_option": "D"}, {"id": "BF-0178", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "mcq", "difficulty": 2, "stem": "A rising debt-to-equity ratio alongside a falling interest coverage ratio most likely signals:", "explanation": "More debt and less coverage = higher risk.", "options": [{"label": "A", "text": "Better asset turnover"}, {"label": "B", "text": "Lower tax rate"}, {"label": "C", "text": "Growing financial risk"}, {"label": "D", "text": "Improving liquidity"}], "correct_option": "C"}, {"id": "BF-0179", "section_code": "BF", "r1_topic": "Ratios and performance", "type": "mcq", "difficulty": 2, "stem": "Asset turnover doubled, but net margin halved. ROE (assuming equal leverage) will:", "explanation": "DuPont: (½)×(2) = 1.", "options": [{"label": "A", "text": "Double"}, {"label": "B", "text": "Stay about the same, since ROE = margin × turnover × leverage"}, {"label": "C", "text": "Fall to zero"}, {"label": "D", "text": "Halve"}], "correct_option": "B"}, {"id": "BF-0180", "section_code": "BF", "r1_topic": "Financial Statements", "type": "mcq", "difficulty": 1, "stem": "A firm sells goods for ₹5 lakh on credit. What happens immediately?", "explanation": "Accrual accounting recognises revenue when earned, not when cash arrives.", "options": [{"label": "A", "text": "Revenue is recognised only when the customer pays, so nothing changes yet"}, {"label": "B", "text": "Revenue and receivables increase by ₹5 lakh; cash does not change until the customer pays"}, {"label": "C", "text": "Cash increases by ₹5 lakh and receivables fall"}, {"label": "D", "text": "Revenue and cash both increase by ₹5 lakh"}], "correct_option": "B"}, {"id": "BF-0181", "section_code": "BF", "r1_topic": "Financial Statements", "type": "mcq", "difficulty": 2, "stem": "A company pays ₹10 lakh of interest in cash. Which statements are directly affected?", "explanation": "Interest is an expense (P&L), paid in cash (CFS) and reduces cash and retained earnings (BS).", "options": [{"label": "A", "text": "Only the balance sheet, because interest reduces liabilities"}, {"label": "B", "text": "Only the cash flow statement, because interest is a financing item and never touches profit"}, {"label": "C", "text": "Income statement and balance sheet but not the cash flow statement, as interest is non-cash"}, {"label": "D", "text": "Income statement (lower profit), cash flow statement (cash outflow), and balance sheet (lower cash and lower retained earnings)"}], "correct_option": "D"}, {"id": "BF-0182", "section_code": "BF", "r1_topic": "Financial Statements", "type": "mcq", "difficulty": 2, "stem": "A logistics firm buys a truck for ₹15 lakh in cash (6-year life, straight-line). In Year 1, how are cash and profit affected?", "explanation": "Capex is an investing outflow; only depreciation hits the P&L. Net book value = 15 − 2.5 = 12.5.", "options": [{"label": "A", "text": "Cash is unaffected in Year 1 because purchases from dealers are always deferred credit expenses"}, {"label": "B", "text": "Both cash and profit fall ₹15 lakh because the truck is expensed in the year of purchase"}, {"label": "C", "text": "Cash falls ₹15 lakh upfront; profit falls only by ₹2.5 lakh depreciation, and ₹12.5 lakh stays on the balance sheet as a fixed asset"}, {"label": "D", "text": "Cash falls ₹2.5 lakh (the first depreciation instalment) and profit falls ₹2.5 lakh; the rest is paid later"}], "correct_option": "C"}, {"id": "BF-0183", "section_code": "BF", "r1_topic": "Financial Statements", "type": "mcq", "difficulty": 2, "stem": "Which line item connects the income statement to the balance sheet's equity section?", "explanation": "Profit after dividends accumulates in retained earnings.", "options": [{"label": "A", "text": "Accounts receivable: credit sales are added straight to equity"}, {"label": "B", "text": "Interest expense: it is carried forward as an equity reserve"}, {"label": "C", "text": "Retained earnings: net profit less dividends is added to equity each year"}, {"label": "D", "text": "Depreciation: it is added to equity as a non-cash gain"}], "correct_option": "C"}, {"id": "BF-0184", "section_code": "BF", "r1_topic": "Financial Statements", "type": "mcq", "difficulty": 3, "stem": "A firm buys ₹12 lakh of equipment in cash (6-year life, no salvage, straight-line) and runs it at full capacity. At the end of Year 2, which statement of the position is correct?", "explanation": "Cash is spent once (Year 1). Depreciation of 12/6 = 2 per year; after two years accumulated depreciation is 4 and NBV is 8.", "options": [{"label": "A", "text": "Cash flow shows a ₹12L outflow in both Years 1 and 2; the balance sheet shows the machine at ₹12L"}, {"label": "B", "text": "The balance sheet shows the machine at ₹10L because depreciation is charged only once, in Year 1"}, {"label": "C", "text": "Cash flow statement shows the ₹12L outflow only in Year 1; income statement shows ₹2L depreciation each year; the balance sheet shows net book value of ₹8L"}, {"label": "D", "text": "Cash flow shows ₹2L outflow each year; income statement shows ₹12L depreciation in Year 1"}], "correct_option": "C"}, {"id": "BF-0185", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 1, "stem": "Which cost is typically a fixed cost for a bakery in the short run?", "explanation": "Rent doesn't vary with output; the rest scale with volume.", "options": [{"label": "A", "text": "Monthly shop rent"}, {"label": "B", "text": "Flour used per cake"}, {"label": "C", "text": "Packaging per box"}, {"label": "D", "text": "Delivery fee per order"}], "correct_option": "A"}, {"id": "BF-0186", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 1, "stem": "Which metric best shows how quickly acquisition spend is recovered?", "explanation": "CAC payback = CAC ÷ monthly contribution per customer.", "options": [{"label": "A", "text": "Inventory turnover"}, {"label": "B", "text": "Price-to-earnings ratio"}, {"label": "C", "text": "Interest coverage"}, {"label": "D", "text": "CAC payback period (months of contribution needed to repay CAC)"}], "correct_option": "D"}, {"id": "BF-0187", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 2, "stem": "A brand lifts price 10% and volume falls 4%. Variable cost per unit is 60% of the old price. What happens to total contribution?", "explanation": "Contribution = volume × (price − variable cost): 0.96×0.50 = 0.48 vs 0.40 → +20%.", "options": [{"label": "A", "text": "It falls because volume fell"}, {"label": "B", "text": "It rises: unit contribution jumps from 40% to 50% of old price (+25%) while volume only falls 4%"}, {"label": "C", "text": "It cannot be determined without fixed costs"}, {"label": "D", "text": "It stays flat because price and volume offset"}], "correct_option": "B"}, {"id": "BF-0188", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 2, "stem": "A cloud kitchen's first order brings ₹650 revenue, ₹380 food cost and ₹300 acquisition cost. How should this ₹30 first-order loss be interpreted?", "explanation": "CAC is an investment recouped over the customer lifetime.", "options": [{"label": "A", "text": "A profit, because revenue exceeds food cost"}, {"label": "B", "text": "Acceptable only if repeat orders recover the acquisition cost, i.e., lifetime contribution exceeds CAC"}, {"label": "C", "text": "Irrelevant because CAC is not a real cost"}, {"label": "D", "text": "A permanent failure because any negative first order proves the model is broken"}], "correct_option": "B"}, {"id": "BF-0189", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "mcq", "difficulty": 2, "stem": "A subscription start-up's total profit rises, but contribution margin per subscriber is falling every quarter. What should an investor conclude?", "explanation": "Unit economics reveal whether growth creates or destroys value per customer.", "options": [{"label": "A", "text": "Total profit can grow from scale or fixed-cost leverage even as each new subscriber is worth less; scaling with worsening unit economics magnifies the eventual problem"}, {"label": "B", "text": "Unit economics and total profit measure the same thing, so there is no concern"}, {"label": "C", "text": "Falling unit margin is always a short-term discounting tactic that self-corrects at scale"}, {"label": "D", "text": "Only audited total profit matters; unit economics is unreliable management data"}], "correct_option": "A"}, {"id": "BF-0190", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "numeric", "difficulty": 2, "stem": "A food delivery order brings revenue of ₹310; food cost ₹160; allocated acquisition cost ₹390. Profit/(loss) on the first order?", "explanation": "310−160−390 = -240.", "answer": {"value": -240, "format": "inr", "tolerance_abs": 1.0}}, {"id": "BF-0191", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "numeric", "difficulty": 2, "stem": "A food delivery order brings revenue of ₹620; food cost ₹250; allocated acquisition cost ₹280. Profit/(loss) on the first order?", "explanation": "620−250−280 = 90.", "answer": {"value": 90, "format": "inr", "tolerance_abs": 1.0}}, {"id": "BF-0192", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "numeric", "difficulty": 2, "stem": "A food delivery order brings revenue of ₹730; food cost ₹380; allocated acquisition cost ₹370. Profit/(loss) on the first order?", "explanation": "730−380−370 = -20.", "answer": {"value": -20, "format": "inr", "tolerance_abs": 1.0}}, {"id": "BF-0193", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "numeric", "difficulty": 2, "stem": "A food delivery order brings revenue of ₹760; food cost ₹440; allocated acquisition cost ₹170. Profit/(loss) on the first order?", "explanation": "760−440−170 = 150.", "answer": {"value": 150, "format": "inr", "tolerance_abs": 1.0}}, {"id": "BF-0194", "section_code": "BF", "r1_topic": "Unit economics and business models", "type": "numeric", "diffi
