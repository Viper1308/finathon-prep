s of funds)<\/th><th>Liabilities and equity (sources)<\/th><\/tr>\n<tr><td>Loans and advances (biggest, earns interest)<\/td><td>Deposits (current, savings, fixed) — owed to customers<\/td><\/tr>\n<tr><td>Investments (government bonds, held for SLR)<\/td><td>Borrowings (from other banks, bonds, RBI)<\/td><\/tr>\n<tr><td>Cash and balance with RBI (CRR)<\/td><td>Equity capital and reserves<\/td><\/tr>\n<\/table>\n<p>A customer's deposit is a <b>liability<\/b> to the bank because the bank owes it back. A loan the bank gives is an <b>asset<\/b>. A bank is typically leveraged around 10 to 15 times, so a small loss on assets can wipe out its equity. This is the reason for capital rules.<\/p>\n\n<h3>3. How a bank makes money<\/h3>\n<div class=\"fx\">Net interest income (NII) = Interest earned &minus; Interest paid<br>Net interest margin (NIM) = NII &divide; Average earning assets<br>Total income = NII + Other (fee) income<br>Cost-to-income ratio = Operating expenses &divide; Total income<br>Pre-provision profit = Total income &minus; Operating expenses<br>Profit before tax = Pre-provision profit &minus; Provisions<\/div>\n<div class=\"eg\">Interest earned ₹900 crore, interest paid ₹520 crore, average earning assets ₹10,000 crore, fee income ₹120 crore, operating costs ₹250 crore, provisions ₹80 crore.\n<ul><li>NII = 380; NIM = 3.8%.<\/li><li>Total income = 500; cost-to-income = 50%.<\/li><li>Pre-provision profit = 250; PBT = 170.<\/li><\/ul><\/div>\n<p>Banks also earn from fees: loan processing, cards, forex, distributing insurance and mutual funds. Treasury gains on bond trading add volatility.<\/p>\n\n<h3>4. Key performance ratios<\/h3>\n<table>\n<tr><th>Ratio<\/th><th>Formula<\/th><th>What it tells you<\/th><\/tr>\n<tr><td>CASA ratio<\/td><td>(Current + savings deposits) ÷ total deposits<\/td><td>Cheap funding. Higher means lower cost of funds.<\/td><\/tr>\n<tr><td>Credit-deposit (CD) ratio<\/td><td>Loans ÷ deposits<\/td><td>How much of deposits is lent out<\/td><\/tr>\n<tr><td>Gross NPA ratio<\/td><td>Gross NPAs ÷ gross loans<\/td><td>Share of bad loans<\/td><\/tr>\n<tr><td>Net NPA ratio<\/td><td>(Gross NPA − provisions) ÷ (loans − provisions)<\/td><td>Bad loans after cover<\/td><\/tr>\n<tr><td>Provision coverage ratio<\/td><td>Provisions ÷ gross NPA<\/td><td>Cushion held against bad loans<\/td><\/tr>\n<tr><td>Return on assets (ROA)<\/td><td>Net profit ÷ average assets<\/td><td>1% to 1.5% is good for banks<\/td><\/tr>\n<tr><td>Capital adequacy ratio (CAR)<\/td><td>Capital ÷ risk-weighted assets<\/td><td>Loss-absorbing buffer<\/td><\/tr>\n<\/table>\n\n<h3>5. Bad loans: how an NPA forms and what happens<\/h3>\n<ul>\n<li>A loan is a <b>Non-Performing Asset (NPA)<\/b> when interest or principal is overdue for <b>more than 90 days<\/b>.<\/li>\n<li>Early warning: accounts overdue 1 to 30, 31 to 60 and 61 to 90 days are tagged SMA-0, SMA-1 and SMA-2 (special mention accounts).<\/li>\n<li>NPAs are classified as Substandard, Doubtful and Loss. The bank sets aside <b>provisions<\/b> (a percentage of the loan) against them. A provision is an <em>expense<\/em>; it cuts profit even though no cash leaves at that moment.<\/li>\n<li>Recovery routes: restructuring, sale to an asset reconstruction company, SARFAESI action to seize collateral, the insolvency process, or write-off.<\/li>\n<\/ul>\n<div class=\"eg\">Gross loans ₹50,000 crore; gross NPAs ₹1,500 crore (3.0%); provisions ₹1,050 crore. Provision coverage = 70%. Net NPA = 450 ÷ 48,950 = 0.92%.<\/div>\n\n<h3>6. Capital and risk<\/h3>\n<p>Banks face <b>credit risk<\/b> (borrowers default), <b>liquidity risk<\/b> (can't meet withdrawals), <b>market/interest-rate risk<\/b> (bond prices fall when rates rise; funding costs change faster than loan yields), and <b>operational risk<\/b> (fraud, system failure).<\/p>\n<p><b>Basel III<\/b> sets minimum capital and liquidity. Risk-weighted assets (RWA) give a high weight to risky loans and a low weight to safe assets such as government bonds. Total capital ÷ RWA is the CAR; Indian banks must keep a minimum above the Basel floor of 8% (stems will give the number). <b>Liquidity Coverage Ratio<\/b> requires enough high-quality liquid assets to survive a 30-day stress.<\/p>\n<div class=\"eg\">RWA ₹1,20,000 crore; capital ₹15,600 crore. CAR = 13%. If NPAs force a ₹3,000 crore loss, capital drops to 12,600 and CAR to 10.5%.<\/div>\n\n<h3>7. Regulators and the RBI toolkit<\/h3>\n<table>\n<tr><th>Tool<\/th><th>What it is<\/th><th>Effect<\/th><\/tr>\n<tr><td>Repo rate<\/td><td>Rate at which RBI lends to banks against securities<\/td><td>Raising it makes borrowing costlier, slows credit and inflation; cutting does the opposite<\/td><\/tr>\n<tr><td>Reverse repo / SDF<\/td><td>Rate at which RBI absorbs excess money from banks<\/td><td>Floor of the rate corridor<\/td><\/tr>\n<tr><td>MSF<\/td><td>Emergency overnight borrowing, above repo<\/td><td>Ceiling of the corridor<\/td><\/tr>\n<tr><td>CRR<\/td><td>Share of deposits kept as cash with RBI; earns no interest<\/td><td>Higher CRR drains lendable money<\/td><\/tr>\n<tr><td>SLR<\/td><td>Share of deposits kept in government securities, cash or gold<\/td><td>Higher SLR reduces lending capacity<\/td><\/tr>\n<tr><td>Open market operations<\/td><td>RBI buys or sells government bonds<\/td><td>Buying injects money, selling absorbs it<\/td><\/tr>\n<\/table>\n<p>Most new floating-rate loans are linked to an external benchmark (for example the repo rate), so changes in the repo rate reach borrowers quickly. Other regulators: <b>SEBI<\/b> (securities markets, mutual funds), <b>IRDAI<\/b> (insurance), <b>PFRDA<\/b> (pensions).<\/p>\n<div class=\"eg\">Deposits ₹2,00,000 crore, CRR 4%, SLR 18%. Cash with RBI = 8,000; government securities = 36,000. Remaining 78% = ₹1,56,000 crore is free for loans and other uses.<\/div>\n\n<h3>8. Types of financial institutions<\/h3>\n<table>\n<tr><th>Institution<\/th><th>Role and key rule<\/th><\/tr>\n<tr><td>Commercial banks (public, private, foreign)<\/td><td>Full banking: deposits, loans, payments<\/td><\/tr>\n<tr><td>Small finance banks<\/td><td>Banks focused on small borrowers, with lending targets for priority sectors<\/td><\/tr>\n<tr><td>Payments banks<\/td><td>Accept deposits and offer payments but cannot lend<\/td><\/tr>\n<tr><td>Co-operative banks<\/td><td>Owned by members; urban and rural<\/td><\/tr>\n<tr><td>NBFCs<\/td><td>Lend and invest (vehicle loans, gold loans, microfinance) but cannot accept demand deposits or issue cheques<\/td><\/tr>\n<tr><td>Insurance companies<\/td><td>Pool risk, invest premiums<\/td><\/tr>\n<tr><td>Mutual funds / AMCs<\/td><td>Pool investors' money into portfolios<\/td><\/tr>\n<tr><td>Stock exchanges, depositories, clearing corporations<\/td><td>Trading, holding of securities in electronic form, settlement<\/td><\/tr>\n<\/table>\n<p><b>Deposit insurance (DICGC)<\/b> covers up to ₹5 lakh per depositor per bank (principal plus interest). Savings above that are exposed if a bank fails.<\/p>\n\n<h3>9. Payments in one glance<\/h3>\n<table>\n<tr><th>System<\/th><th>Use<\/th><\/tr>\n<tr><td>UPI<\/td><td>Instant, 24×7 mobile payments; mostly free for person-to-person<\/td><\/tr>\n<tr><td>IMPS<\/td><td>Instant bank transfers, 24×7<\/td><\/tr>\n<tr><td>NEFT<\/td><td>Batch settlement, no minimum<\/td><\/tr>\n<tr><td>RTGS<\/td><td>Large-value real-time transfers; minimum ₹2 lakh<\/td><\/tr>\n<\/table>\n\n<h3>Common traps<\/h3>\n<ul>\n<li>Treating deposits as a bank's own money or an asset. For the bank they are a liability.<\/li>\n<li>Confusing CRR (cash with RBI, no return) with SLR (securities held by the bank, small return).<\/li>\n<li>Reading a rate cut as making loans dearer.<\/li>\n<li>Forgetting that provisions reduce profit when computing PBT.<\/li>\n<li>Using a bank's ROA benchmark (about 1%) against a normal company's.<\/li>\n<\/ul>\n"}, {"id": "bf-val", "sec": "BF", "title": "Valuation", "r1": "Valuation", "min": 45, "html": "\n<p class=\"lead\">Valuation tries to answer \"what is this business, or this project, worth today?\" The two core ideas: a rupee in the future is worth less than a rupee today, and a business is worth the cash it will produce for its owners. Everything else is technique.<\/p>\n\n<h3>1. Value is the present value of future cash<\/h3>\n<div class=\"fx\">Present value = Cash flow &divide; (1 + r)<sup>n<\/sup><\/div>\n<p>If you require 10% a year, ₹110 one year from now is worth 110 ÷ 1.10 = ₹100 today. Discounting is just compounding in reverse. The rate you use (the <b>discount rate<\/b>) reflects the risk: safer cash flows get a lower rate and a higher value.<\/p>\n<div class=\"eg\">A business will pay out ₹100, ₹120 and ₹140 in years 1, 2, 3. At 10%: 100/1.1 + 120/1.21 + 140/1.331 = 90.9 + 99.2 + 105.2 = ₹295.3 today.<\/div>\n\n<h3>2. Project valuation: capital budgeting<\/h3>\n<p>Should we spend ₹X now for cash flows later? Four tools:<\/p>\n<table>\n<tr><th>Method<\/th><th>Rule<\/th><th>Strength<\/th><th>Weakness<\/th><\/tr>\n<tr><td><b>NPV<\/b> = PV of inflows − initial outlay<\/td><td>Accept if NPV &gt; 0<\/td><td>Measures value created in rupees; uses time value<\/td><td>Needs a discount rate<\/td><\/tr>\n<tr><td><b>IRR<\/b> = rate where NPV = 0<\/td><td>Accept if IRR &gt; required return<\/td><td>Intuitive percentage<\/td><td>Can mislead when ranking projects of different size, or with multiple sign changes<\/td><\/tr>\n<tr><td><b>Payback<\/b> = years to recover outlay<\/td><td>Accept if under a limit<\/td><td>Simple, shows liquidity risk<\/td><td>Ignores time value and cash after payback<\/td><\/tr>\n<tr><td><b>Discounted payback<\/b><\/td><td>Same, using discounted flows<\/td><td>Adds time value<\/td><td>Still ignores later cash<\/td><\/tr>\n<\/table>\n<div class=\"eg\"><b>Machine.<\/b> Cost ₹10 lakh now; inflows ₹4 lakh a year for 4 years; required return 12%.\n<ul><li>PV of inflows = 4 × [1 − 1.12<sup>−4<\/sup>] ÷ 0.12 = 4 × 3.0373 = ₹12.15 lakh.<\/li>\n<li>NPV = 12.15 − 10 = <b>+₹2.15 lakh<\/b>, so accept.<\/li>\n<li>Payback = 10 ÷ 4 = 2.5 years.<\/li>\n<li>IRR: about 21.9% (the rate at which the annuity factor equals 10 ÷ 4 = 2.5).<\/li><\/ul>\nWhen projects compete for limited funds, rank by NPV (or profitability index = PV of inflows ÷ outlay). For projects of unequal life, compare equivalent annual cost.<\/div>\n<p><b>Which cash flows count?<\/b> Incremental, after-tax cash flows: add back depreciation (non-cash) but include the tax shield it creates; include working-capital changes; ignore sunk costs and financing costs (these are captured in the discount rate); include opportunity costs.<\/p>\n\n<h3>3. Cost of capital and WACC<\/h3>\n<p>The discount rate for a whole business is its <b>weighted average cost of capital<\/b>: what it pays, on average, to the people who fund it.<\/p>\n<div class=\"fx\">WACC = (E &divide; V) &times; Re + (D &divide; V) &times; Rd &times; (1 &minus; t)<\/div>\n<ul>\n<li><b>E, D<\/b> are the market values of equity and debt; V = E + D.<\/li>\n<li><b>Rd<\/b> is borrowing cost; interest is tax-deductible so the after-tax cost is Rd × (1 − t).<\/li>\n<li><b>Re<\/b> (cost of equity) by CAPM: risk-free rate + beta × equity risk premium. Beta measures how much the stock moves versus the market (beta 1.2: 20% more than the market).<\/li>\n<\/ul>\n<div class=\"eg\">Equity ₹510 crore at 15%, debt ₹440 crore at 8% pre-tax, tax 25%. Weights: 53.7% and 46.3%. Rd after tax = 6%. WACC = 0.537 × 15% + 0.463 × 6% = 8.05% + 2.78% = <b>10.83%<\/b>.<\/div>\n\n<h3>4. Capital structure and leverage<\/h3>\n<ul>\n<li>Debt is cheaper than equity (lenders have first claim and interest is tax-deductible) but adds a fixed obligation. More debt raises the risk to owners.<\/li>\n<li><b>Financial leverage<\/b> amplifies EPS changes: Degree of financial leverage = EBIT ÷ (EBIT − interest).<\/li>\n<li>The best structure balances the tax saving against the cost of distress. Too much debt raises the cost of both debt and equity.<\/li>\n<\/ul>\n<div class=\"eg\">EBIT ₹100, interest ₹20, 10 shares, tax 25%. EPS = (100 − 20) × 0.75 ÷ 10 = ₹6. If EBIT rises 20% to 120, EPS = 100 × 0.75 ÷ 10 = ₹7.5, a 25% rise. DFL = 100 ÷ 80 = 1.25 ✓.<\/div>\n\n<h3>5. Valuing a whole business: DCF<\/h3>\n<ol>\n<li>Forecast free cash flow to the firm (FCFF) for 5 to 10 years: EBIT × (1 − t) + depreciation − capex − increase in working capital.<\/li>\n<li>Choose a discount rate: WACC.<\/li>\n<li>Estimate a <b>terminal value<\/b> for all years after the forecast, using the Gordon growth formula: TV = FCF<sub>n+1<\/sub> ÷ (WACC − g). The growth rate g must be below WACC and below long-run economic growth.<\/li>\n<li>Discount each year's cash flow and the terminal value to today. The total is <b>enterprise value (EV)<\/b>.<\/li>\n<li>Equity value = EV − net debt. Per share = equity value ÷ number of shares.<\/li>\n<\/ol>\n<div class=\"eg\">FCF next year ₹100 crore, growing 5% forever, WACC 11%. EV = 100 ÷ (0.11 − 0.05) = ₹1,667 crore. Net debt ₹400 crore → equity ₹1,267 crore. With 10 crore shares: ₹126.7 per share.<\/div>\n<div class=\"why\"><b>Sensitivity.<\/b> The terminal value is usually 60% to 80% of a DCF. Change WACC from 11% to 10% in the example and EV becomes 100 ÷ 0.05 = ₹2,000 crore, up 20%. Always show a range, not one number.<\/div>\n\n<h3>6. Enterprise value vs equity value<\/h3>\n<div class=\"fx\">Equity value (market cap) = Share price &times; Shares<br>Enterprise value = Equity value + Debt + Preference + Minority interest &minus; Cash<br>Equity value = EV &minus; Net debt<\/div>\n<p>EV is what it would cost to buy the whole operating business and pay off its debts, net of the cash you acquire. Operating profit metrics (EBITDA, EBIT, sales) belong to <em>all<\/em> capital providers, so they pair with EV. Earnings and book value belong to <em>owners<\/em>, so they pair with equity value.<\/p>\n\n<h3>7. Relative valuation: using multiples<\/h3>\n<table>\n<tr><th>Multiple<\/th><th>Formula<\/th><th>Best for<\/th><\/tr>\n<tr><td>P/E<\/td><td>Price ÷ EPS (or market cap ÷ PAT)<\/td><td>Stable, profit-making firms<\/td><\/tr>\n<tr><td>EV/EBITDA<\/td><td>EV ÷ EBITDA<\/td><td>Capital-heavy firms; compares firms with different debt<\/td><\/tr>\n<tr><td>EV/Sales<\/td><td>EV ÷ revenue<\/td><td>Loss-making or high-growth firms<\/td><\/tr>\n<tr><td>P/B<\/td><td>Price ÷ book value per share<\/td><td>Banks and asset-heavy firms<\/td><\/tr>\n<tr><td>PEG<\/td><td>P/E ÷ growth rate (%)<\/td><td>Adjusting P/E for growth<\/td><\/tr>\n<tr><td>Dividend yield<\/td><td>Dividend per share ÷ price<\/td><td>Income stocks<\/td><\/tr>\n<\/table>\n<p>Method: choose comparable companies, compute their multiple, take the median, apply it to your firm's metric. EV/EBITDA of 10 on EBITDA ₹200 crore gives EV ₹2,000 crore. Less net debt ₹500 crore leaves equity ₹1,500 crore. A multiple reflects growth, risk and returns, so firms are comparable only if those are similar.<\/p>\n\n<h3>8. Dividend discount model and CAPM<\/h3>\n<div class=\"fx\">Price = D<sub>1<\/sub> &divide; (r &minus; g) &nbsp;|&nbsp; Re = Rf + &beta; &times; (Rm &minus; Rf)<\/div>\n<p>A stock paying ₹10 next year, growing 4% forever, with a required return of 12%, is worth 10 ÷ 0.08 = ₹125. If the risk-free rate is 7%, market return 12% and beta 1.2, Re = 7% + 1.2 × 5% = 13%.<\/p>\n\n<h3>9. Which method when?<\/h3>\n<table>\n<tr><th>Situation<\/th><th>Best tool<\/th><\/tr>\n<tr><td>Deciding to buy a machine or open a store<\/td><td>NPV / IRR<\/td><\/tr>\n<tr><td>Steady, profitable listed firm<\/td><td>P/E, DCF<\/td><\/tr>\n<tr><td>Loss-making start-up<\/td><td>EV/Sales, DCF with long forecast<\/td><\/tr>\n<tr><td>Bank<\/td><td>P/B with ROE, dividend discount<\/td><\/tr>\n<tr><td>Firms with very different debt levels<\/td><td>EV-based multiples<\/td><\/tr>\n<\/table>\n\n<h3>Common traps<\/h3>\n<ul>\n<li>Subtracting net debt twice, or adding it to an EV that is already net of cash.<\/li>\n<li>Discounting FCFF at the cost of equity (use WACC), or FCFE at WACC.<\/li>\n<li>Using the pre-tax cost of debt in WACC.<\/li>\n<li>g greater than or equal to the discount rate, which makes the Gordon formula meaningless.<\/li>\n<li>Counting depreciation as a cash flow rather than adding it back, or ignoring the tax shield.<\/li>\n<li>Including sunk costs or financing costs in project cash flows.<\/li>\n<\/ul>\n"}, {"id": "pf-tvm", "sec": "PF", "title": "Time value of money and compounding", "r1": "Time value of money and compounding", "min": 30, "html": "\n<p class=\"lead\">Money you have today can be invested and grow, so a rupee today is worth more than a rupee later. This one idea powers every loan, SIP, retirement plan and inflation calculation in personal finance.<\/p>\n<h3>1. Simple vs compound interest<\/h3>\n<p><b>Simple interest<\/b> is earned only on the original amount: SI = P × r × t. ₹1,00,000 at 8% for 5 years earns 8,000 a year, total ₹40,000, ending at ₹1,40,000.<\/p>\n<p><b>Compound interest<\/b> is earned on the original amount <em>and on earlier interest<\/em>. Each year's interest is added and starts earning too.<\/p>\n<div class=\"fx\">FV = PV &times; (1 + r)<sup>n<\/sup> &nbsp;|&nbsp; PV = FV &divide; (1 + r)<sup>n<\/sup><\/div>\n<p>The same ₹1,00,000 at 8% compounded yearly for 5 years becomes 1,00,000 × 1.08<sup>5<\/sup> = ₹1,46,933. The extra ₹6,933 is interest on interest. Over longer periods the gap becomes enormous, which is why starting early matters more than investing more.<\/p>\n<h3>2. Compounding frequency and effective rate<\/h3>\n<p>If interest is added more than once a year, you earn slightly more. A \"12% nominal rate compounded monthly\" means 1% each month.<\/p>\n<div class=\"fx\">EAR = (1 + r/m)<sup>m<\/sup> &minus; 1<\/div>\n<p>EAR for 12% monthly = 1.01<sup>12<\/sup> − 1 = 12.68%. Quarterly gives 12.55%. When comparing deposits or loans, compare effective rates, not nominal.<\/p>\n<h3>3. Rules of thumb<\/h3>\n<ul>\n<li><b>Rule of 72<\/b>: years to double ≈ 72 ÷ rate%. At 8%, about 9 years; at 12%, 6 years; at 6% inflation, prices double in 12 years.<\/li>\n<li>Tripling ≈ 114 ÷ rate; quadrupling ≈ 144 ÷ rate.<\/li>\n<li>Starting early beats investing more later: ₹5,000 a month at 12% for 20 years grows to about ₹49.5 lakh, while the same amount for only the last 10 years grows to about ₹11.5 lakh.<\/li>\n<\/ul>\n<h3>4. Regular investing and loans: annuities<\/h3>\n<p>An <b>annuity<\/b> is a series of equal payments at regular intervals (a SIP, an EMI, a pension).<\/p>\n<div class=\"fx\">FV of annuity = P &times; [(1 + r)<sup>n<\/sup> &minus; 1] &divide; r<br>PV of annuity = P &times; [1 &minus; (1 + r)<sup>&minus;n<\/sup>] &divide; r<br>Perpetuity (forever): PV = P &divide; r<\/div>\n<p>Use the monthly rate and number of months for monthly payments. Payments at the <em>start<\/em> of each period (annuity due) are worth (1 + r) times the ordinary annuity.<\/p>\n<div class=\"eg\">₹10,000 a month for 15 years at 12% a year (1% a month): FV = 10,000 × (1.01<sup>180<\/sup> − 1) ÷ 0.01 = 10,000 × 499.58 = <b>₹49.96 lakh<\/b>. You paid in only ₹18 lakh; the rest is growth.<\/div>\n<h3>5. Inflation and real returns<\/h3>\n<p>Prices rise, so a rupee buys less in future. The <b>real return<\/b> is what your money gains in purchasing power.<\/p>\n<div class=\"fx\">Real return = (1 + nominal) &divide; (1 + inflation) &minus; 1<\/div>\n<p>10% nominal with 6% inflation: 1.10 ÷ 1.06 − 1 = 3.77% (not 4%). A goal in the future must be inflated: ₹20 lakh today at 8% education inflation costs 20 × 1.08<sup>10<\/sup> = ₹43.2 lakh in 10 years.<\/p>\n<h3>6. CAGR<\/h3>\n<div class=\"fx\">CAGR = (End value &divide; Start value)<sup>1/years<\/sup> &minus; 1<\/div>\n<p>₹2 lakh growing to ₹5 lakh in 8 years: 2.5<sup>1/8<\/sup> − 1 = 12.1% a year. CAGR smooths a bumpy path into one steady rate.<\/p>\n<h3>7. Moving money in time<\/h3>\n<p>You can only add or compare rupees that sit at the same date. To compare ₹50,000 now with ₹60,000 in 2 years at 8%: bring both to today (60,000 ÷ 1.08<sup>2<\/sup> = ₹51,440). The later sum is worth slightly more.<\/p>\n<div class=\"trap\"><b>Common traps.<\/b> Using the annual rate with monthly periods. Mixing simple and compound interest. Quoting the nominal rate as the effective rate. Adding rupees from different years. Forgetting to inflate a future goal.<\/div>\n"}, {"id": "pf-tax", "sec": "PF", "title": "Income, tax and budgeting", "r1": "Income, tax and budgeting", "min": 35, "html": "\n<p class=\"lead\">Income tax and budgets decide how much of what you earn you actually keep and can save. The tax rules change often, so exam questions state them. Your job is to apply the method correctly.<\/p>\n<h3>1. From gross salary to take-home<\/h3>\n<ul>\n<li><b>CTC<\/b> (cost to company) includes items you never see in hand, such as employer PF and gratuity.<\/li>\n<li><b>Gross salary<\/b> = basic + HRA + allowances + bonuses. <b>Net (take-home)<\/b> = gross − income tax (TDS) − employee PF − other deductions.<\/li>\n<li>Employer and employee PF contributions are usually 12% of basic each (the stem will say).<\/li>\n<\/ul>\n<h3>2. How income tax is calculated<\/h3>\n<ol>\n<li>Add up all income (salary, interest, rent, capital gains).<\/li>\n<li>Subtract the <b>standard deduction<\/b>, exemptions and any allowed deductions to get <b>taxable income<\/b>.<\/li>\n<li>Apply <b>progressive slabs<\/b>: each slab's rate applies only to the income inside that slab.<\/li>\n<li>Subtract any <b>rebate<\/b> (it can make tax zero below a threshold).<\/li>\n<li>Add <b>cess<\/b> (a percentage of the tax, not of income).<\/li>\n<\/ol>\n<div class=\"eg\"><b>Slabs as given in a stem:<\/b> nil up to ₹4 lakh, 5% from 4 to 8 lakh, 10% from 8 to 12 lakh. Taxable income ₹10 lakh.\n<ul><li>0 to 4 lakh: 0<\/li><li>4 to 8 lakh: 4,00,000 × 5% = 20,000<\/li><li>8 to 10 lakh: 2,00,000 × 10% = 20,000<\/li><li>Tax = 40,000; cess at 4% = 1,600; total ₹41,600.<\/li><\/ul>\nAverage rate = 41,600 ÷ 10,00,000 = 4.16%. Marginal rate = 10% (the next rupee is taxed at 10%).<\/div>\n<div class=\"why\"><b>Marginal vs average.<\/b> Progressive tax means a raise never reduces take-home pay: only the extra income is taxed at the higher rate, not all of it. Applying the top rate to the whole income is the most common error.<\/div>\n<h3>3. Deductions vs rebates<\/h3>\n<p>A <b>deduction<\/b> reduces taxable income (80C investments up to ₹1.5 lakh, health insurance under 80D, home-loan interest, in the regime that allows them). A <b>rebate or credit<\/b> reduces the tax itself. ₹1 lakh of deduction at a 30% slab saves ₹30,000; ₹1 lakh of tax credit saves ₹1 lakh. Two regimes may exist side by side (old with deductions, new with lower rates and few deductions); to choose, compute tax both ways.<\/p>\n<h3>4. HRA exemption<\/h3>\n<p>The tax-free part of HRA is the <b>least<\/b> of: (a) HRA received; (b) rent paid − 10% of basic; (c) 50% of basic in metros (40% elsewhere). The rest is taxable.<\/p>\n<div class=\"eg\">Basic ₹8,40,000; HRA received ₹3,94,430; rent paid ₹2,86,763; non-metro (40%).\n(a) 3,94,430; (b) 2,86,763 − 84,000 = 2,02,763; (c) 3,36,000. Least = <b>₹2,02,763<\/b>.<\/div>\n<h3>5. Capital gains<\/h3>\n<p>Gain = sale price − purchase price − costs. Gains held long are usually taxed at a different (often lower) rate than short-term gains, and equity often has an annual exempt amount. Tax applies to the <b>gain<\/b>, not the sale value. Rates come from the stem.<\/p>\n<h3>6. Budgeting from first principles<\/h3>\n<p>A budget is a plan for every rupee that arrives. The aim is to make saving automatic and spending intentional.<\/p>\n<table>\n<tr><th>Method<\/th><th>How it works<\/th><\/tr>\n<tr><td>50/30/20<\/td><td>50% needs, 30% wants, 20% savings and debt repayment<\/td><\/tr>\n<tr><td>Pay yourself first<\/td><td>Move savings out on payday; spend what is left<\/td><\/tr>\n<tr><td>Zero-based<\/td><td>Assign every rupee a job; income − allocations = 0<\/td><\/tr>\n<tr><td>Category caps<\/td><td>Fixed limit per category (food, travel)<\/td><\/tr>\n<\/table>\n<ul>\n<li><b>Savings rate<\/b> = savings ÷ income. 20% or more is healthy.<\/li>\n<li><b>Fixed-obligation ratio<\/b> = EMIs and fixed bills ÷ net income; keep under about 40%.<\/li>\n<li><b>Emergency fund<\/b> = about 6 months of essential expenses (9 to 12 for irregular income). Keep it in liquid, safe instruments.<\/li>\n<li>Separate <b>needs<\/b> (rent, groceries, insurance, EMIs) from <b>wants<\/b> (dining out, subscriptions). Irregular costs (insurance premiums, festivals) go into a monthly <b>sinking fund<\/b>.<\/li>\n<\/ul>\n<div class=\"trap\"><b>Common traps.<\/b> Applying the top slab to the whole income. Forgetting cess, or applying it to income instead of tax. Subtracting deductions from the tax instead of from income. Counting a one-time bonus as monthly income in a budget.<\/div>\n"}, {"id": "pf-debt", "sec": "PF", "title": "Debt and credit", "r1": "Debt and credit", "min": 35, "html": "\n<p class=\"lead\">Debt lets you spend now and pay later, at a price. It is a useful tool when it buys something that earns or saves more than it costs (a home, an education) and a trap when it funds consumption at a high rate. The skill is finding the true cost.<\/p>\n<h3>1. How a loan works<\/h3>\n<p>You borrow a principal. Each month you pay an <b>EMI<\/b> (equated monthly instalment), a fixed amount that covers that month's interest and some principal. Interest each month = outstanding balance × monthly rate, so early EMIs are mostly interest and later ones mostly principal.<\/p>\n<div class=\"fx\">EMI = P &times; r &times; (1 + r)<sup>n<\/sup> &divide; [(1 + r)<sup>n<\/sup> &minus; 1]<br>(r = monthly rate, n = number of months) &nbsp; In a sheet: =-PMT(rate/12, years*12, loan)<\/div>\n<div class=\"eg\">₹10 lakh at 10% for 5 years: r = 0.8333%, n = 60. EMI = ₹21,247. Total paid = ₹12.75 lakh; interest = ₹2.75 lakh. First month: interest 8,333, principal 12,914.\nSame loan over 10 years: EMI ₹13,215, total interest ₹5.86 lakh. A longer tenure lowers the EMI but more than doubles the interest.<\/div>\n<h3>2. Reducing balance vs flat rate<\/h3>\n<p>A <b>flat rate<\/b> charges interest on the original loan for the whole term even though you keep repaying. 8% flat for 3 years looks cheap but costs about 14.5% a year on a reducing balance. Always convert to an effective rate before comparing.<\/p>\n<h3>3. Prepayment<\/h3>\n<p>Paying principal early saves interest on that money for the rest of the loan. Early prepayment saves far more than late. When you prepay, choose to <b>reduce the tenure<\/b> (saves more) or reduce the EMI (eases cash flow).<\/p>\n<h3>4. Credit cards<\/h3>\n<ul>\n<li>Pay the <b>full statement balance<\/b> by the due date and you pay no interest (the interest-free period can reach about 45 days).<\/li>\n<li>Carrying a balance costs about 36% to 42% a year; paying only the minimum keeps you in debt for years.<\/li>\n<li>Cash withdrawals attract interest from day one plus a fee.<\/li>\n<li>\"No-cost EMI\" usually has the cost hidden in a lost discount or fees.<\/li>\n<\/ul>\n<h3>5. Credit score<\/h3>\n<p>A score (300 to 900 in India; 750 and above is good) summarises your repayment record. It sets whether you are approved and the interest rate you are offered, which can mean lakhs saved on a home loan.<\/p>\n<table>\n<tr><th>Factor<\/th><th>What helps<\/th><\/tr>\n<tr><td>Payment history (largest)<\/td><td>Never miss a due date<\/td><\/tr>\n<tr><td>Credit utilisation<\/td><td>Use below about 30% of your limit<\/td><\/tr>\n<tr><td>Credit age<\/td><td>Keep old accounts open<\/td><\/tr>\n<tr><td>Mix<\/td><td>Both secured and unsecured, in moderation<\/td><\/tr>\n<tr><td>Enquiries<\/td><td>Avoid many applications in a short time<\/td><\/tr>\n<\/table>\n<h3>6. Repayment strategies<\/h3>\n<ul>\n<li><b>Avalanche<\/b>: pay the minimum on all, put every spare rupee on the highest-interest debt. Lowest total cost.<\/li>\n<li><b>Snowball<\/b>: clear the smallest balance first. Costs more but gives early wins.<\/li>\n<\/ul>\n<div class=\"eg\">Debts: card ₹2 lakh at 36%, personal loan ₹5 lakh at 14%, home loan ₹20 lakh at 9%. Every ₹20,000 paid off on the card saves ₹7,200 a year; on the home loan only ₹1,800. Clear the card first.<\/div>\n<h3>7. Home loans<\/h3>\n<ul>\n<li>Lenders cap the loan at a share of the property value and look for EMIs under about 40% to 50% of net income.<\/li>\n<li>Floating rates move with the benchmark; when rates rise, the usual effect is a longer tenure at the same EMI.<\/li>\n<li>Rent vs buy: compare the total cost of owning (EMI, maintenance, tax, opportunity cost of the down payment) with rent plus the returns on the money not tied up.<\/li>\n<\/ul>\n<div class=\"trap\"><b>Common traps.<\/b> Comparing EMIs instead of total cost. Using annual rate and years in the EMI formula. Treating the minimum due as a repayment plan. Taking a long tenure and thinking the loan is \"cheaper\".<\/div>\n"}, {"id": "pf-ins", "sec": "PF", "title": "Insurance and risk", "r1": "Insurance and risk", "min": 30, "html": "\n<p class=\"lead\">Insurance moves a risk you cannot afford to bear to a company that pools many people's risks, in exchange for a small, known premium. It is protection, not an investment.<\/p>\n<h3>1. How insurance works<\/h3>\n<p>Thousands of people each pay a small premium. Only a few suffer a loss, and the pool pays them. The insurer prices premiums so that total premiums cover expected claims plus costs. For you, a small certain cost replaces a small chance of a ruinous loss.<\/p>\n<h3>2. Words you must know<\/h3>\n<ul>\n<li><b>Premium<\/b>: what you pay. <b>Sum assured / sum insured<\/b>: the cover.<\/li>\n<li><b>Deductible<\/b>: you pay the first part of each claim. <b>Co-pay<\/b>: you pay a fixed share of each claim.<\/li>\n<li><b>Waiting period<\/b>: time before some illnesses are covered. <b>Pre-existing disease<\/b> must be disclosed.<\/li>\n<li><b>Moral hazard<\/b>: insured people take more risk. <b>Adverse selection<\/b>: those most likely to claim buy the most cover.<\/li>\n<li><b>Insurable interest<\/b>: you must lose financially if the event happens.<\/li>\n<li><b>Underinsurance<\/b>: if you insure only part of the value, partial claims can be cut in proportion (average clause).<\/li>\n<li><b>Claim settlement ratio<\/b>: share of claims paid. Check the amount too.<\/li>\n<\/ul>\n<h3>3. Products<\/h3>\n<table>\n<tr><th>Product<\/th><th>Pays when<\/th><th>Notes<\/th><\/tr>\n<tr><td>Term life<\/td><td>You die in the term<\/td><td>Pure cover, cheapest per rupee; buy early<\/td><\/tr>\n<tr><td>Health<\/td><td>Hospital costs<\/td><td>Check room-rent limits, co-pay, sub-limits, waiting periods; add a super top-up<\/td><\/tr>\n<tr><td>Critical illness / accident<\/td><td>Lump sum on listed event<\/td><td>Supplements health cover<\/td><\/tr>\n<tr><td>Motor<\/td><td>Damage or liability<\/td><td>Third-party cover is compulsory<\/td><\/tr>\n<tr><td>Home<\/td><td>Fire, theft, calamity<\/td><td>Insure rebuild cost, not land value<\/td><\/tr>\n<tr><td>Endowment, ULIP, money-back<\/td><td>Death or maturity<\/td><td>Mix insurance and investment; usually costly with low cover<\/td><\/tr>\n<\/table>\n<h3>4. How much life cover?<\/h3>\n<p>Rule of thumb: 10 to 15 times annual income. Needs-based: PV of dependants' expenses + loans + goals − existing assets and cover.<\/p>\n<div class=\"eg\">Family needs ₹6 lakh a year for 25 years; discount at a 6% real return. PV = 6,00,000 × [1 − 1.06<sup>−25<\/sup>] ÷ 0.06 = ₹76.7 lakh. Add loans ₹30 lakh, subtract assets ₹20 lakh and existing cover ₹10 lakh. Needed ≈ ₹76.7 lakh.<\/div>\n<h3>5. Managing risk<\/h3>\n<ol><li><b>Avoid<\/b> the risky activity.<\/li><li><b>Reduce<\/b> likelihood or size (seat belts, fitness).<\/li><li><b>Retain<\/b> small risks from your emergency fund.<\/li><li><b>Transfer<\/b> large, unlikely, severe risks through insurance.<\/li><\/ol>\n<h3>6. Insurance vs investment<\/h3>\n<p>A traditional plan with a ₹5 lakh premium may give ₹50 lakh cover and a low return. A term plan for ₹12,000 gives ₹1 crore of cover, and investing the ₹4.88 lakh difference in an index fund compounds far better. For pure protection, buy term and invest separately. Do not insure a child's life for income replacement when no one depends on the child's income.<\/p>\n<div class=\"trap\"><b>Common traps.<\/b> Confusing sum assured with the return you will get. Choosing a plan on premium alone. Ignoring medical inflation. Not disclosing pre-existing conditions (claims can be rejected).<\/div>\n"}, {"id": "pf-inv", "sec": "PF", "title": "Investments and investment behaviour", "r1": "Investments and investment behaviour", "min": 40, "html": "\n<p class=\"lead\">Investing is giving up money today for a larger amount later, accepting some risk. Good investing is mostly two skills: matching assets to your time horizon, and not letting your own psychology wreck the plan.<\/p>\n<h3>1. Return, risk, and time<\/h3>\n<ul>\n<li>Higher expected return comes with higher risk. There is no reliable free lunch.<\/li>\n<li><b>Risk<\/b> is the chance of a worse outcome and wider swings, measured by standard deviation. <b>Sharpe ratio<\/b> = (return − risk-free rate) ÷ standard deviation: return per unit of risk.<\/li>\n<li>Longer horizons let you take more risk: equity for 7+ years, debt for 1 to 3 years, savings or liquid funds under 1 year.<\/li>\n<li><b>Diversification<\/b> removes company-specific risk but not market-wide risk.<\/li>\n<\/ul>\n<h3>2. Asset classes<\/h3>\n<table>\n<tr><th>Asset<\/th><th>Return from<\/th><th>Risk<\/th><th>Liquidity<\/th><\/tr>\n<tr><td>Savings, liquid funds<\/td><td>Interest<\/td><td>Very low<\/td><td>High<\/td><\/tr>\n<tr><td>Fixed deposits, bonds<\/td><td>Interest<\/td><td>Low to medium<\/td><td>Medium<\/td><\/tr>\n<tr><td>Equity / equity funds<\/td><td>Earnings growth, dividends<\/td><td>High short term<\/td><td>High<\/td><\/tr>\n<tr><td>Gold<\/td><td>Price change<\/td><td>Medium<\/td><td>High<\/td><\/tr>\n<tr><td>Real estate<\/td><td>Rent + price<\/td><td>Medium<\/td><td>Low<\/td><\/tr>\n<tr><td>PPF, EPF, NPS<\/td><td>Government-linked, tax benefits<\/td><td>Low<\/td><td>Locked in<\/td><\/tr>\n<\/table>\n<h3>3. Bonds<\/h3>\n<p>A bond is a loan to a government or company: you receive fixed coupon payments and the face value at maturity. Bond <b>prices fall when interest rates rise<\/b> (new bonds pay more, so old ones are worth less), and longer bonds fall more. <b>Yield to maturity<\/b> is the return if held to the end. Credit rating shows default risk; lower rating means higher yield.<\/p>\n<h3>4. Mutual funds<\/h3>\n<ul>\n<li>A fund pools money. <b>NAV<\/b> = (assets − liabilities) ÷ units.<\/li>\n<li><b>Expense ratio<\/b> is deducted every year; direct plans cost less than regular plans. A 1% annual gap can cost about a fifth of the final corpus over 20 years.<\/li>\n<li><b>Index funds<\/b> copy an index at low cost; most active funds fail to beat the index after fees over long periods.<\/li>\n<li><b>SIP<\/b>: fixed amount at regular intervals. It averages your purchase price (rupee-cost averaging) and builds discipline. It does not guarantee profit.<\/li>\n<\/ul>\n<h3>5. Portfolio return and risk<\/h3>\n<p>Portfolio return = weighted average of asset returns. Example: 60% equity at 12% and 40% debt at 7% gives 0.6 × 12 + 0.4 × 7 = 10%. Risk is not a simple average: assets that do not move together lower the portfolio's risk (diversification). A loss of 20% needs a gain of 25% to recover (1 ÷ 0.8 − 1).<\/p>\n<h3>6. Asset allocation<\/h3>\n<p>Rule of thumb: equity share ≈ 100 − age, adjusted for <b>risk capacity<\/b> (stable income, few dependants) and <b>risk tolerance<\/b> (comfort with falls). <b>Rebalance<\/b> once a year to the target mix; it makes you sell what has risen and buy what has fallen.<\/p>\n<h3>7. Behavioural biases<\/h3>\n<table>\n<tr><th>Bias<\/th><th>What happens<\/th><th>Remedy<\/th><\/tr>\n<tr><td>Loss aversion<\/td><td>A loss hurts about twice as much as an equal gain pleases; leads to panic selling or holding losers<\/td><td>Predefined plan, long horizon<\/td><\/tr>\n<tr><td>Recency bias<\/td><td>Recent returns assumed to continue<\/td><td>Look at long-term history<\/td><\/tr>\n<tr><td>Herd behaviour / FOMO<\/td><td>Buying what everyone buys<\/td><td>Invest by plan, not by buzz<\/td><\/tr>\n<tr><td>Overconfidence<\/td><td>Trading too much, concentrating<\/td><td>Index core; track results honestly<\/td><\/tr>\n<tr><td>Anchoring<\/td><td>Fixating on purchase price<\/td><td>Judge on future prospects<\/td><\/tr>\n<tr><td>Disposition effect<\/td><td>Selling winners early, holding losers<\/td><td>Exit rules<\/td><\/tr>\n<tr><td>Mental accounting<\/td><td>Treating money differently by source<\/td><td>Look at total wealth<\/td><\/tr>\n<tr><td>Confirmation bias<\/td><td>Seeking views that agree with you<\/td><td>Seek the opposing case<\/td><\/tr>\n<tr><td>Sunk-cost fallacy<\/td><td>Holding because you have already lost<\/td><td>Ask: would I buy it today?<\/td><\/tr>\n<\/table>\n<div class=\"eg\">After a 20% fall an investor sells everything \"to stop losses\". The fund must now rise 25% to recover. By selling, the investor locks in the loss and misses the recovery: loss aversion plus panic.<\/div>\n<h3>8. Fraud red flags<\/h3>\n<p>Guaranteed high returns, pressure to act now, unregistered advisers, schemes that pay you for recruiting others, \"insider tips\", requests for OTPs. Check registration with SEBI before investing.<\/p>\n<div class=\"trap\"><b>Common traps.<\/b> Judging a fund by one year's return. Confusing high past return with high future return. Believing many funds with the same holdings is diversification. Ignoring tax, fees and inflation when comparing products.<\/div>\n"}, {"id": "pf-nw", "sec": "PF", "title": "Net worth and goals", "r1": "Net worth and goals", "min": 30, "html": "\n<p class=\"lead\">Net worth is your financial scoreboard; goals are where you want it to go. Planning is turning a goal with a date and a price into a monthly amount you can act on.<\/p>\n<h3>1. Net worth<\/h3>\n<div class=\"fx\">Net worth = Total assets &minus; Total liabilities<\/div>\n<ul>\n<li><b>Assets<\/b>: bank balances, investments (at current value), property, vehicles, gold, retirement accounts.<\/li>\n<li><b>Liabilities<\/b>: home, car and personal loans, card dues, money owed.<\/li>\n<li>Value assets at what they would sell for today, not what you paid.<\/li>\n<li>Net worth rises by saving and by asset growth; it falls by borrowing for spending and by asset falls.<\/li>\n<\/ul>\n<div class=\"eg\">Assets: investments ₹8 lakh, cash ₹2 lakh, flat ₹60 lakh, car ₹5 lakh = ₹75 lakh. Liabilities: home loan ₹35 lakh, car loan ₹2 lakh = ₹37 lakh. Net worth = <b>₹38 lakh<\/b>. Liquid assets (investments plus cash) = ₹10 lakh.<\/div>\n<h3>2. Financial health ratios<\/h3>\n<table>\n<tr><th>Ratio<\/th><th>Formula<\/th><th>Healthy<\/th><\/tr>\n<tr><td>Savings rate<\/td><td>Savings ÷ income<\/td><td>20% or more<\/td><\/tr>\n<tr><td>Emergency fund cover<\/td><td>Liquid savings ÷ monthly essential expenses<\/td><td>6 months<\/td><\/tr>\n<tr><td>Debt-service ratio<\/td><td>Monthly EMIs ÷ net income<\/td><td>Under 40%<\/td><\/tr>\n<tr><td>Solvency ratio<\/td><td>Net worth ÷ total assets<\/td><td>Higher is better<\/td><\/tr>\n<tr><td>Liquidity ratio<\/td><td>Liquid assets ÷ monthly expenses<\/td><td>3 to 6 months<\/td><\/tr>\n<\/table>\n<h3>3. Cash flow<\/h3>\n<p>Cash flow = income − expenses − EMIs. Positive surplus is what builds net worth. A negative surplus is financed by borrowing or selling assets and shrinks net worth. Plot the month to see where surplus leaks.<\/p>\n<h3>4. Goal-based planning: five steps<\/h3>\n<ol>\n<li><b>Define<\/b> the goal, its price in today's rupees and its date.<\/li>\n<li><b>Inflate<\/b> the cost to the goal date: future cost = today's cost × (1 + inflation)<sup>years<\/sup>.<\/li>\n<li><b>Choose assets<\/b> to fit the horizon (equity for 7+ years, debt for under 3).<\/li>\n<li><b>Compute the monthly investment<\/b>: =-PMT(return/12, months, 0, future_cost).<\/li>\n<li><b>Review yearly<\/b>, step up the SIP with income, and rebalance.<\/li>\n<\/ol>\n<div class=\"eg\"><b>Education fund.<\/b> ₹20 lakh today, 8% inflation, needed in 10 years: 20 × 1.08<sup>10<\/sup> = ₹43.2 lakh. At a 12% return (1% a month), the 120-month annuity factor is 230.04, so SIP ≈ 43.2 lakh ÷ 230.04 ≈ <b>₹18,800 a month<\/b>.<\/div>\n<div class=\"eg\"><b>Retirement.<\/b> Expenses ₹50,000 a month today, 6% inflation, retire in 25 years. First-year expenses = 6,00,000 × 1.06<sup>25<\/sup> = ₹25.8 lakh. With a safe withdrawal rate of about 4%, the corpus needed is about 25 times annual expenses, roughly ₹6.4 crore. Then work back to a monthly SIP over 25 years.<\/div>\n<h3>5. Prioritising goals<\/h3>\n<p>Order: (1) emergency fund and insurance, (2) clear high-interest debt, (3) retirement saving, (4) medium-term goals, (5) wants. Loans exist for education; none exist for retirement, so do not sacrifice retirement saving to over-fund a child's education.<\/p>\n<p>Use <b>sinking funds<\/b> for known future costs (annual premiums, fees, festivals) and a <b>step-up SIP<\/b> that rises each year with income.<\/p>\n<div class=\"trap\"><b>Common traps.<\/b> Forgetting to inflate the goal. Using a nominal return with a goal stated in today's rupees, or the reverse. Counting the house you live in as a liquid asset. Treating a loan as an asset.<\/div>\n"}];
</script>
<script>
(function(){
'use strict';
const SECNAME={BF:'Business Finance',PF:'Personal Finance',SM:'Spreadsheet Modelling'};
const SECORDER=['SM','BF','PF'];
const R1={
 SM:['Formulae and Foundations','Lookups and data joins','Financial Functions','Dynamic Arrays','Model Design'],
 BF:['Financial Statements','Ratios and performance','Unit economics and business models','Banks and financial institutions','Valuation'],
 PF:['Time value of money and compounding','Income, tax and budgeting','Debt and credit','Insurance and risk','Investments and investment behaviour','Net worth and goals']
};
const EMPH={SM:1,BF:1};
const Q=DATA.questions; const byId={}; Q.forEach(q=>byId[q.id]=q);
const articles=STUDY; const artByTopic={}; articles.forEach(a=>artByTopic[a.r1]=a);
const $=(s,r)=> (r||document).querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- storage ---------- */
let store={answers:{},read:{}};
function load(){try{const s=localStorage.getItem('finprep-v1');if(s)store=Object.assign(store,JSON.parse(s));}catch(e){}}
function save(){try{localStorage.setItem('finprep-v1',JSON.stringify(store));}catch(e){}}
function theme(){try{return localStorage.getItem('finprep-theme')}catch(e){return null}}
load();
const th=theme(); if(th) document.documentElement.setAttribute('data-theme',th);
$('#themebtn').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const nx=cur==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',nx);
  try{localStorage.setItem('finprep-theme',nx)}catch(e){}
});

/* ---------- formatting ---------- */
function fmtNum(v,f){
  if(typeof v==='string') return v;
  if(f==='pct') return (v*100).toLocaleString('en-IN',{maximumFractionDigits:3})+'%';
  if(f==='inr'||f==='inr2') return '₹'+v.toLocaleString('en-IN',{maximumFractionDigits:f==='inr2'?2:0,minimumFractionDigits:f==='inr2'?2:0});
  if(f==='x') return v.toLocaleString('en-IN',{maximumFractionDigits:3})+'×';
  return v.toLocaleString('en-IN',{maximumFractionDigits:4});
}
function parseAns(txt,fmt,target){
  let t=String(txt).trim().replace(/[₹,\s]/g,'').replace(/×|x$/i,'');
  if(t==='') return NaN;
  let pct=false; if(/%$/.test(t)){pct=true;t=t.slice(0,-1);}
  let v=Number(t); if(!isFinite(v)) return NaN;
  if(fmt==='pct'){ if(pct) v=v/100; else if(Math.abs(target)<=1.5 && Math.abs(v)>1.5) v=v/100; }
  return v;
}
function colName(i){let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}
function colIdx(s){let n=0;for(const ch of s)n=n*26+(ch.charCodeAt(0)-64);return n-1;}
function cellPos(ref){const m=/^([A-Z]+)(\d+)/.exec(ref);return m?{c:colIdx(m[1]),r:+m[2]-1}:null;}

/* ---------- sheet grid ---------- */
function buildGrid(q){
  const sh=q.sheet, cells={}; let maxR=0,maxC=0; const set=(r,c,v,cls)=>{cells[r+','+c]={v,cls};maxR=Math.max(maxR,r);maxC=Math.max(maxC,c);};
  if(sh.table){
    const o=cellPos(sh.table.origin||'A1')||{r:0,c:0};
    sh.table.headers.forEach((h,i)=>{ if(h!=='') set(o.r,o.c+i,h,'hdr'); });
    sh.table.rows.forEach((row,ri)=>row.forEach((v,ci)=>{ if(v!=='') set(o.r+1+ri,o.c+ci,v,'num'); }));
  }
  sh.rows.forEach(r=>{
    const p=cellPos(r.cells.split(':')[0]);
    if(!sh.table && p) set(p.r,0,r.label,'lab');
    if(r.values){ r.values.forEach((v,i)=>set(p.r,p.c+i,v,'num')); }
    else if(p) set(p.r,p.c,r.value,typeof r.value==='number'?'num':'');
  });
  const tp=cellPos(sh.answer_cell); if(tp) set(tp.r,tp.c,'?','tgt');
  return {cells,maxR,maxC};
}
function gridHTML(q){
  const g=buildGrid(q), fmtOf={};
  q.sheet.rows.forEach(r=>{const p=cellPos(r.cells.split(':')[0]); if(p){const n=r.values?r.values.length:1;for(let i=0;i<n;i++)fmtOf[p.r+','+(p.c+i)]=r.format;}});
  let h='<div class="grid"><table><thead><tr><th class="rn"></th>';
  for(let c=0;c<=g.maxC;c++) h+='<th>'+colName(c)+'</th>'; h+='</tr></thead><tbody>';
  for(let r=0;r<=g.maxR;r++){ h+='<tr><th class="rn">'+(r+1)+'</th>';
    for(let c=0;c<=g.maxC;c++){ const k=r+','+c, ce=g.cells[k];
      if(!ce){h+='<td></td>';continue;}
      let v=ce.v; if(typeof v==='number'&&fmtOf[k]) v=fmtNum(v,fmtOf[k]);
      h+='<td class="'+(ce.cls||'')+'">'+esc(v)+'</td>'; }
    h+='</tr>'; }
  return h+'</tbody></table></div>';
}
function gridTSV(q){
  const g=buildGrid(q); const out=[];
  for(let r=0;r<=g.maxR;r++){const row=[];for(let c=0;c<=g.maxC;c++){const ce=g.cells[r+','+c];row.push(ce&&ce.cls!=='tgt'?String(ce.v):'');}out.push(row.join('\t'));}
  return out.join('\n');
}

/* ---------- derived stats ---------- */
function stat(filter){
  let seen=0,ok=0,tot=0;
  Q.forEach(q=>{ if(!filter(q))return; tot++; const a=store.answers[q.id]; if(a){seen++; if(a.ok)ok++;} });
  return {seen,ok,tot};
}
function pctClass(p){return p<0.5?'lo':p<0.75?'mid':''}

/* ---------- router ---------- */
let view='study', studyId='overview';
function setTabs(){ ['study','drill','progress'].forEach(v=>$('#tab-'+v).setAttribute('aria-selected',String(v===view))); }
function go(v,id,noScroll){ view=v; if(id) studyId=id; setTabs();
  try{history.replaceState(null,'', '#'+(v==='study'?(studyId==='overview'?'study':studyId):v));}catch(e){}
  render(); if(!noScroll) window.scrollTo(0,0); }
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>go(b.dataset.view)));

function render(){ const m=$('#main'); m.innerHTML=''; if(view==='study') renderStudy(m); else if(view==='drill') renderDrill(m); else renderProgress(m); }

/* ---------- STUDY ---------- */
function railHTML(){
  let h='<button data-id="overview" '+(studyId==='overview'?'aria-current="true"':'')+'><span class="dot done" style="visibility:hidden"></span><span>Start here</span></button>';
  SECORDER.forEach(sec=>{
    h+='<h4>'+SECNAME[sec]+'</h4>';
    R1[sec].forEach(t=>{ const a=artByTopic[t]; if(!a) return;
      h+='<button data-id="'+a.id+'" '+(studyId===a.id?'aria-current="true"':'')+'><span class="dot '+(store.read[a.id]?'done':'')+'"></span><span>'+esc(t)+'</span></button>'; });
  });
  return h;
}
function renderStudy(m){
  const wrap=document.createElement('div'); wrap.className='study';
  const rail=document.createElement('nav'); rail.className='rail'; rail.setAttribute('aria-label','Topics'); rail.innerHTML=railHTML();
  const rd=document.createElement('article'); rd.className='reader';
  const sel=document.createElement('select'); sel.className='mobsel'; sel.setAttribute('aria-label','Choose topic'); sel.id='mobsel';
  let o='<option value="overview">Start here</option>'; SECORDER.forEach(sec=>{o+='<optgroup label="'+SECNAME[sec]+'">';R1[sec].forEach(t=>{const a=artByTopic[t];if(a)o+='<option value="'+a.id+'"'+(a.id===studyId?' selected':'')+'>'+esc(t)+'</option>';});o+='</optgroup>';});
  sel.innerHTML=o; sel.value=studyId;
  sel.addEventListener('change',()=>go('study',sel.value));
  const side=document.createElement('div'); side.append(sel);
  wrap.append(rail,rd); rd.before(); m.append(wrap);
  rd.append(sel);
  rail.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>go('study',b.dataset.id)));
  if(studyId==='overview') return overview(rd);
  const a=articles.find(x=>x.id===studyId)||articles[0];
  const n=Q.filter(q=>q.r1_topic===a.r1).length;
  const body=document.createElement('div'); body.innerHTML=
    '<div class="crumb">'+SECNAME[a.sec]+' · about '+a.min+' min</div><h1>'+esc(a.title)+'</h1>'+a.html;
  body.querySelectorAll('table').forEach(t=>{ if(t.parentElement.classList.contains('tw'))return; const w=document.createElement('div');w.className='tw';t.replaceWith(w);w.append(t);});
  rd.append(body);
  const idx=articles.findIndex(x=>x.id===a.id);
  const order=[]; SECORDER.forEach(s=>R1[s].forEach(t=>{if(artByTopic[t])order.push(artByTopic[t]);}));
  const pos=order.findIndex(x=>x.id===a.id), prev=order[pos-1], next=order[pos+1];
  const row=document.createElement('div'); row.className='btnrow';
  row.innerHTML='<button class="btn primary" id="prac">Practise this topic ('+n+' drills)</button>'+
    '<button class="btn '+(store.read[a.id]?'good':'')+'" id="markread">'+(store.read[a.id]?'Marked as read':'Mark as read')+'</button>'+
    (prev?'<button class="btn" id="pv">&larr; '+esc(prev.r1)+'</button>':'')+(next?'<button class="btn" id="nx">'+esc(next.r1)+' &rarr;</button>':'');
  rd.append(row);
  $('#prac').addEventListener('click',()=>{ drillCfg={sec:a.sec,topic:a.r1,type:'all',diff:'all',count:10,fresh:false}; go('drill'); });
  $('#markread').addEventListener('click',()=>{store.read[a.id]=!store.read[a.id];save();render();});
  if(prev)$('#pv').addEventListener('click',()=>go('study',prev.id)); if(next)$('#nx').addEventListener('click',()=>go('study',next.id));
}
function overview(rd){
  const done=Object.keys(store.read).filter(k=>store.read[k]).length;
  const c=document.createElement('div');
  c.innerHTML='<div class="crumb">Round 1 preparation</div><h1>Finathon Prep</h1>'+
   '<p class="lead">Sixteen study topics explained from first principles, and '+Q.length+' drill questions to test them. Spreadsheet Modelling and Business Finance carry the longest explanations, so start there. Every drill shows the reasoning after you answer.</p>'+
   '<div class="parts" id="parts"></div>'+
   '<div class="plan"><h3>How to use this</h3><ol>'+
   '<li>Read one topic (25 to 45 minutes). Keep a Google Sheet open and try the examples as you read.</li>'+
   '<li>Press <b>Practise this topic</b> and do 10 drills. Read every explanation, including the ones you got right.</li>'+
   '<li>Come back to topics where Progress shows under 75%.</li>'+
   '<li>Finish with a mixed round: pick all sections in Drill and set 45 questions.</li></ol>'+
   '<p class="note">You have read '+done+' of '+articles.length+' topics. Progress is saved in this browser only.</p></div>';
  rd.append(c); const P=c.querySelector('#parts');
  SECORDER.forEach(sec=>{ const d=document.createElement('div'); d.className='part';
    const secN=Q.filter(q=>q.section_code===sec).length;
    let h='<h2>'+SECNAME[sec]+'</h2><p>'+secN+' drills · '+(EMPH[sec]?'deepest explanations':'core concepts')+'</p>';
    R1[sec].forEach(t=>{const a=artByTopic[t]; if(!a)return; const n=Q.filter(q=>q.r1_topic===t).length;
      h+='<button data-id="'+a.id+'"><span>'+(store.read[a.id]?'✓ ':'')+esc(t)+'</span><span class="n">'+n+' drills</span></button>';});
    d.innerHTML=h; P.append(d); d.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>go('study',b.dataset.id)));});
}

/* ---------- DRILL ---------- */
let drillCfg={sec:'all',topic:'all',type:'all',diff:'all',count:10,fresh:false};
let sess=null, timer=null;
function pool(cfg){
  return Q.filter(q=>(cfg.sec==='all'||q.section_code===cfg.sec)&&(cfg.topic==='all'||q.r1_topic===cfg.topic)&&
    (cfg.type==='all'||q.type===cfg.type)&&(cfg.diff==='all'||String(q.difficulty)===cfg.diff)&&
    (!cfg.fresh||!(store.answers[q.id]&&store.answers[q.id].ok)));
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function renderDrill(m){
  if(sess&&!sess.done) return renderQuestion(m);
  if(sess&&sess.done) return renderSummary(m);
  const d=document.createElement('div'); d.className='desk';
  const topics=drillCfg.sec==='all'?[]:R1[drillCfg.sec];
  const chips=(key,opts)=>opts.map(([v,l])=>'<button class="chip" data-k="'+key+'" data-v="'+v+'" aria-pressed="'+(String(drillCfg[key])===String(v))+'">'+l+'</button>').join('');
  d.innerHTML='<h1>Drill</h1><p class="note">Pick what to practise. Answers are checked against the same tolerance the answer key uses, so 10.83% and 0.1083 both count for a percentage.</p>'+
   '<div class="panel">'+
   '<div class="row"><label class="cap">Section</label>'+chips('sec',[['all','All'],['SM','Spreadsheet Modelling'],['BF','Business Finance'],['PF','Personal Finance']])+'</div>'+
   '<div class="row"><label class="cap" for="topicsel">Topic</label><select id="topicsel" '+(drillCfg.sec==='all'?'disabled':'')+'><option value="all">All topics'+(drillCfg.sec==='all'?' (choose a section first)':'')+'</option>'+topics.map(t=>'<option value="'+esc(t)+'"'+(drillCfg.topic===t?' selected':'')+'>'+esc(t)+'</option>').join('')+'</select></div>'+
   '<div class="row"><label class="cap">Question type</label>'+chips('type',[['all','Any'],['mcq','Multiple choice'],['numeric','Numeric'],['sheet','Spreadsheet task']])+'</div>'+
   '<div class="row"><label class="cap">Difficulty</label>'+chips('diff',[['all','Any'],['1','Easy'],['2','Medium'],['3','Hard']])+'</div>'+
   '<div class="row"><label class="cap">Number of questions</label>'+chips('count',[[5,'5'],[10,'10'],[20,'20'],[45,'45 (mock size)'],[9999,'All']])+'</div>'+
   '<div class="row"><label class="cap">Skip what you already got right</label><button class="chip" data-k="fresh" data-v="'+(!drillCfg.fresh)+'" aria-pressed="'+drillCfg.fresh+'">'+(drillCfg.fresh?'On':'Off')+'</button></div>'+
   '<div class="row" style="margin-top:18px"><button class="btn primary" id="start">Start</button><span class="hint" id="avail"></span></div></div>';
  m.append(d);
  const upd=()=>{const n=pool(drillCfg).length; $('#avail').textContent=n+' question'+(n===1?'':'s')+' match'; $('#start').disabled=n===0;};
  d.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.k; let v=b.dataset.v; if(k==='count')v=+v; if(k==='fresh')v=(v==='true');
    drillCfg[k]=v; if(k==='sec')drillCfg.topic='all'; render();}));
  const ts=$('#topicsel'); ts.addEventListener('change',()=>{drillCfg.topic=ts.value;upd();});
  upd();
  $('#start').addEventListener('click',()=>{
    const p=shuffle(pool(drillCfg)).slice(0,Math.min(drillCfg.count,9999));
    sess={qs:p,i:0,res:[],t0:Date.now(),checked:false,sel:null,done:false}; startTimer(); render(); });
}
function startTimer(){ clearInterval(timer); timer=setInterval(()=>{const e=$('#clock'); if(e&&sess&&!sess.done){const s=Math.floor((Date.now()-sess.t0)/1000);e.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}},1000); }
function renderQuestion(m){
  const q=sess.qs[sess.i], d=document.createElement('div'); d.className='desk';
  const diffName=['','Easy','Medium','Hard'][q.difficulty];
  const typeName={mcq:'Multiple choice',numeric:'Numeric',sheet:'Spreadsheet task'}[q.type];
  let h='<div class="sess-head"><span>Question '+(sess.i+1)+' of '+sess.qs.length+'</span><div class="bar"><i style="width:'+(sess.i/sess.qs.length*100)+'%"></i></div><span id="clock">00:00</span><button class="btn" id="quit" style="padding:4px 12px">End session</button></div>';
  h+='<div class="qcard"><div class="qmeta"><span>'+SECNAME[q.section_code]+'</span><span>'+esc(q.r1_topic)+'</span><span>'+typeName+'</span><span>'+diffName+'</span></div>';
  h+='<div class="stem">'+esc(q.stem)+'</div>';
  if(q.type==='mcq'){
    h+='<div class="opts" role="radiogroup">'+q.options.map(o=>'<button class="opt" role="radio" aria-checked="false" data-l="'+o.label+'"><b>'+o.label+'</b><span>'+esc(o.text)+'</span></button>').join('')+'</div>';
  } else {
    if(q.type==='sheet'){
      h+=gridHTML(q);
      h+='<div class="task">Fill cell <b>'+esc(q.sheet.answer_cell)+'</b> ('+esc(q.sheet.answer_label)+') with a formula. Type the number or text your formula returns.</div>';
      h+='<div class="row"><button class="btn" id="copytsv">Copy table for Google Sheets</button><span class="hint" id="copied"></span></div>';
    }
    const pf=q.answer.format==='pct'?'e.g. 10.5% or 0.105':(q.answer.format==='text'?'type the text':'e.g. 12,500');
    h+='<div class="ans"><input type="text" id="ansin" inputmode="'+(q.answer.format==='text'?'text':'decimal')+'" autocomplete="off" placeholder="Your answer" aria-label="Your answer"><button class="btn primary" id="check">Check</button><span class="hint">'+pf+'</span></div>';
  }
  if(q.type==='mcq') h+='<div class="ans"><button class="btn primary" id="check" disabled>Check</button></div>';
  h+='<div id="fb"></div></div>';
  d.innerHTML=h; m.append(d);
  sess.checked=false; sess.sel=null;
  $('#quit').addEventListener('click',()=>{endSession();});
  if(q.type==='mcq'){
    d.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{ if(sess.checked)return; sess.sel=b.dataset.l;
      d.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-checked',String(x===b))); $('#check').disabled=false; }));
  } else {
    const inp=$('#ansin'); inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault(); if(!sess.checked)doCheck(q); else nextQ();}}); inp.focus({preventScroll:true});
    const cp=$('#copytsv'); if(cp)cp.addEventListener('click',()=>{ const t=gridTSV(q);
      const done=ok=>{$('#copied').textContent=ok?'Copied. Click cell A1 in a new sheet and paste.':'Copy is blocked here. Select the table and copy it by hand.';};
      try{navigator.clipboard.writeText(t).then(()=>done(true),()=>done(false));}catch(e){done(false);} });
  }
  $('#check').addEventListener('click',()=>{ if(!sess.checked)doCheck(q); else nextQ(); });
}
function doCheck(q){
  let ok=false, given='', right='';
  if(q.type==='mcq'){
    if(!sess.sel) return; given=sess.sel; ok=(given===q.correct_option);
    right=q.correct_option+'. '+q.options.find(o=>o.label===q.correct_option).text;
    document.querySelectorAll('.opt').forEach(b=>{ if(b.dataset.l===q.correct_option)b.classList.add('right'); else if(b.dataset.l===sess.sel)b.classList.add('wrong'); });
  } else {
    const raw=$('#ansin').value; if(!raw.trim()) return; given=raw;
    const a=q.answer;
    if(a.format==='text'){ ok=raw.trim().toLowerCase().replace(/\s+/g,'')===String(a.value).toLowerCase().replace(/\s+/g,''); right=String(a.value); }
    else { const v=parseAns(raw,a.format,a.value); ok=isFinite(v)&&Math.abs(v-a.value)<=a.tolerance_abs+1e-9; right=fmtNum(a.value,a.format); }
    $('#ansin').disabled=true;
  }
  sess.checked=true; sess.res.push({id:q.id,ok,given});
  const prev=store.answers[q.id]||{n:0}; store.answers[q.id]={ok:ok,n:(prev.n||0)+1,t:Date.now()}; save();
  let fb='<div class="fb '+(ok?'ok':'no')+'"><h4>'+(ok?'Correct':'Not quite')+'</h4>';
  if(!ok) fb+='<p>Correct answer: <b>'+esc(right)+'</b>'+(q.type!=='mcq'?' (you typed '+esc(given)+')':'')+'</p>';
  fb+='<p>'+esc(q.explanation)+'</p>';
  if(q.type==='sheet') fb+='<p>Formula for '+esc(q.sheet.answer_cell)+':</p><div class="fx">'+esc(q.sheet.solution_formula)+'</div>';
  fb+='<div class="row"><button class="btn primary" id="nextq">'+(sess.i+1>=sess.qs.length?'See results':'Next question')+'</button>';
  const art=artByTopic[q.r1_topic]; if(art) fb+='<button class="btn" id="why">Read about this topic</button>';
  fb+='</div></div>';
  $('#fb').innerHTML=fb; $('#check').textContent=sess.i+1>=sess.qs.length?'See results':'Next question'; $('#check').disabled=false;
  $('#nextq').addEventListener('click',nextQ); $('#nextq').focus({preventScroll:true});
  const w=$('#why'); if(w)w.addEventListener('click',()=>{ endSession(true); go('study',art.id); });
}
function nextQ(){ sess.i++; if(sess.i>=sess.qs.length){ sess.done=true; sess.t1=Date.now(); clearInterval(timer);} render(); window.scrollTo(0,0); }
function endSession(silent){ if(sess){ sess.done=true; sess.t1=Date.now(); clearInterval(timer);} if(silent){sess=null;return;} render(); }
function renderSummary(m){
  const d=document.createElement('div'); d.className='desk';
  const n=sess.res.length, ok=sess.res.filter(r=>r.ok).length, secs=Math.round((sess.t1-sess.t0)/1000);
  const miss=sess.res.filter(r=>!r.ok);
  let h='<h1>Session complete</h1><div class="panel"><div class="sum">'+ok+' / '+n+'</div><p class="note">'+(n?Math.round(ok/n*100):0)+'% correct in '+Math.floor(secs/60)+' min '+secs%60+' s'+(n<sess.qs.length?' (ended early)':'')+'.</p>';
  if(miss.length){ h+='<h3 style="margin:18px 0 0;font:700 17px var(--f-display)">Review what you missed</h3><div class="misslist">'+miss.map(r=>{const q=byId[r.id];
     const ans=q.type==='mcq'?q.options.find(o=>o.label===q.correct_option).text:fmtNum(q.answer.value,q.answer.format);
     return '<div class="miss"><b>'+esc(q.r1_topic)+'</b><br>'+esc(q.stem)+'<br><span class="hint">Answer: '+esc(ans)+'. '+esc(q.explanation)+'</span></div>';}).join('')+'</div>'; }
  h+='<div class="row" style="margin-top:20px">'+(miss.length?'<button class="btn primary" id="retry">Retry the '+miss.length+' missed</button>':'')+'<button class="btn" id="again">New session</button></div></div>';
  d.innerHTML=h; m.append(d);
  const rt=$('#retry'); if(rt)rt.addEventListener('click',()=>{ sess={qs:miss.map(r=>byId[r.id]),i:0,res:[],t0:Date.now(),checked:false,sel:null,done:false}; startTimer(); render(); });
  $('#again').addEventListener('click',()=>{sess=null;render();});
}

/* ---------- PROGRESS ---------- */
function renderProgress(m){
  const d=document.createElement('div'); d.className='prog';
  const all=stat(()=>true);
  let h='<h1>Progress</h1><p class="note">Accuracy counts the latest attempt on each question. Stored in this browser only.</p>';
  h+='<div class="panel"><div class="sum">'+all.ok+' <span style="font-size:22px;color:var(--muted)">of '+all.seen+' attempted correct · '+all.tot+' in bank</span></div></div>';
  SECORDER.forEach(sec=>{
    const s=stat(q=>q.section_code===sec);
    h+='<div class="sechead">'+SECNAME[sec]+'</div><div class="ptable"><div class="prow h"><span>Topic</span><span class="pnum">Done</span><span class="mt">Accuracy</span><span class="pnum">Right</span></div>';
    R1[sec].forEach(t=>{ const st=stat(q=>q.r1_topic===t); const acc=st.seen?st.ok/st.seen:0; const a=artByTopic[t];
      h+='<div class="prow"><span class="nm"><span>'+esc(t)+'</span><small>'+(a&&store.read[a.id]?'Read':'Not read yet')+'</small></span><span class="pnum">'+st.seen+'/'+st.tot+'</span><span class="meter"><i class="'+pctClass(acc)+'" style="width:'+Math.round(acc*100)+'%"></i></span><span class="pnum">'+(st.seen?Math.round(acc*100)+'%':'-')+'</span></div>'; });
    h+='</div>';
  });
  h+='<div class="row" style="margin-top:28px"><button class="btn" id="reset">Reset all progress</button><span class="hint" id="rsmsg"></span></div>';
  d.innerHTML=h; m.append(d);
  let armed=false; $('#reset').addEventListener('click',()=>{ if(!armed){armed=true;$('#reset').textContent='Click again to erase everything';return;} store={answers:{},read:{}};save();render(); });
}

/* ---------- boot ---------- */
(function(){ const h=(location.hash||'').slice(1);
  if(h==='drill'||h==='progress') view=h; else if(h&&articles.some(a=>a.id===h)){view='study';studyId=h;} })();
setTabs(); render();
})();
</script>
