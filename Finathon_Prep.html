opic": "Dynamic Arrays", "type": "mcq", "difficulty": 1, "stem": "A single formula in D2 returns 8 values that fill D2:D9 automatically. This behaviour is called:", "explanation": "A dynamic-array formula spills its result into neighbouring empty cells.", "options": [{"label": "A", "text": "Pivoting"}, {"label": "B", "text": "Wrapping"}, {"label": "C", "text": "Spilling"}, {"label": "D", "text": "Looping"}], "correct_option": "C"}, {"id": "SM-0282", "section_code": "SM", "r1_topic": "Dynamic Arrays", "type": "mcq", "difficulty": 2, "stem": "=FILTER(A2:C100,C2:C100>50000) returns:", "explanation": "FILTER returns the whole rows (all columns of the first argument) that pass the test.", "options": [{"label": "A", "text": "The count of rows above 50,000"}, {"label": "B", "text": "All rows of A2:C100 where the value in column C is above 50,000"}, {"label": "C", "text": "The first match only"}, {"label": "D", "text": "Only the values in column C above 50,000"}], "correct_option": "B"}, {"id": "SM-0283", "section_code": "SM", "r1_topic": "Dynamic Arrays", "type": "mcq", "difficulty": 2, "stem": "You enter a spilling formula but get #SPILL!. The most likely fix is to:", "explanation": "#SPILL! means something already sits where the result needs to go.", "options": [{"label": "A", "text": "Change the number format"}, {"label": "B", "text": "Add more rows to the data"}, {"label": "C", "text": "Clear the cells in the spill range that block the result"}, {"label": "D", "text": "Wrap the formula in IFERROR"}], "correct_option": "C"}, {"id": "SM-0284", "section_code": "SM", "r1_topic": "Dynamic Arrays", "type": "mcq", "difficulty": 2, "stem": "Which formula counts the distinct customers in B2:B100?", "explanation": "UNIQUE removes duplicates; COUNTA counts the remaining items.", "options": [{"label": "A", "text": "=UNIQUE(COUNT(B2:B100))"}, {"label": "B", "text": "=COUNTA(UNIQUE(B2:B100))"}, {"label": "C", "text": "=SORT(B2:B100)"}, {"label": "D", "text": "=COUNT(B2:B100)"}], "correct_option": "B"}, {"id": "SM-0285", "section_code": "SM", "r1_topic": "Dynamic Arrays", "type": "mcq", "difficulty": 2, "stem": "=SORT(A2:B20,2,FALSE) does what?", "explanation": "The second argument is the column index within the range; FALSE means descending.", "options": [{"label": "A", "text": "Returns the 2nd row"}, {"label": "B", "text": "Sorts the table by its 2nd column, largest first"}, {"label": "C", "text": "Sorts by the 1st column, smallest first"}, {"label": "D", "text": "Sorts only column B"}], "correct_option": "B"}, {"id": "SM-0286", "section_code": "SM", "r1_topic": "Dynamic Arrays", "type": "mcq", "difficulty": 2, "stem": "=SEQUENCE(12) returns:", "explanation": "SEQUENCE(rows, cols, start, step) with defaults produces 1,2,3,...", "options": [{"label": "A", "text": "Twelve random numbers"}, {"label": "B", "text": "The number 12"}, {"label": "C", "text": "The numbers 1 to 12 in a column"}, {"label": "D", "text": "The months of the year"}], "correct_option": "C"}, {"id": "SM-0287", "section_code": "SM", "r1_topic": "Dynamic Arrays", "type": "mcq", "difficulty": 3, "stem": "In Google Sheets, =B2:B*C2:C in one cell only returns one value. What makes it apply row by row down the range?", "explanation": "ARRAYFORMULA tells Sheets to evaluate the formula over the whole range.", "options": [{"label": "A", "text": "Pressing F4"}, {"label": "B", "text": "Wrapping it in ARRAYFORMULA"}, {"label": "C", "text": "Using SUMIF"}, {"label": "D", "text": "Adding a $ sign"}], "correct_option": "B"}, {"id": "SM-0288", "section_code": "SM", "r1_topic": "Dynamic Arrays", "type": "mcq", "difficulty": 3, "stem": "=FILTER(A2:A50,C2:C50>100) finds no matches. What does it return unless you handle it?", "explanation": "Give FILTER a third argument, for example =FILTER(A2:A50,C2:C50>100,\"none\"), to avoid the error.", "options": [{"label": "A", "text": "An empty string"}, {"label": "B", "text": "0"}, {"label": "C", "text": "#N/A"}, {"label": "D", "text": "The last row"}], "correct_option": "C"}, {"id": "SM-0289", "section_code": "SM", "r1_topic": "Dynamic Arrays", "type": "mcq", "difficulty": 3, "stem": "Which formula sums revenue in C2:C100 only for rows where B2:B100 is North, using FILTER?", "explanation": "FILTER first narrows the revenue values; SUM then adds them.", "options": [{"label": "A", "text": "=SUMIF(C2:C100,\"North\")"}, {"label": "B", "text": "=SUM(FILTER(C2:C100,B2:B100=\"North\"))"}, {"label": "C", "text": "=FILTER(SUM(C2:C100),B2:B100=\"North\")"}, {"label": "D", "text": "=SUM(C2:C100,\"North\")"}], "correct_option": "B"}, {"id": "SM-0290", "section_code": "SM", "r1_topic": "Dynamic Arrays", "type": "mcq", "difficulty": 3, "stem": "=TRANSPOSE(A1:A5) with five numbers in a column returns:", "explanation": "TRANSPOSE swaps rows and columns.", "options": [{"label": "A", "text": "Five numbers sorted"}, {"label": "B", "text": "A single cell"}, {"label": "C", "text": "The sum of the five numbers"}, {"label": "D", "text": "Five numbers in a row"}], "correct_option": "D"}, {"id": "SM-0291", "section_code": "SM", "r1_topic": "Model Design", "type": "mcq", "difficulty": 1, "stem": "In a well-built model, a tax rate of 25% should be:", "explanation": "One input, many references: change it once and every formula updates.", "options": [{"label": "A", "text": "Rounded to a whole number"}, {"label": "B", "text": "Typed inside every formula that needs it"}, {"label": "C", "text": "Entered once in a labelled input cell and referenced"}, {"label": "D", "text": "Hidden in a comment"}], "correct_option": "C"}, {"id": "SM-0292", "section_code": "SM", "r1_topic": "Model Design", "type": "mcq", "difficulty": 1, "stem": "A number typed directly inside a formula (for example =B5*0.25) is called a:", "explanation": "Hard-codes are hard to find and easy to forget when assumptions change.", "options": [{"label": "A", "text": "Named range"}, {"label": "B", "text": "Circular reference"}, {"label": "C", "text": "Hard-code"}, {"label": "D", "text": "Array constant"}], "correct_option": "C"}, {"id": "SM-0293", "section_code": "SM", "r1_topic": "Model Design", "type": "mcq", "difficulty": 2, "stem": "Which layout best separates concerns in a model?", "explanation": "Separating them makes the model auditable and safe to change.", "options": [{"label": "A", "text": "Everything on one sheet in any order"}, {"label": "B", "text": "Outputs typed in by hand"}, {"label": "C", "text": "Inputs, calculations and outputs in distinct areas"}, {"label": "D", "text": "Inputs scattered next to the formulas using them"}], "correct_option": "C"}, {"id": "SM-0294", "section_code": "SM", "r1_topic": "Model Design", "type": "mcq", "difficulty": 2, "stem": "A balance-sheet model should include a check cell that tests:", "explanation": "If the sheet does not balance, an error exists somewhere in the model.", "options": [{"label": "A", "text": "Assets − (liabilities + equity) = 0"}, {"label": "B", "text": "Cash is greater than debt"}, {"label": "C", "text": "Revenue is positive"}, {"label": "D", "text": "Net profit equals tax"}], "correct_option": "A"}, {"id": "SM-0295", "section_code": "SM", "r1_topic": "Model Design", "type": "mcq", "difficulty": 2, "stem": "What is the purpose of a scenario selector (a cell with 1, 2 or 3 feeding CHOOSE or INDEX)?", "explanation": "One switch changes a set of inputs, so outputs can be compared across scenarios.", "options": [{"label": "A", "text": "Convert currency"}, {"label": "B", "text": "Switch the whole model between base, upside and downside inputs"}, {"label": "C", "text": "Protect the sheet from editing"}, {"label": "D", "text": "Hide rows from view"}], "correct_option": "B"}, {"id": "SM-0296", "section_code": "SM", "r1_topic": "Model Design", "type": "mcq", "difficulty": 2, "stem": "Why use IFERROR around every formula by default?", "explanation": "Use IFERROR only where an error is expected and its replacement is meaningful.", "options": [{"label": "A", "text": "It rounds numbers"}, {"label": "B", "text": "It makes the model faster"}, {"label": "C", "text": "It is required by Sheets"}, {"label": "D", "text": "You should not; it can hide real data errors"}], "correct_option": "D"}, {"id": "SM-0297", "section_code": "SM", "r1_topic": "Model Design", "type": "mcq", "difficulty": 3, "stem": "Row 5 has the formula =C5*(1+$B$2) in D5:H5 except F5 where someone typed 1,200. This is a problem because:", "explanation": "Consistent formulas across a row make a model trustworthy. Overrides belong in a visible input or scenario.", "options": [{"label": "A", "text": "Formulas should never use $"}, {"label": "B", "text": "F5 will show an error"}, {"label": "C", "text": "The row has an inconsistent formula and breaks when inputs change"}, {"label": "D", "text": "Typed numbers are always more accurate"}], "correct_option": "C"}, {"id": "SM-0298", "section_code": "SM", "r1_topic": "Model Design", "type": "mcq", "difficulty": 2, "stem": "Which time layout is standard in financial models?", "explanation": "Consistent timelines let one formula be copied across.", "options": [{"label": "A", "text": "Periods are in a random order"}, {"label": "B", "text": "Each year has its own sheet"}, {"label": "C", "text": "Time runs left to right, one period per column, same meaning on every sheet"}, {"label": "D", "text": "Time runs down the rows on one sheet and across on others"}], "correct_option": "C"}, {"id": "SM-0299", "section_code": "SM", "r1_topic": "Model Design", "type": "mcq", "difficulty": 3, "stem": "A one-way sensitivity test changes one input to see its effect on an output. A two-way test:", "explanation": "A two-way table shows how the output moves across a grid of two inputs.", "options": [{"label": "A", "text": "Runs the model twice"}, {"label": "B", "text": "Changes two inputs together, for example discount rate and growth, against one output"}, {"label": "C", "text": "Doubles the inputs"}, {"label": "D", "text": "Uses two sheets"}], "correct_option": "B"}, {"id": "SM-0300", "section_code": "SM", "r1_topic": "Model Design", "type": "mcq", "difficulty": 2, "stem": "A named range such as TaxRate is useful because it:", "explanation": "=Revenue*TaxRate explains itself; =B14*$C$3 does not.", "options": [{"label": "A", "text": "Locks the cell from edits"}, {"label": "B", "text": "Makes formulas readable and reduces wrong references"}, {"label": "C", "text": "Converts numbers to text"}, {"label": "D", "text": "Speeds up calculation"}], "correct_option": "B"}, {"id": "BF-0251", "section_code": "BF", "r1_topic": "Banks and financial institutions", "type": "mcq", "difficulty": 1, "stem": "For a bank, customer deposits are:", "explanation": "The bank owes the money back to depositors. Loans given are the bank's assets.", "options": [{"label": "A", "text": "A liability"}, {"label": "B", "text": "An asset"}, {"label": "C", "text": "Equity"}, {"label": "D", "text": "Revenue"}], "correct_option": "A"}, {"id": "BF-0252", "section_code": "BF", "r1_topic": "Banks and financial institutions", "type": "mcq", "difficulty": 1, "stem": "A loan becomes a Gross NPA when interest or principal is overdue for more than:", "explanation": "The standard Indian norm is 90 days of default.", "options": [{"label": "A", "text": "60 days"}, {"label": "B", "text": "180 days"}, {"label": "C", "text": "90 days"}, {"label": "D", "text": "30 days"}], "correct_option": "C"}, {"id": "BF-0253", "section_code": "BF", "r1_topic": "Banks and financial institutions", "type": "numeric", "difficulty": 1, "stem": "A bank earned ₹900 crore interest on loans and paid ₹520 crore interest on deposits and borrowings. What is its net interest income (₹ crore)?", "explanation": "NII = 900 − 520 = 380.", "answer": {"value": 380, "format": "num", "tolerance_abs": 0.2}}, {"id": "BF-0254", "section_code": "BF", "r1_topic": "Banks and financial institutions", "type": "numeric", "difficulty": 2, "stem": "Net interest income is ₹380 crore on average earning assets of ₹10,000 crore. What is the net interest margin (%)?", "explanation": "NIM = 380 / 10,000 = 3.8%.", "answer": {"value": 0.038, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "BF-0255", "section_code": "BF", "r1_topic": "Banks and financial institutions", "type": "numeric", "difficulty": 2, "stem": "A bank has NII ₹380 crore and other income ₹120 crore. Operating costs are ₹250 crore. What is the cost-to-income ratio (%)?", "explanation": "Cost-to-income = 250 / (380 + 120) = 50%.", "answer": {"value": 0.5, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "BF-0256", "section_code": "BF", "r1_topic": "Banks and financial institutions", "type": "numeric", "difficulty": 1, "stem": "Savings and current deposits are ₹40,000 crore out of total deposits of ₹100,000 crore. What is the CASA ratio (%)?", "explanation": "CASA = 40,000 / 100,000 = 40%.", "answer": {"value": 0.4, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "BF-0257", "section_code": "BF", "r1_topic": "Banks and financial institutions", "type": "numeric", "difficulty": 2, "stem": "Gross loans are ₹50,000 crore and gross NPAs are ₹1,500 crore. What is the gross NPA ratio (%)?", "explanation": "1,500 / 50,000 = 3%.", "answer": {"value": 0.03, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "BF-0258", "section_code": "BF", "r1_topic": "Banks and financial institutions", "type": "numeric", "difficulty": 2, "stem": "Gross NPAs are ₹1,500 crore and the bank holds provisions of ₹1,050 crore against them. What is the provision coverage ratio (%)?", "explanation": "1,050 / 1,500 = 70%.", "answer": {"value": 0.7, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "BF-0259", "section_code": "BF", "r1_topic": "Banks and financial institutions", "type": "numeric", "difficulty": 2, "stem": "A bank has deposits of ₹80,000 crore and loans of ₹60,000 crore. What is its credit-deposit ratio (%)?", "explanation": "60,000 / 80,000 = 75%.", "answer": {"value": 0.75, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "BF-0260", "section_code": "BF", "r1_topic": "Banks and financial institutions", "type": "numeric", "difficulty": 2, "stem": "A bank has deposits of ₹2,00,000 crore. The CRR is 4%. How much must it keep as cash with the RBI (₹ crore)?", "explanation": "200,000 × 4% = 8,000 crore. This money earns no interest.", "answer": {"value": 8000, "format": "num", "tolerance_abs": 1}}, {"id": "BF-0261", "section_code": "BF", "r1_topic": "Banks and financial institutions", "type": "numeric", "difficulty": 2, "stem": "A bank has deposits of ₹2,00,000 crore, CRR 4% and SLR 18%. How much is left to lend or invest elsewhere (₹ crore)? Ignore other requirements.", "explanation": "Remaining share = 100 − 4 − 18 = 78%. 200,000 × 78% = 156,000 crore.", "answer": {"value": 156000, "format": "num", "tolerance_abs": 1}}, {"id": "BF-0262", "section_code": "BF", "r1_topic": "Banks and financial institutions", "type": "numeric", "difficulty": 3, "stem": "A bank has risk-weighted assets of ₹1,20,000 crore and total capital of ₹15,600 crore. What is its capital adequacy ratio (%)?", "explanation": "15,600 / 120,000 = 13%.", "answer": {"value": 0.13, "format": "pct", "tolerance_abs": 0.0005}}, {"id": "BF-0263", "section_code": "BF", "r1_topic": "Banks and financial institutions", "type": "numeric", "difficulty": 3, "stem": "A bank with total assets of ₹5,00,000 crore reports net profit of ₹7,500 crore. What is its return on assets (%)?", "explanation": "7,500 / 500,000 = 1.5%.", "answer": {"value": 0.015, "format": "pct", "tolerance_abs": 0.0002}}, {"id": "BF-0264", "section_code": "BF", "r1_topic": "Banks and financial institutions", "type": "mcq", "difficulty": 2, "stem": "If the RBI raises the repo rate, the most likely effect on bank lending is:", "explanation": "A higher repo rate raises banks' borrowing cost and external-benchmark loan rates.", "options": [{"label": "A", "text": "Loans become cheaper"}, {"label": "B", "text": "Deposits are no longer needed"}, {"label": "C", "text": "The CRR falls automatically"}, {"label": "D", "text": "Loans linked to the repo rate become costlier and credit growth slows"}], "correct_option": "D"}, {"id": "BF-0265", "section_code": "BF", "r1_topic": "Banks and financial institutions", "type": "mcq", "difficulty": 2, "stem": "Which statement about CRR and SLR is correct?", "explanation": "CRR = cash with RBI. SLR = liquid assets the bank holds itself, such as government securities.", "options": [{"label": "A", "text": "SLR is cash with the RBI"}, {"label": "B", "text": "CRR is held in government bonds"}, {"label": "C", "text": "Both are paid as interest to the bank"}, {"label": "D", "text": "CRR is held as cash with the RBI and earns nothing; SLR is held in approved securities, cash or gold"}], "correct_option": "D"}, {"id": "BF-0266", "section_code": "BF", "r1_topic": "Banks and financial institutions", "type": "mcq", "difficulty": 2, "stem": "The main difference between an NBFC and a bank is that an NBFC:", "explanation": "NBFCs lend and invest but cannot offer savings or current accounts.", "options": [{"label": "A", "text": "Cannot lend"}, {"label": "B", "text": "Is not regulated"}, {"label": "C", "text": "Cannot accept demand deposits or issue cheques drawn on itself"}, {"label": "D", "text": "Cannot be listed"}], "correct_option": "C"}, {"id": "BF-0267", "section_code": "BF", "r1_topic": "Banks and financial institutions", "type": "mcq", "difficulty": 2, "stem": "Deposit insurance (DICGC) covers up to how much per depositor per bank?", "explanation": "Principal and interest together, per depositor, per bank.", "options": [{"label": "A", "text": "₹25 lakh"}, {"label": "B", "text": "₹5 lakh"}, {"label": "C", "text": "₹10 lakh"}, {"label": "D", "text": "₹1 lakh"}], "correct_option": "B"}, {"id": "BF-0268", "section_code": "BF", "r1_topic": "Banks and financial institutions", "type": "mcq", "difficulty": 2, "stem": "Which regulator supervises banks and sets the repo rate in India?", "explanation": "SEBI regulates markets, IRDAI insurance, PFRDA pensions.", "options": [{"label": "A", "text": "PFRDA"}, {"label": "B", "text": "IRDAI"}, {"label": "C", "text": "SEBI"}, {"label": "D", "text": "Reserve Bank of India"}], "correct_option": "D"}, {"id": "BF-0269", "section_code": "BF", "r1_topic": "Banks and financial institutions", "type": "mcq", "difficulty": 3, "stem": "A bank raises a ₹100 crore provision against a bad loan. The immediate effect on its income statement is:", "explanation": "Provisions are an expense. They reduce profit even though no cash leaves the bank at that moment.", "options": [{"label": "A", "text": "Revenue rises by ₹100 crore"}, {"label": "B", "text": "No effect until the loan is written off"}, {"label": "C", "text": "Deposits fall"}, {"label": "D", "text": "Profit falls by ₹100 crore before tax"}], "correct_option": "D"}, {"id": "BF-0270", "section_code": "BF", "r1_topic": "Banks and financial institutions", "type": "mcq", "difficulty": 3, "stem": "Why is a high CASA ratio good for a bank?", "explanation": "Current and savings balances pay little or no interest, so the cost of funds is lower.", "options": [{"label": "A", "text": "It means more loans are bad"}, {"label": "B", "text": "It lowers capital needs"}, {"label": "C", "text": "It gives cheaper funding, widening the interest margin"}, {"label": "D", "text": "It increases the CRR"}], "correct_option": "C"}]};
const STUDY = [{"id": "sm-found", "sec": "SM", "title": "Formulae and Foundations", "r1": "Formulae and Foundations", "min": 25, "html": "\n<p class=\"lead\">Every spreadsheet question in Round 1 is built from the same few ideas: a cell holds either a value or a formula, a formula points at other cells, and copying a formula moves those pointers. Master these and the rest of the section is vocabulary.<\/p>\n\n<h3>1. What a spreadsheet actually is<\/h3>\n<p>A spreadsheet is a grid. Each box is a <b>cell<\/b>, named by its column letter and row number: <code>B3<\/code> is column B, row 3. A group of cells is a <b>range<\/b>, written with a colon: <code>B2:B6<\/code> is five cells in a column; <code>B2:D4<\/code> is a 3 × 3 block.<\/p>\n<p>A cell holds one of two things:<\/p>\n<ul>\n<li>a <b>value<\/b> you typed (a number like <code>500<\/code>, text like <code>North<\/code>, a date, TRUE or FALSE), or<\/li>\n<li>a <b>formula<\/b>, which always starts with <code>=<\/code>. The cell then <em>shows<\/em> the result but <em>holds<\/em> the recipe.<\/li>\n<\/ul>\n<div class=\"why\"><b>The core idea.<\/b> A formula is a recipe that points at other cells instead of containing numbers. If <code>C2<\/code> holds <code>=A2*B2<\/code>, then changing A2 changes C2 automatically. That is why a model built with references can answer \"what if the price were ₹90?\" in one keystroke, and a model with typed numbers cannot.<\/div>\n\n<h3>2. The four kinds of data<\/h3>\n<table>\n<tr><th>Type<\/th><th>Example<\/th><th>What to remember<\/th><\/tr>\n<tr><td>Number<\/td><td>1250, 0.08, -40<\/td><td>Right-aligned by default. A cell formatted as % holds a fraction: 8% is stored as 0.08.<\/td><\/tr>\n<tr><td>Text<\/td><td>\"Pen\", \"P104\"<\/td><td>Left-aligned. Text that looks like a number (\"500\" imported from a file) is ignored by SUM. Fix with <code>VALUE()<\/code> or multiply by 1.<\/td><\/tr>\n<tr><td>Boolean<\/td><td>TRUE, FALSE<\/td><td>Result of a comparison such as <code>=B2&gt;100<\/code>. In arithmetic TRUE counts as 1 and FALSE as 0, which powers many tricks.<\/td><\/tr>\n<tr><td>Date<\/td><td>14-Oct-2026<\/td><td>A date is a serial number (days since a start date), formatted to look like a date. So <code>=B2-B1<\/code> is the number of days between two dates.<\/td><\/tr>\n<\/table>\n\n<h3>3. How a formula is calculated<\/h3>\n<p>Excel and Google Sheets evaluate in a fixed order. Anything in brackets goes first, then powers (<code>^<\/code>), then multiplication and division (left to right), then addition and subtraction (left to right).<\/p>\n<div class=\"fx\">=100+20*2 &rarr; 140 &nbsp;|&nbsp; =(100+20)*2 &rarr; 240 &nbsp;|&nbsp; =2^3*2 &rarr; 16 &nbsp;|&nbsp; =100*(1+8%)^3 &rarr; 125.97<\/div>\n<p>When in doubt, add brackets. Brackets cost nothing and remove ambiguity. In particular, write growth as <code>(1+rate)^years<\/code>, never <code>1+rate^years<\/code>.<\/p>\n\n<h3>4. Cell references: the most tested idea<\/h3>\n<p>When you copy a formula, every reference inside it shifts by the same distance you moved. That is called a <b>relative<\/b> reference, and it is what lets one formula fill a whole column. When you do <em>not<\/em> want a reference to move (a tax rate, an interest rate, a price), you lock it with <code>$<\/code>.<\/p>\n<table>\n<tr><th>Written<\/th><th>Name<\/th><th>Copied down<\/th><th>Copied right<\/th><\/tr>\n<tr><td><code>B2<\/code><\/td><td>relative<\/td><td>B3, B4...<\/td><td>C2, D2...<\/td><\/tr>\n<tr><td><code>$B$2<\/code><\/td><td>absolute<\/td><td>stays $B$2<\/td><td>stays $B$2<\/td><\/tr>\n<tr><td><code>$B2<\/code><\/td><td>column locked<\/td><td>$B3<\/td><td>stays $B2<\/td><\/tr>\n<tr><td><code>B$2<\/code><\/td><td>row locked<\/td><td>stays B$2<\/td><td>C$2<\/td><\/tr>\n<\/table>\n<div class=\"eg\"><b>Worked example: a tax-rate table.<\/b> Prices run down column A (A2:A5). Tax rates run across row 1 (B1:D1). You want a table of price × (1 + rate) in B2:D5.\n<div class=\"fx\">B2: =$A2*(1+B$1)<\/div>\nWhy: as you copy <em>right<\/em>, you want the rate to move across B1, C1, D1 but the price to stay in column A, so lock the column of the price ($A). As you copy <em>down<\/em>, you want the price to move to A3, A4... but the rate to stay in row 1, so lock the row of the rate (B$1). Press F4 to cycle through the four forms.<\/div>\n<div class=\"trap\"><b>Watch out.<\/b> A formula that is right in row 2 and wrong from row 3 down almost always has a missing <code>$<\/code>. When you see a rate or constant being used by many rows, lock it.<\/div>\n\n<h3>5. Anatomy of a function<\/h3>\n<p>A function is a built-in recipe: a name, brackets, and arguments separated by commas. <code>SUM(B2:B6)<\/code> has one argument. <code>IF(B2&gt;100,\"High\",\"Low\")<\/code> has three. Arguments can be cells, ranges, numbers, text in quotes, or other functions (nesting). Read nested formulas from the inside out.<\/p>\n\n<h3>6. Logic: IF, AND, OR<\/h3>\n<div class=\"fx\">=IF(test, value_if_true, value_if_false)<\/div>\n<p>The test is any comparison: <code>=<\/code>, <code>&lt;&gt;<\/code> (not equal), <code>&gt;<\/code>, <code>&gt;=<\/code>, <code>&lt;<\/code>, <code>&lt;=<\/code>. Combine tests with <code>AND(t1,t2)<\/code> (all true), <code>OR(t1,t2)<\/code> (any true), <code>NOT(t)<\/code>.<\/p>\n<p><b>Tiers<\/b> are nested IFs. Test from the most demanding tier down, because IF stops at the first true test:<\/p>\n<div class=\"fx\">=IF(B1&gt;=1000000, B1*3%, IF(B1&gt;=500000, B1*2%, 0))<\/div>\n<p>If you tested <code>&gt;=500000<\/code> first, a sale of ₹12 lakh would stop there and pay 2%. Modern Sheets also offers <code>IFS(t1,v1,t2,v2,TRUE,default)<\/code>.<\/p>\n\n<h3>7. Summing, counting and averaging under conditions<\/h3>\n<table>\n<tr><th>Task<\/th><th>Function<\/th><th>Pattern<\/th><\/tr>\n<tr><td>Plain total<\/td><td>SUM<\/td><td><code>=SUM(B2:B50)<\/code><\/td><\/tr>\n<tr><td>Count numbers / non-blanks<\/td><td>COUNT / COUNTA<\/td><td><code>=COUNTA(A2:A50)<\/code><\/td><\/tr>\n<tr><td>Total where one condition holds<\/td><td>SUMIF<\/td><td><code>=SUMIF(range, criterion, sum_range)<\/code><\/td><\/tr>\n<tr><td>Total where several hold<\/td><td>SUMIFS<\/td><td><code>=SUMIFS(sum_range, range1, crit1, range2, crit2)<\/code><\/td><\/tr>\n<tr><td>Count with conditions<\/td><td>COUNTIF(S)<\/td><td><code>=COUNTIFS(A:A,\"South\",C:C,\"&gt;500\")<\/code><\/td><\/tr>\n<tr><td>Average with conditions<\/td><td>AVERAGEIF(S)<\/td><td><code>=AVERAGEIF(A:A,\"North\",C:C)<\/code><\/td><\/tr>\n<tr><td>Weighted total or average<\/td><td>SUMPRODUCT<\/td><td><code>=SUMPRODUCT(weights, scores)<\/code><\/td><\/tr>\n<\/table>\n<p>Criteria are written as text: <code>\"North\"<\/code>, <code>\"&gt;=100\"<\/code>, <code>\"&lt;&gt;0\"<\/code>. To compare with a cell, join with <code>&amp;<\/code>: <code>\"&gt;\"&amp;E2<\/code>. Note the order trap: SUMIF puts the range to add <em>last<\/em>, SUMIFS puts it <em>first<\/em>.<\/p>\n<div class=\"eg\"><b>SUMPRODUCT in plain words.<\/b> It multiplies two ranges element by element and adds the results. With weights 0.4, 0.35, 0.25 and scores 82, 74, 90 it computes 0.4×82 + 0.35×74 + 0.25×90 = 81.2. It is the cleanest way to get a total of \"quantity × price\" without a helper column.<\/div>\n\n<h3>8. Rounding<\/h3>\n<table>\n<tr><th>Function<\/th><th>Rule<\/th><th>2.5 gives<\/th><\/tr>\n<tr><td>ROUND(x,0)<\/td><td>nearest<\/td><td>3<\/td><\/tr>\n<tr><td>ROUNDUP(x,0)<\/td><td>always away from zero<\/td><td>3<\/td><\/tr>\n<tr><td>ROUNDDOWN(x,0)<\/td><td>always toward zero<\/td><td>2<\/td><\/tr>\n<tr><td>CEILING / FLOOR<\/td><td>to a multiple<\/td><td>-<\/td><\/tr>\n<\/table>\n<p>The business rule decides the function. You cannot run 12.3 trucks, so use ROUNDUP. You cannot sell 0.7 of a ticket to break even, so round break-even <em>up<\/em>. Round only at the last step; rounding in the middle of a chain compounds error.<\/p>\n\n<h3>9. Text and dates in one page<\/h3>\n<ul>\n<li>Join text with <code>&amp;<\/code>: <code>=A2&amp;\" - \"&amp;B2<\/code>. Pull pieces with <code>LEFT<\/code>, <code>RIGHT<\/code>, <code>MID<\/code>. Clean with <code>TRIM<\/code> (removes stray spaces that break lookups). Format a number inside text with <code>TEXT(B2,\"0.0%\")<\/code>.<\/li>\n<li>Dates: <code>EDATE(date, 6)<\/code> is six calendar months later; <code>EOMONTH(date,0)<\/code> is the month end; <code>DATEDIF(start,end,\"M\")<\/code> is whole months; <code>YEARFRAC(start,end)<\/code> is years as a decimal; <code>TODAY()<\/code> updates daily.<\/li>\n<\/ul>\n\n<h3>10. Reading errors<\/h3>\n<table>\n<tr><th>Error<\/th><th>Meaning<\/th><th>Usual cause<\/th><\/tr>\n<tr><td>#DIV/0!<\/td><td>divided by zero or blank<\/td><td>denominator cell is empty<\/td><\/tr>\n<tr><td>#N/A<\/td><td>value not found<\/td><td>lookup key missing or has a trailing space<\/td><\/tr>\n<tr><td>#VALUE!<\/td><td>wrong data type<\/td><td>text where a number is needed<\/td><\/tr>\n<tr><td>#REF!<\/td><td>reference no longer exists<\/td><td>a referenced row or column was deleted<\/td><\/tr>\n<tr><td>#NAME?<\/td><td>unknown name<\/td><td>misspelt function, or text without quotes<\/td><\/tr>\n<tr><td>#NUM!<\/td><td>impossible number<\/td><td>IRR with no sign change, negative square root<\/td><\/tr>\n<\/table>\n\n<h3>Common traps<\/h3>\n<ul>\n<li>Typing a number inside a formula (<code>=B2*0.25<\/code>) so the model stops updating.<\/li>\n<li>Using ROUND where the situation needs ROUNDUP.<\/li>\n<li>Reversing SUMIF and SUMIFS argument order.<\/li>\n<li>Percent confusion: typing 8 into a % cell gives 800%. Type 8% or 0.08.<\/li>\n<li>Forgetting that a lookup or sum range was not locked and slid off the table when copied.<\/li>\n<\/ul>\n<div class=\"try\"><b>Try it in a sheet (5 minutes).<\/b> Put prices in A2:A5 and rates 5%, 12%, 18% in B1:D1. Build the full price-with-tax grid with one formula. Then change one price and watch the row update. If you needed to edit more than one cell, a reference is not locked correctly.<\/div>\n"}, {"id": "sm-look", "sec": "SM", "title": "Lookups and data joins", "r1": "Lookups and data joins", "min": 25, "html": "\n<p class=\"lead\">A lookup answers \"given this key, what is the matching value?\" A join is the same idea applied to a whole column. Most real data lives in separate tables (prices in one, orders in another), so this is how you connect them.<\/p>\n\n<h3>1. The idea: key and table<\/h3>\n<p>Picture a price list: each row has a <b>key<\/b> that identifies it (product code) and some <b>attributes<\/b> (name, price). A lookup takes a key you already have and returns one attribute from the matching row.<\/p>\n<div class=\"why\"><b>Why not just type the price?<\/b> Because the price list will change, and because you may have 5,000 orders. A lookup keeps one source of truth: change the price once and every order updates.<\/div>\n\n<h3>2. VLOOKUP: the classic<\/h3>\n<div class=\"fx\">=VLOOKUP(key, table, column_number, exact_or_approx)<\/div>\n<p>Read it as: \"go down the <em>first column<\/em> of the table to find the key, then move across to column number N and return that cell.\" Always set the last argument to <code>FALSE<\/code> (or <code>0<\/code>) for an exact match.<\/p>\n<div class=\"eg\">Table in A2:C6 with Code, Item, Price. Key in E1 = P104.\n<div class=\"fx\">=VLOOKUP(E1, A2:C6, 3, FALSE) &rarr; 25<\/div>\nColumn 3 of the table is Price.<\/div>\n<p><b>Limits of VLOOKUP:<\/b> the key must be in the table's first column; the answer must be to its right; and the column number is typed, so inserting a column silently breaks it.<\/p>\n\n<h3>3. INDEX + MATCH: the flexible pair<\/h3>\n<p>Split the job in two. <code>MATCH<\/code> finds <em>where<\/em> the key sits. <code>INDEX<\/code> picks the item at that position from any column you choose.<\/p>\n<div class=\"fx\">=MATCH(key, lookup_range, 0) &rarr; a position number<br>=INDEX(return_range, position) &rarr; the item at that position<br>=INDEX(return_range, MATCH(key, lookup_range, 0))<\/div>\n<div class=\"eg\">Names in A2:A6, IDs in B2:B6. Find the name for ID 7101 (the name is to the <em>left<\/em> of the ID, so VLOOKUP fails).\n<div class=\"fx\">=INDEX(A2:A6, MATCH(7101, B2:B6, 0)) &rarr; Meera<\/div>\nMATCH says \"7101 is 3rd in B2:B6\". INDEX says \"give me the 3rd item of A2:A6\".<\/div>\n<p>MATCH returns a position <em>inside the range you gave<\/em>, not the sheet row number. <code>MATCH(\"Marker\", A2:A6, 0)<\/code> returns 3 even though Marker is on row 4.<\/p>\n\n<h3>4. Two-way lookup<\/h3>\n<p>To find the value at a row label and a column label (region and quarter), use two MATCHes:<\/p>\n<div class=\"fx\">=INDEX(B2:E4, MATCH(\"South\",A2:A4,0), MATCH(\"Q3\",B1:E1,0))<\/div>\n<p>The first MATCH picks the row, the second picks the column, and INDEX returns the cell at their crossing.<\/p>\n\n<h3>5. XLOOKUP: the modern replacement<\/h3>\n<div class=\"fx\">=XLOOKUP(key, lookup_range, return_range, \"if not found\")<\/div>\n<p>It looks in one range and returns from another, left or right, with a built-in not-found message, and defaults to exact match. Use it whenever the question or tool allows.<\/p>\n\n<h3>6. Exact vs approximate match<\/h3>\n<p><b>Exact<\/b> (<code>FALSE<\/code> or <code>0<\/code>): find the key or fail with #N/A. Use for IDs, codes and names.<\/p>\n<p><b>Approximate<\/b> (<code>TRUE<\/code> or <code>1<\/code>): find the <em>largest value that does not exceed<\/em> the key. This is what you want for <em>bands<\/em>: tax slabs, commission tiers, grades. The table must be sorted ascending by its lower limits.<\/p>\n<table>\n<tr><th>Sales from<\/th><th>Rate<\/th><\/tr>\n<tr><td>0<\/td><td>0%<\/td><\/tr><tr><td>50,000<\/td><td>2%<\/td><\/tr><tr><td>1,00,000<\/td><td>3.5%<\/td><\/tr><tr><td>2,00,000<\/td><td>5%<\/td><\/tr>\n<\/table>\n<p>Sales of 1,37,500: the largest limit not above it is 1,00,000, so the rate is 3.5%. <code>=VLOOKUP(137500, A2:B5, 2, TRUE)<\/code>.<\/p>\n<div class=\"trap\"><b>Watch out.<\/b> Approximate match on an unsorted table returns wrong rows without any error. And a band lookup returns the <em>band rate<\/em>, which is not the same as the total tax across slabs. For progressive tax, compute each slab's slice separately (or use SUMPRODUCT).<\/div>\n\n<h3>7. Joins: bringing two tables together<\/h3>\n<p>To attach price to each order line, add a column to the order table that looks up the order's code in the price list. This is a \"left join\": every order row is kept; the price is pulled from the other table.<\/p>\n<ul>\n<li>One formula per row, copied down, with the price table locked: <code>=INDEX($B$2:$B$5, MATCH(D2,$A$2:$A$5,0))<\/code>.<\/li>\n<li>If a missing key is expected, use XLOOKUP's not-found argument or <code>IFNA(...)<\/code>. Do not hide all errors by habit.<\/li>\n<li>Duplicate keys: lookups return only the first match. Check with <code>=COUNTIF(A:A, A2)&gt;1<\/code>.<\/li>\n<li>For a total without helper columns: <code>=SUMPRODUCT(SUMIF(codes, order_codes, prices), quantities)<\/code>.<\/li>\n<\/ul>\n\n<h3>8. Why lookups fail (diagnose in this order)<\/h3>\n<ol>\n<li>Trailing or leading spaces in the key. Fix with <code>TRIM<\/code>.<\/li>\n<li>Number stored as text on one side, real number on the other.<\/li>\n<li>Table range not locked with <code>$<\/code>, so it slid down as the formula was copied.<\/li>\n<li>Approximate match left on by accident (the last argument was omitted).<\/li>\n<li>Key not in the first column (VLOOKUP).<\/li>\n<\/ol>\n<div class=\"try\"><b>Try it.<\/b> Build a five-row price list and an order list. Add a price column using INDEX/MATCH, then break it on purpose by adding a space after one code. Watch #N/A appear, then fix it with TRIM.<\/div>\n"}, {"id": "sm-fin", "sec": "SM", "title": "Financial Functions", "r1": "Financial Functions", "min": 30, "html": "\n<p class=\"lead\">Financial functions are shortcuts for the time value of money. To use them correctly you only need to be sure of three things: what the cash flow signs mean, what one \"period\" is, and which of rate, periods, payment, present value and future value is the unknown.<\/p>\n\n<h3>1. The idea behind all of them<\/h3>\n<p>Money has a time value: ₹100 today can be invested and become more. Five numbers describe any loan or investment with regular payments:<\/p>\n<table>\n<tr><th>Symbol<\/th><th>Meaning<\/th><th>Function argument<\/th><\/tr>\n<tr><td>rate<\/td><td>interest per period<\/td><td><code>rate<\/code><\/td><\/tr>\n<tr><td>nper<\/td><td>number of periods<\/td><td><code>nper<\/code><\/td><\/tr>\n<tr><td>pmt<\/td><td>payment each period<\/td><td><code>pmt<\/code><\/td><\/tr>\n<tr><td>pv<\/td><td>value today<\/td><td><code>pv<\/code><\/td><\/tr>\n<tr><td>fv<\/td><td>value at the end<\/td><td><code>fv<\/code><\/td><\/tr>\n<\/table>\n<p>Give a function four of these and it solves for the fifth. <code>PMT<\/code> solves for payment, <code>FV<\/code> for future value, <code>PV<\/code> for present value, <code>NPER<\/code> for number of periods, <code>RATE<\/code> for the rate.<\/p>\n<div class=\"why\"><b>Sign convention.<\/b> Think of your bank balance. Money you <em>receive<\/em> is positive; money you <em>pay out<\/em> is negative. A loan you take is +, and the EMIs you pay are −. A SIP you invest is −, and the maturity you receive is +. If your answer has the right size but a minus sign, flip it with a leading minus: <code>=-PMT(...)<\/code>.<\/div>\n\n<h3>2. Match the rate to the period<\/h3>\n<p>The most common error: using an annual rate with monthly payments. If payments are monthly, the rate must be the <em>monthly<\/em> rate (annual ÷ 12) and the periods the <em>number of months<\/em> (years × 12).<\/p>\n<div class=\"fx\">=PMT(9%/12, 5*12, -2500000) &rarr; 51,893 (EMI on ₹25 lakh at 9% for 5 years)<\/div>\n\n<h3>3. The functions<\/h3>\n<table>\n<tr><th>Function<\/th><th>Syntax<\/th><th>Solves for<\/th><\/tr>\n<tr><td>PMT<\/td><td><code>PMT(rate, nper, pv, [fv], [type])<\/code><\/td><td>EMI, or the SIP needed for a goal<\/td><\/tr>\n<tr><td>FV<\/td><td><code>FV(rate, nper, pmt, [pv], [type])<\/code><\/td><td>Corpus after n periods<\/td><\/tr>\n<tr><td>PV<\/td><td><code>PV(rate, nper, pmt, [fv], [type])<\/code><\/td><td>Loan you can afford; value today of a future stream<\/td><\/tr>\n<tr><td>NPER<\/td><td><code>NPER(rate, pmt, pv, [fv])<\/code><\/td><td>Months to clear a loan or reach a goal<\/td><\/tr>\n<tr><td>RATE<\/td><td><code>RATE(nper, pmt, pv, [fv])<\/code><\/td><td>Interest rate per period<\/td><\/tr>\n<tr><td>IPMT / PPMT<\/td><td><code>IPMT(rate, per, nper, pv)<\/code><\/td><td>Interest / principal in one particular instalment<\/td><\/tr>\n<tr><td>NPV<\/td><td><code>NPV(rate, flow1, flow2, ...)<\/code><\/td><td>PV of uneven flows from period 1<\/td><\/tr>\n<tr><td>IRR<\/td><td><code>IRR(flows)<\/code><\/td><td>Rate that makes NPV zero<\/td><\/tr>\n<tr><td>XNPV / XIRR<\/td><td><code>XIRR(flows, dates)<\/code><\/td><td>Same, but on irregular dates<\/td><\/tr>\n<tr><td>EFFECT / NOMINAL<\/td><td><code>EFFECT(nominal, m)<\/code><\/td><td>Converts annual rate with m compoundings to effective rate<\/td><\/tr>\n<\/table>\n\n<h3>4. Worked examples<\/h3>\n<div class=\"eg\"><b>EMI.<\/b> Loan ₹25,00,000 at 9% a year for 5 years, monthly payments.\n<div class=\"fx\">=-PMT(9%/12, 60, 2500000) &rarr; ₹51,893<\/div><\/div>\n<div class=\"eg\"><b>SIP maturity.<\/b> ₹5,000 invested at the end of each month for 10 years at 12% a year (1% a month).\n<div class=\"fx\">=-FV(1%, 120, -5000) &rarr; about ₹11.5 lakh<\/div>\nBecause the payment is negative (money going out), FV comes back positive.<\/div>\n<div class=\"eg\"><b>SIP needed for a goal.<\/b> ₹1 crore in 15 years at 12%.\n<div class=\"fx\">=-PMT(1%, 180, 0, 10000000) &rarr; about ₹20,000 a month<\/div>\npv is 0 (you start with nothing) and fv is the target.<\/div>\n<div class=\"eg\"><b>Months to clear a loan.<\/b> ₹3,00,000 at 18% (1.5% a month) with ₹15,000 a month.\n<div class=\"fx\">=NPER(1.5%, -15000, 300000) &rarr; about 24 months<\/div><\/div>\n<div class=\"eg\"><b>Interest in a given month.<\/b> ₹10 lakh at 10% for 5 years: interest in the first EMI is <code>=-IPMT(10%/12, 1, 60, 1000000)<\/code> = ₹8,333, which is just 10 lakh × 0.8333%. Later instalments carry less interest and more principal.<\/div>\n\n<h3>5. Annuity due vs ordinary annuity<\/h3>\n<p>The optional <code>type<\/code> argument: <code>0<\/code> (or omitted) means payments at the <em>end<\/em> of each period, <code>1<\/code> means at the <em>start<\/em>. A SIP debited on the 1st for the month ahead is closer to type 1. Payments at the start earn one extra period of interest, so type 1 gives a larger FV.<\/p>\n\n<h3>6. NPV, IRR and payback for investments<\/h3>\n<p><b>NPV<\/b> adds up all future cash flows after discounting each back to today at your required return. A positive NPV means the project earns more than that return, so accept it.<\/p>\n<div class=\"fx\">=NPV(rate, C2:C6) + C1 &nbsp; where C1 is today's outflow (negative)<\/div>\n<div class=\"trap\"><b>The NPV trap.<\/b> Excel's and Sheets' <code>NPV<\/code> treats the first number as arriving at the end of period 1. Your period-0 outlay therefore must be added <em>outside<\/em> the function. Putting it inside discounts it by a year and gives the wrong answer.<\/div>\n<p><b>IRR<\/b> is the discount rate at which NPV is exactly zero. If IRR is above your required return, accept. IRR needs at least one negative and one positive flow; otherwise you get #NUM!.<\/p>\n<p><b>Payback period<\/b> has no function. Build a row of cumulative cash flow and find where it first becomes positive. If cumulative cash is −200 at the end of year 3 and year 4 brings in 500, payback is 3 + 200/500 = 3.4 years.<\/p>\n\n<h3>7. Effective vs nominal rates<\/h3>\n<p>A nominal rate of 12% compounded monthly is not 12% a year in effect, because interest earns interest. The effective annual rate is (1 + 0.12/12)^12 − 1 = 12.68%. Use <code>=EFFECT(12%, 12)<\/code>. When comparing two loans or deposits, compare effective rates.<\/p>\n\n<h3>Common traps<\/h3>\n<ul>\n<li>Annual rate with monthly periods.<\/li>\n<li>Sign errors: negative EMI, or FV that comes out as zero because both pmt and pv were negative.<\/li>\n<li>Period-0 cash flow inside NPV.<\/li>\n<li>Wrong <code>type<\/code> for annuity due.<\/li>\n<li>Reading IRR on a project with several sign changes (it may have more than one answer).<\/li>\n<\/ul>\n<div class=\"try\"><b>Try it.<\/b> Build a loan schedule: month in column A, opening balance, interest (<code>=B2*rate/12<\/code>), principal (<code>=EMI-interest<\/code>), closing balance. After month 60 the closing balance should be zero. If it is not, your EMI or rate period is wrong.<\/div>\n"}, {"id": "sm-dyn", "sec": "SM", "title": "Dynamic Arrays", "r1": "Dynamic Arrays", "min": 20, "html": "\n<p class=\"lead\">In a classic formula, one cell returns one value. A dynamic-array formula returns a whole list or table from a single cell, and that result \"spills\" into the empty cells next to it. Change the data and the spill grows or shrinks by itself.<\/p>\n\n<h3>1. The idea<\/h3>\n<p>Think of a normal formula as a vending machine that gives you one item. An array formula is a conveyor belt: you ask once and a whole row of items rolls out. The cell holding the formula is the <b>anchor<\/b>; the cells it fills are the <b>spill range<\/b>.<\/p>\n<div class=\"why\"><b>Why it matters.<\/b> Before dynamic arrays you wrote a formula, copied it down 500 rows, and had to remember to extend it when data grew. Now you write it once and the range resizes. This also removes a major source of errors in model design: the \"copied down but missed the last row\" mistake.<\/div>\n<p>Rules for spilling: the cells it needs must be empty, otherwise you get <b>#SPILL!<\/b>. You edit the formula only in the anchor cell. In Excel you can point at the whole spill with <code>A2#<\/code>. In Google Sheets, functions like FILTER, SORT, UNIQUE and SEQUENCE spill natively, and <code>ARRAYFORMULA<\/code> forces ordinary formulas to work on whole ranges.<\/p>\n\n<h3>2. The core functions<\/h3>\n<table>\n<tr><th>Function<\/th><th>What it does<\/th><th>Example<\/th><\/tr>\n<tr><td>FILTER<\/td><td>keeps rows that meet a test<\/td><td><code>=FILTER(A2:C100, C2:C100&gt;50000, \"none\")<\/code><\/td><\/tr>\n<tr><td>SORT<\/td><td>orders rows by a column<\/td><td><code>=SORT(A2:B100, 2, FALSE)<\/code> (column 2, largest first)<\/td><\/tr>\n<tr><td>SORTN (Sheets)<\/td><td>sorts then keeps the top n<\/td><td><code>=SORTN(A2:B100, 5, 0, 2, FALSE)<\/code><\/td><\/tr>\n<tr><td>UNIQUE<\/td><td>removes duplicates<\/td><td><code>=UNIQUE(B2:B100)<\/code><\/td><\/tr>\n<tr><td>SEQUENCE<\/td><td>generates numbers<\/td><td><code>=SEQUENCE(12)<\/code> gives 1 to 12; <code>=SEQUENCE(5,1,100,10)<\/code> gives 100,110,...<\/td><\/tr>\n<tr><td>TRANSPOSE<\/td><td>swaps rows and columns<\/td><td><code>=TRANSPOSE(A1:A5)<\/code><\/td><\/tr>\n<tr><td>ARRAYFORMULA (Sheets)<\/td><td>applies a formula to a whole range<\/td><td><code>=ARRAYFORMULA(B2:B*C2:C)<\/code><\/td><\/tr>\n<tr><td>LET (Excel)<\/td><td>names a sub-result inside a formula<\/td><td><code>=LET(r, B1/12, B2*r)<\/code><\/td><\/tr>\n<\/table>\n\n<h3>3. FILTER in depth<\/h3>\n<p>FILTER takes two main inputs: <b>what to return<\/b> and <b>a test of the same height<\/b>. The test produces TRUE/FALSE for each row; only TRUE rows survive.<\/p>\n<div class=\"eg\">Region in column A, Rep in column B, Revenue in column C.\n<div class=\"fx\">=FILTER(A2:C100, A2:A100=\"North\")<\/div>\nreturns all columns for North rows. To combine tests, multiply for AND, add for OR:\n<div class=\"fx\">AND: =FILTER(A2:C100, (A2:A100=\"North\")*(C2:C100&gt;1000))<br>OR: =FILTER(A2:C100, (A2:A100=\"North\")+(A2:A100=\"East\"))<\/div>\nMultiplication works because TRUE × TRUE = 1 and anything × FALSE = 0.<\/div>\n<p>If nothing passes the test FILTER gives #N/A. Always add the third argument: <code>=FILTER(range, test, \"none\")<\/code>.<\/p>\n\n<h3>4. Building up answers by nesting<\/h3>\n<p>The result of one array function can feed another. Read from the inside out.<\/p>\n<ul>\n<li><b>Number of distinct customers:<\/b> <code>=COUNTA(UNIQUE(B2:B100))<\/code>.<\/li>\n<li><b>Total revenue for North without SUMIF:<\/b> <code>=SUM(FILTER(C2:C100, A2:A100=\"North\"))<\/code>.<\/li>\n<li><b>Highest North revenue:<\/b> <code>=MAX(FILTER(C2:C100, A2:A100=\"North\"))<\/code>.<\/li>\n<li><b>Top 5 rows by revenue:<\/b> <code>=SORTN(A2:C100, 5, 0, 3, FALSE)<\/code> in Sheets, or <code>=TAKE(SORT(A2:C100,3,-1),5)<\/code> in Excel 365.<\/li>\n<li><b>Items on list 1 missing from list 2:<\/b> <code>=FILTER(A2:A50, ISNA(MATCH(A2:A50, D2:D40, 0)))<\/code>.<\/li>\n<li><b>A 60-month schedule's month column:<\/b> <code>=SEQUENCE(60)<\/code>.<\/li>\n<\/ul>\n\n<h3>5. Array arithmetic and SUMPRODUCT<\/h3>\n<p>Operations on ranges work element by element. <code>B2:B5*C2:C5<\/code> multiplies row by row. <code>SUMPRODUCT<\/code> does the multiply-and-add in one step and works in every version, even where spilling does not:<\/p>\n<div class=\"fx\">=SUMPRODUCT((A2:A100=\"North\")*(C2:C100&gt;1000)*D2:D100)<\/div>\n<p>This reads: for each row, 1 if North and over 1000 else 0, times the amount, then add them all up.<\/p>\n\n<h3>6. Exam-style traps<\/h3>\n<ul>\n<li>Pointing at a single spill cell with a fixed address (like <code>E5<\/code>) so the model breaks when the spill grows. Reference the whole spill.<\/li>\n<li>Forgetting that the column index in SORT counts <em>within the range given<\/em>, not the sheet.<\/li>\n<li>Having non-empty cells in the spill zone (#SPILL!).<\/li>\n<li>Using FILTER without a not-found value.<\/li>\n<li>In Sheets, writing <code>=B2:B*C2:C<\/code> without ARRAYFORMULA and getting only one row.<\/li>\n<\/ul>\n<div class=\"try\"><b>Try it.<\/b> Paste 20 sales lines (region, rep, revenue). In one cell show the unique regions; beside it, in one cell per region, the total using SUMIF; then rebuild the same total with <code>SUM(FILTER(...))<\/code>. The answers must match.<\/div>\n"}, {"id": "sm-model", "sec": "SM", "title": "Model Design", "r1": "Model Design", "min": 25, "html": "\n<p class=\"lead\">A model is not judged on whether it gives today's answer. It is judged on whether a stranger can change an assumption and trust what comes out. Good design is a small set of habits that make errors visible and changes cheap.<\/p>\n\n<h3>1. Why design matters<\/h3>\n<p>Studies of real business spreadsheets repeatedly find errors in a large majority of them. The errors are rarely in the maths. They come from hard-coded numbers, inconsistent formulas, and inputs scattered across sheets. A well-designed model makes each of those hard to commit.<\/p>\n\n<h3>2. Separate inputs, calculations and outputs<\/h3>\n<ul>\n<li><b>Inputs<\/b>: every assumption (price, growth, tax rate, loan amount) lives in one clearly labelled area, one value per cell, with a unit.<\/li>\n<li><b>Calculations<\/b>: formulas that read inputs and produce intermediate results. No typed numbers.<\/li>\n<li><b>Outputs<\/b>: summary, charts, and decisions that read from calculations.<\/li>\n<\/ul>\n<p>Convention: blue font for inputs, black for formulas, green for links to other sheets. A reader can then see at a glance what they are allowed to change.<\/p>\n<div class=\"why\"><b>The test.<\/b> Change one input. If the answer does not move, there is a hard-code somewhere. If the answer moves in the wrong direction, there is a logic error. This is the fastest audit you can do.<\/div>\n\n<h3>3. No hard-codes<\/h3>\n<p>A hard-code is a number typed inside a formula: <code>=B14*0.25<\/code>. It hides the assumption, and it is the usual reason a model is wrong after one input changes. Fix: put 25% in an input cell labelled \"Tax rate\" and write <code>=B14*$C$3<\/code>, or name the cell <code>TaxRate<\/code> and write <code>=B14*TaxRate<\/code>.<\/p>\n\n<h3>4. Consistent formulas<\/h3>\n<ul>\n<li>Time runs left to right, one period per column, and means the same on every sheet.<\/li>\n<li>One formula per row, copied across all periods. If one cell differs, someone has overridden it; the row is no longer trustworthy.<\/li>\n<li>If a period really needs different logic (a one-off cost), model it in a separate row or input rather than overwriting a cell.<\/li>\n<li>No blank rows or merged cells inside data ranges; they break sorting, filtering and array formulas.<\/li>\n<\/ul>\n\n<h3>5. Checks and error handling<\/h3>\n<ul>\n<li>Build <b>check cells<\/b> that must equal zero: assets − (liabilities + equity); sum of parts − total; closing cash on the cash flow − cash on the balance sheet. Show one master check at the top.<\/li>\n<li>Use <b>data validation<\/b> to stop impossible inputs: a dropdown list for scenarios, percentages between 0 and 100%.<\/li>\n<li>Use <code>IFERROR<\/code> only where an error is expected and the replacement value is meaningful. Wrapping everything in IFERROR hides real data problems.<\/li>\n<\/ul>\n\n<h3>6. Scenarios and sensitivity<\/h3>\n<p><b>Scenarios<\/b>: a selector cell (1 = base, 2 = upside, 3 = downside) drives <code>=CHOOSE(selector, base, upside, downside)<\/code> or <code>=INDEX(scenario_row, selector)<\/code> for each key input. One switch flips the whole model.<\/p>\n<p><b>Sensitivity<\/b>: shows how an output reacts as one or two inputs change. A one-way test varies one input. A two-way table puts one input down the side and another across the top with the output in the corner, for example NPV against discount rate and growth. Excel has Data Tables; in Sheets build the grid with formulas.<\/p>\n<p><b>Goal Seek<\/b> works backwards: \"what price makes profit exactly zero?\" It adjusts one input until an output hits a target value.<\/p>\n\n<h3>7. Documentation<\/h3>\n<ul>\n<li>A cover or notes area stating purpose, units (₹ lakh, ₹ crore, monthly or annual), version and key assumptions.<\/li>\n<li>Named ranges for key inputs so formulas read like sentences.<\/li>\n<li>Units in headers; consistent number formats; frozen header rows; comments where logic is not obvious.<\/li>\n<\/ul>\n\n<h3>8. A model-review checklist<\/h3>\n<table>\n<tr><th>Question<\/th><th>Good sign<\/th><th>Red flag<\/th><\/tr>\n<tr><td>Where are assumptions?<\/td><td>One labelled block<\/td><td>Scattered through formulas<\/td><\/tr>\n<tr><td>Typed numbers in formulas?<\/td><td>None<\/td><td><code>*0.25<\/code>, <code>/12<\/code> for rates<\/td><\/tr>\n<tr><td>Is each row one formula?<\/td><td>Yes, copied across<\/td><td>One cell overwritten<\/td><\/tr>\n<tr><td>Do totals tie?<\/td><td>Check cell = 0<\/td><td>No checks at all<\/td><\/tr>\n<tr><td>Is the sheet auditable?<\/td><td>Clear flow top to bottom<\/td><td>Circular references, merged cells<\/td><\/tr>\n<\/table>\n\n<div class=\"eg\"><b>Spot the flaws.<\/b> A model types <code>*0.25<\/code> in twenty formulas for tax, has year-4 growth overwritten with 12%, and uses <code>=SUM(C5:C14)<\/code> for a total that should include row 15. Fixes: move 25% to an input cell and lock it; restore the growth formula and put any year-4 override in a scenario input; extend the SUM to row 15 (or use a table so the range grows).<\/div>\n<div class=\"try\"><b>Try it.<\/b> Take any calculation you have built (the EMI schedule from the Financial Functions topic). Move every number into an Inputs block, add a check that the final balance is zero, and add a scenario selector for three interest rates.<\/div>\n"}, {"id": "bf-fs", "sec": "BF", "title": "Financial Statements", "r1": "Financial Statements", "min": 40, "html": "\n<p class=\"lead\">Financial statements are the scoreboard of a business. There are three, and each answers one question: Did we make a profit? (income statement) What do we own and owe? (balance sheet) Where did the cash go? (cash flow statement). This topic builds all three from scratch using one small company, so you can see how a single event flows through every statement.<\/p>\n\n<h3>1. The accounting equation: where everything starts<\/h3>\n<div class=\"fx\">Assets = Liabilities + Equity<\/div>\n<ul>\n<li><b>Assets<\/b>: things the business owns that will bring future benefit (cash, stock, equipment, money customers owe).<\/li>\n<li><b>Liabilities<\/b>: what it owes to outsiders (suppliers, banks).<\/li>\n<li><b>Equity<\/b>: what is left for the owners: money they put in plus profits kept in the business.<\/li>\n<\/ul>\n<div class=\"why\"><b>Why it always balances.<\/b> Every asset was paid for either with someone else's money (liability) or the owners' money (equity). Rearranged: Equity = Assets − Liabilities, the owners' claim on what remains. Every transaction changes at least two items so that the equation stays true. This is double-entry bookkeeping. If you ever see a balance sheet that does not balance, an entry is missing.<\/div>\n<p>Quick transactions to feel it:<\/p>\n<table>\n<tr><th>Event<\/th><th>Assets<\/th><th>Liabilities<\/th><th>Equity<\/th><\/tr>\n<tr><td>Owner puts in ₹100 cash<\/td><td>Cash +100<\/td><td><\/td><td>Capital +100<\/td><\/tr>\n<tr><td>Bank lends ₹80<\/td><td>Cash +80<\/td><td>Loan +80<\/td><td><\/td><\/tr>\n<tr><td>Buy equipment for ₹120 cash<\/td><td>Equipment +120, Cash −120<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>Sell goods on credit for ₹60<\/td><td>Receivables +60<\/td><td><\/td><td>Profit +60 (revenue)<\/td><\/tr>\n<tr><td>Pay supplier owed ₹50<\/td><td>Cash −50<\/td><td>Payables −50<\/td><td><\/td><\/tr>\n<\/table>\n\n<h3>2. The income statement (a period)<\/h3>\n<p>It measures performance <em>over a period<\/em> (a quarter, a year): revenue earned, less costs incurred to earn it. It is built on <b>accrual accounting<\/b>: revenue is recorded when earned and costs when incurred, <em>not<\/em> when cash moves. That is why profit and cash differ.<\/p>\n<div class=\"fx\">Revenue<br>&minus; Cost of goods sold (COGS) &rarr; <b>Gross profit<\/b><br>&minus; Operating expenses (salaries, rent, marketing) and depreciation &rarr; <b>EBIT<\/b> (operating profit)<br>&minus; Interest &rarr; <b>PBT<\/b> (profit before tax)<br>&minus; Tax &rarr; <b>PAT<\/b> (net profit)<\/div>\n<ul>\n<li><b>COGS<\/b> is the cost of the goods <em>actually sold<\/em>, not bought. Opening stock + purchases − closing stock.<\/li>\n<li><b>Depreciation<\/b> spreads the cost of equipment over its useful life. A ₹120 lakh machine lasting 10 years costs ₹12 lakh a year in profit terms. It is a real expense but <em>no cash leaves<\/em> in that year.<\/li>\n<li><b>EBITDA<\/b> = EBIT + depreciation + amortisation. A rough measure of operating cash earning power before capital costs.<\/li>\n<li><b>EPS<\/b> (earnings per share) = PAT ÷ shares outstanding.<\/li>\n<\/ul>\n\n<h3>3. The balance sheet (a date)<\/h3>\n<p>A snapshot on one date. Assets on one side; liabilities plus equity on the other; the two sides are equal.<\/p>\n<table>\n<tr><th>Assets<\/th><th>Liabilities and equity<\/th><\/tr>\n<tr><td><b>Current assets<\/b> (expected to turn to cash in 12 months): cash, receivables, inventory<\/td><td><b>Current liabilities<\/b> (due within 12 months): payables, short-term loans, accrued expenses<\/td><\/tr>\n<tr><td><b>Non-current assets<\/b>: equipment, property (net of depreciation), intangibles, long-term investments<\/td><td><b>Non-current liabilities<\/b>: long-term loans, lease liabilities, deferred tax<\/td><\/tr>\n<tr><td><\/td><td><b>Equity<\/b>: share capital + reserves and retained earnings<\/td><\/tr>\n<\/table>\n<p><b>Working capital<\/b> = current assets − current liabilities. It is the cushion of short-term resources over short-term bills. <b>Net debt<\/b> = borrowings − cash.<\/p>\n<p><b>Retained earnings<\/b> = opening retained earnings + PAT − dividends. Profit that is not paid out is added to the owners' claim.<\/p>\n\n<h3>4. The cash flow statement (a period)<\/h3>\n<p>Profit is an opinion built on accounting rules; cash is a fact. The cash flow statement reconciles the two and shows <em>where<\/em> cash came from and went.<\/p>\n<table>\n<tr><th>Section<\/th><th>What it contains<\/th><\/tr>\n<tr><td><b>Operating<\/b><\/td><td>Cash from running the business. Start from PAT, add back non-cash items (depreciation), then adjust for working-capital changes.<\/td><\/tr>\n<tr><td><b>Investing<\/b><\/td><td>Buying or selling long-term assets: capex (outflow), sale of equipment (inflow), buying investments.<\/td><\/tr>\n<tr><td><b>Financing<\/b><\/td><td>Raising or repaying money: equity raised, loans taken or repaid, dividends paid.<\/td><\/tr>\n<\/table>\n<p><b>The working-capital rules (memorise as a direction table):<\/b><\/p>\n<table>\n<tr><th>Item rises<\/th><th>Effect on cash<\/th><th>Reason<\/th><\/tr>\n<tr><td>Receivables<\/td><td>cash falls<\/td><td>you sold but have not been paid<\/td><\/tr>\n<tr><td>Inventory<\/td><td>cash falls<\/td><td>cash is tied up in stock<\/td><\/tr>\n<tr><td>Payables<\/td><td>cash rises<\/td><td>you have used goods without yet paying<\/td><\/tr>\n<\/table>\n<p><b>Free cash flow<\/b> = operating cash flow − capex. It is what is truly left for lenders and owners.<\/p>\n\n<h3>5. One company, three statements<\/h3>\n<div class=\"eg\"><b>Kaveri Bakes, Year 1 (₹ lakh).<\/b>\n<ol>\n<li>Owners put in ₹100. A bank lends ₹80 at 10%. Cash = 180.<\/li>\n<li>Buys equipment ₹120 (life 10 years, so depreciation ₹12 a year). Cash = 60.<\/li>\n<li>Sales ₹400: ₹340 collected, ₹60 still owed by customers.<\/li>\n<li>Buys ingredients ₹250: pays ₹200, owes ₹50. Closing stock ₹30, so COGS = 250 − 30 = 220.<\/li>\n<li>Pays operating expenses ₹80, interest ₹8 (10% × 80), tax ₹20.<\/li>\n<\/ol>\n<b>Income statement<\/b>\n<table>\n<tr><td>Revenue<\/td><td>400<\/td><\/tr><tr><td>COGS<\/td><td>(220)<\/td><\/tr><tr><td><b>Gross profit<\/b><\/td><td><b>180<\/b><\/td><\/tr>\n<tr><td>Operating expenses<\/td><td>(80)<\/td><\/tr><tr><td>Depreciation<\/td><td>(12)<\/td><\/tr><tr><td><b>EBIT<\/b><\/td><td><b>88<\/b><\/td><\/tr>\n<tr><td>Interest<\/td><td>(8)<\/td><\/tr><tr><td><b>PBT<\/b><\/td><td><b>80<\/b><\/td><\/tr><tr><td>Tax at 25%<\/td><td>(20)<\/td><\/tr><tr><td><b>PAT<\/b><\/td><td><b>60<\/b><\/td><\/tr>\n<\/table>\n<b>Cash flow statement<\/b>\n<table>\n<tr><td>PAT<\/td><td>60<\/td><\/tr><tr><td>+ Depreciation (non-cash)<\/td><td>12<\/td><\/tr><tr><td>&minus; Increase in receivables<\/td><td>(60)<\/td><\/tr><tr><td>&minus; Increase in inventory<\/td><td>(30)<\/td><\/tr><tr><td>+ Increase in payables<\/td><td>50<\/td><\/tr>\n<tr><td><b>Operating cash flow<\/b><\/td><td><b>32<\/b><\/td><\/tr>\n<tr><td>Capex (equipment)<\/td><td>(120)<\/td><\/tr><tr><td><b>Investing<\/b><\/td><td><b>(120)<\/b><\/td><\/tr>\n<tr><td>Equity 100 + Loan 80<\/td><td>180<\/td><\/tr><tr><td><b>Net change in cash<\/b><\/td><td><b>92<\/b><\/td><\/tr>\n<\/table>\n<b>Balance sheet at year end<\/b>\n<table>\n<tr><th>Assets<\/th><th><\/th><th>Liabilities and equity<\/th><th><\/th><\/tr>\n<tr><td>Cash<\/td><td>92<\/td><td>Payables<\/td><td>50<\/td><\/tr>\n<tr><td>Receivables<\/td><td>60<\/td><td>Loan<\/td><td>80<\/td><\/tr>\n<tr><td>Inventory<\/td><td>30<\/td><td>Share capital<\/td><td>100<\/td><\/tr>\n<tr><td>Equipment (120 &minus; 12)<\/td><td>108<\/td><td>Retained earnings<\/td><td>60<\/td><\/tr>\n<tr><td><b>Total<\/b><\/td><td><b>290<\/b><\/td><td><b>Total<\/b><\/td><td><b>290<\/b><\/td><\/tr>\n<\/table>\nNotice: profit is ₹60 lakh but operating cash flow is only ₹32 lakh. The gap is the money stuck in customers' hands (60) and stock (30), partly funded by suppliers (50), plus depreciation added back (12). Profitable businesses run out of cash when they grow receivables and stock faster than they collect.<\/div>\n\n<h3>6. How the statements link<\/h3>\n<ul>\n<li>PAT on the income statement flows into retained earnings on the balance sheet, and is the first line of the cash flow statement.<\/li>\n<li>Closing cash on the cash flow statement equals cash on the balance sheet.<\/li>\n<li>Depreciation lowers profit and lowers the equipment on the balance sheet, but never touches cash directly.<\/li>\n<li>Capex does not hit the income statement at once; it becomes an asset and is expensed gradually as depreciation.<\/li>\n<li>Borrowing adds cash and a liability; principal repayment reduces both; interest hits profit.<\/li>\n<\/ul>\n\n<h3>7. Accounting judgement<\/h3>\n<ul>\n<li><b>Revenue recognition<\/b>: record when the performance obligation is met, not when cash arrives. Advance received is a liability (deferred revenue) until delivered.<\/li>\n<li><b>Capitalise vs expense<\/b>: a cost that gives benefit over several years (machine) is an asset; day-to-day running costs are expensed. Capitalising too much flatters profit now.<\/li>\n<li><b>Contingent liabilities<\/b> (pending lawsuits): recognised as a liability if a loss is probable and measurable; otherwise disclosed in notes.<\/li>\n<li><b>Depreciation methods<\/b>: straight line (equal each year) vs reducing balance (higher early). Total depreciation over life is the same; timing differs.<\/li>\n<li><b>Inventory valuation<\/b> (FIFO, weighted average) changes COGS and profit when prices move.<\/li>\n<li><b>Provisions and impairment<\/b>: expected losses reduce profit before cash is lost.<\/li>\n<\/ul>\n\n<h3>Common traps<\/h3>\n<ul>\n<li>Treating depreciation as a cash cost, or forgetting to add it back.<\/li>\n<li>Putting dividends in operating cash flow (they are financing).<\/li>\n<li>Confusing COGS with purchases (use opening + purchases − closing).<\/li>\n<li>Calling a loan repayment an expense (principal is not an expense; interest is).<\/li>\n<li>Reading higher receivables as \"more cash\".<\/li>\n<\/ul>\n"}, {"id": "bf-ratio", "sec": "BF", "title": "Ratios and performance", "r1": "Ratios and performance", "min": 35, "html": "\n<p class=\"lead\">A raw number such as \"profit ₹60 lakh\" says little. Is that good for a business with ₹400 lakh of sales? For ₹4,000 lakh? A ratio puts one figure against another so businesses of different sizes, and the same business in different years, can be compared. We use Kaveri Bakes from the previous topic: revenue 400, COGS 220, EBIT 88, interest 8, PAT 60, cash 92, receivables 60, inventory 30, equipment 108, total assets 290, payables 50, loan 80, equity 160.<\/p>\n\n<h3>1. Five questions, five families<\/h3>\n<ol>\n<li><b>Can it pay its bills?<\/b> Liquidity ratios.<\/li>\n<li><b>Does it make money on each sale?<\/b> Margins.<\/li>\n<li><b>How well does it use what it has?<\/b> Efficiency (turnover and days).<\/li>\n<li><b>How much does it earn for its owners?<\/b> Returns.<\/li>\n<li><b>How risky is the way it is funded?<\/b> Leverage and coverage.<\/li>\n<\/ol>\n\n<h3>2. Liquidity: short-term survival<\/h3>\n<table>\n<tr><th>Ratio<\/th><th>Formula<\/th><th>Kaveri<\/th><th>Meaning<\/th><\/tr>\n<tr><td>Current ratio<\/td><td>Current assets ÷ current liabilities<\/td><td>182 ÷ 50 = 3.64<\/td><td>Rupees of short-term assets per rupee of short-term bills<\/td><\/tr>\n<tr><td>Quick ratio<\/td><td>(Current assets − inventory) ÷ current liabilities<\/td><td>152 ÷ 50 = 3.04<\/td><td>Same, ignoring stock that may be slow to sell<\/td><\/tr>\n<tr><td>Cash ratio<\/td><td>Cash ÷ current liabilities<\/td><td>92 ÷ 50 = 1.84<\/td><td>Strictest test<\/td><\/tr>\n<\/table>\n<p>A ratio below 1 means short-term bills exceed short-term assets, a warning sign for most firms. But very high is not automatically good: it can mean idle cash or bloated stock.<\/p>\n\n<h3>3. Margins: profit per rupee of sales<\/h3>\n<table>\n<tr><th>Ratio<\/th><th>Formula<\/th><th>Kaveri<\/th><\/tr>\n<tr><td>Gross margin<\/td><td>Gross profit ÷ revenue<\/td><td>180 ÷ 400 = 45%<\/td><\/tr>\n<tr><td>EBITDA margin<\/td><td>EBITDA ÷ revenue<\/td><td>100 ÷ 400 = 25%<\/td><\/tr>\n<tr><td>Operating (EBIT) margin<\/td><td>EBIT ÷ revenue<\/td><td>88 ÷ 400 = 22%<\/td><\/tr>\n<tr><td>Net margin<\/td><td>PAT ÷ revenue<\/td><td>60 ÷ 400 = 15%<\/td><\/tr>\n<\/table>\n<p>Gross margin shows pricing power and production cost. EBIT margin shows how well the whole operation turns sales into profit before financing. Net margin is what survives interest and tax. A falling gross margin points to costs rising faster than prices; a falling EBIT margin with stable gross margin points to overheads.<\/p>\n\n<h3>4. Efficiency: how hard assets work<\/h3>\n<table>\n<tr><th>Ratio<\/th><th>Formula<\/th><th>Kaveri<\/th><\/tr>\n<tr><td>Receivable days<\/td><td>Receivables ÷ revenue × 365<\/td><td>60 ÷ 400 × 365 = 54.8 days<\/td><\/tr>\n<tr><td>Inventory days<\/td><td>Inventory ÷ COGS × 365<\/td><td>30 ÷ 220 × 365 = 49.8 days<\/td><\/tr>\n<tr><td>Payable days<\/td><td>Payables ÷ COGS × 365<\/td><td>50 ÷ 220 × 365 = 83.0 days<\/td><\/tr>\n<tr><td>Inventory turnover<\/td><td>COGS ÷ inventory<\/td><td>220 ÷ 30 = 7.3 times<\/td><\/tr>\n<tr><td>Asset turnover<\/td><td>Revenue ÷ total assets<\/td><td>400 ÷ 290 = 1.38<\/td><\/tr>\n<\/table>\n<div class=\"why\"><b>Cash conversion cycle = receivable days + inventory days − payable days.<\/b> For Kaveri: 54.8 + 49.8 − 83.0 = 21.6 days. This is how long cash is tied up between paying for ingredients and collecting from customers. A shorter or negative cycle means the business is financed by suppliers; supermarkets often run negative cycles. When the question says \"average\", use (opening + closing) ÷ 2.<\/div>\n<p>Use COGS (not revenue) for inventory and payable days because stock and payables are valued at cost.<\/p>\n\n<h3>5. Returns: payoff for capital providers<\/h3>\n<table>\n<tr><th>Ratio<\/th><th>Formula<\/th><th>Kaveri<\/th><\/tr>\n<tr><td>Return on equity (ROE)<\/td><td>PAT ÷ equity<\/td><td>60 ÷ 160 = 37.5%<\/td><\/tr>\n<tr><td>Return on assets (ROA)<\/td><td>PAT ÷ total assets<\/td><td>60 ÷ 290 = 20.7%<\/td><\/tr>\n<tr><td>Return on capital employed (ROCE)<\/td><td>EBIT ÷ (total assets − current liabilities)<\/td><td>88 ÷ 240 = 36.7%<\/td><\/tr>\n<\/table>\n<p>ROCE uses EBIT because it measures the return to <em>all<\/em> long-term capital before the split between lenders and owners.<\/p>\n\n<h3>6. DuPont: why is ROE high?<\/h3>\n<div class=\"fx\">ROE = Net margin &times; Asset turnover &times; Equity multiplier<br>= (PAT ÷ Revenue) &times; (Revenue ÷ Assets) &times; (Assets ÷ Equity)<\/div>\n<p>Kaveri: 15% × 1.379 × 1.8125 = 37.5%. The three levers are profitability, efficiency and leverage. Two firms with a 20% ROE can be completely different: a luxury brand (high margin, low turnover), a supermarket (low margin, high turnover) or a highly borrowed firm (low margin and turnover boosted by leverage). Leverage raises ROE in good times and magnifies losses in bad times.<\/p>\n\n<h3>7. Leverage and coverage: long-term risk<\/h3>\n<table>\n<tr><th>Ratio<\/th><th>Formula<\/th><th>Kaveri<\/th><\/tr>\n<tr><td>Debt-to-equity<\/td><td>Borrowings ÷ equity<\/td><td>80 ÷ 160 = 0.5<\/td><\/tr>\n<tr><td>Equity multiplier<\/td><td>Total assets ÷ equity<\/td><td>1.81<\/td><\/tr>\n<tr><td>Interest coverage<\/td><td>EBIT ÷ interest<\/td><td>88 ÷ 8 = 11 times<\/td><\/tr>\n<tr><td>Net debt ÷ EBITDA<\/td><td>(Debt − cash) ÷ EBITDA<\/td><td>(80 − 92) ÷ 100 = −0.12 (net cash)<\/td><\/tr>\n<\/table>\n<p>Interest coverage below about 2 is risky: a modest fall in profit leaves no room to pay lenders.<\/p>\n\n<h3>8. How to read ratios like an analyst<\/h3>\n<ul>\n<li><b>Compare<\/b> with the firm's own history and with similar firms; the \"right\" number depends on the industry.<\/li>\n<li><b>Look at the trend<\/b>, not one year: margins falling while revenue rises means costs are growing faster than sales.<\/li>\n<li><b>Link ratios to causes<\/b>: receivable days rising may mean weak collection or loose credit to push sales; current ratio fine but quick ratio poor means liquidity is trapped in stock.<\/li>\n<li><b>Mind the base<\/b>: a profit of ₹10 on a base of ₹5 is a 200% rise; ratios on tiny bases mislead.<\/li>\n<\/ul>\n<div class=\"trap\"><b>Common traps.<\/b> Using closing balances when the stem says \"average\". Using revenue instead of COGS for inventory days. Using PAT where the formula wants EBIT (ROCE, coverage). Mixing 360 and 365 days: use whatever the stem says. Giving a percentage answer as a fraction or the reverse.<\/div>\n<div class=\"eg\"><b>Same ROE, different business.<\/b> Firm A: revenue 400, PAT 40, assets 200, equity 80: 10% × 2.0 × 2.5 = 50%. Firm B: 25% margin, 0.4 turnover, multiplier 5: 50% too. B depends on borrowing for its ROE, so a small drop in profit hurts it far more.<\/div>\n"}, {"id": "bf-unit", "sec": "BF", "title": "Unit economics and business models", "r1": "Unit economics and business models", "min": 40, "html": "\n<p class=\"lead\">Before asking whether a company is profitable, ask whether <em>one unit<\/em> of its business makes money. A unit can be one product sold, one delivery, one subscriber or one customer. If a single unit loses money, growth makes losses bigger. Unit economics is the discipline of finding that out.<\/p>\n\n<h3>1. Costs: fixed, variable, and why it matters<\/h3>\n<ul>\n<li><b>Variable costs<\/b> change with volume: ingredients, packaging, delivery fees, sales commission. Per unit they stay roughly the same.<\/li>\n<li><b>Fixed costs<\/b> do not change with volume in the short run: rent, salaries, software subscriptions. Per unit they fall as volume rises.<\/li>\n<li><b>Semi-variable<\/b> costs have both parts (a phone plan with a fixed fee plus per-minute charges).<\/li>\n<\/ul>\n<div class=\"why\"><b>The key insight.<\/b> Once variable costs are paid, each extra unit contributes what is left of its price to covering fixed costs. This is why a business with large fixed costs can lose money at low volume and become very profitable at high volume.<\/div>\n\n<h3>2. Contribution and break-even (CVP analysis)<\/h3>\n<div class=\"fx\">Contribution per unit = Price &minus; Variable cost per unit<br>Contribution margin ratio (CM%) = Contribution &divide; Price<br>Break-even units = Fixed costs &divide; Contribution per unit<br>Break-even revenue = Fixed costs &divide; CM%<br>Units for a target profit = (Fixed costs + Target profit) &divide; Contribution per unit<br>Margin of safety = (Actual sales &minus; Break-even sales) &divide; Actual sales<\/div>\n<div class=\"eg\"><b>Tiffin service.<\/b> Price ₹150, variable cost ₹90, fixed costs ₹60,000 a month.\n<ul>\n<li>Contribution = 150 − 90 = ₹60 (CM% = 40%).<\/li>\n<li>Break-even = 60,000 ÷ 60 = 1,000 meals, or ₹1,50,000 of revenue (60,000 ÷ 0.40).<\/li>\n<li>At 1,500 meals: profit = 1,500 × 60 − 60,000 = ₹30,000. Margin of safety = (1,500 − 1,000) ÷ 1,500 = 33%.<\/li>\n<li>For a ₹45,000 profit: (60,000 + 45,000) ÷ 60 = 1,750 meals.<\/li>\n<\/ul>\nRound break-even units <em>up<\/em> to a whole number. Break-even is the point at which profit is exactly zero.<\/div>\n\n<h3>3. Operating leverage<\/h3>\n<div class=\"fx\">Degree of operating leverage (DOL) = Contribution &divide; EBIT<\/div>\n<p>With 1,500 meals: contribution = 90,000, EBIT = 30,000, DOL = 3. A 10% rise in sales gives a 30% rise in profit, and a 10% fall gives a 30% fall. High fixed costs raise operating leverage: more reward in good times, more risk in bad.<\/p>\n\n<h3>4. More than one product<\/h3>\n<p>Use a weighted-average contribution. If you sell products in a fixed mix, treat one \"bundle\" as the unit. Example: Product A (contribution ₹20) and B (contribution ₹50) sold 3 : 1. One bundle contributes 3×20 + 50 = ₹110. Fixed costs ₹55,000 need 500 bundles = 1,500 A and 500 B.<\/p>\n\n<h3>5. Pricing: margin vs markup<\/h3>\n<p>These two are mixed up constantly. <b>Markup<\/b> is profit as a share of <em>cost<\/em>; <b>margin<\/b> is profit as a share of <em>price<\/em>.<\/p>\n<div class=\"fx\">Price = Cost &times; (1 + markup) &nbsp;|&nbsp; Margin = Markup &divide; (1 + markup)<\/div>\n<p>A 25% markup on cost gives a margin of 0.25 ÷ 1.25 = 20%. To get a 20% margin you need a 25% markup. Price discounts hit contribution rupee for rupee: a ₹10 discount on a ₹60 contribution cuts contribution by 17% and raises the break-even volume by 20%.<\/p>\n\n<h3>6. Decisions with unit economics<\/h3>\n<ul>\n<li><b>Special order<\/b>: accept if the price exceeds the extra (variable) cost and spare capacity exists. Fixed costs already being paid are irrelevant.<\/li>\n<li><b>Make or buy<\/b>: compare the avoidable cost of making with the price of buying. Unavoidable fixed costs do not count.<\/li>\n<li><b>Drop a product<\/b>: drop only if its contribution is less than the fixed costs you can actually avoid. A product with negative profit may still contribute to overheads.<\/li>\n<li><b>Limiting factor<\/b>: when one resource is scarce, rank products by contribution <em>per unit of that resource<\/em> (per machine hour), not per unit of product.<\/li>\n<\/ul>\n<div class=\"why\"><b>Relevant costs.<\/b> Only costs that change because of the decision matter. Sunk costs (already spent) and costs that stay the same either way are ignored.<\/div>\n\n<h3>7. Customer economics (subscription and digital businesses)<\/h3>\n<table>\n<tr><th>Metric<\/th><th>Formula<\/th><th>Meaning<\/th><\/tr>\n<tr><td>ARPU<\/td><td>Revenue ÷ active users<\/td><td>Average revenue per user per period<\/td><\/tr>\n<tr><td>Churn rate<\/td><td>Customers lost ÷ customers at start<\/td><td>How fast customers leave<\/td><\/tr>\n<tr><td>Customer lifetime<\/td><td>1 ÷ churn rate<\/td><td>5% monthly churn means 20 months on average<\/td><\/tr>\n<tr><td>LTV<\/td><td>ARPU × gross margin ÷ churn<\/td><td>Lifetime profit from a customer<\/td><\/tr>\n<tr><td>CAC<\/td><td>Sales and marketing spend ÷ new customers<\/td><td>Cost to win a customer<\/td><\/tr>\n<tr><td>LTV : CAC<\/td><td>LTV ÷ CAC<\/td><td>About 3 or more is healthy<\/td><\/tr>\n<tr><td>CAC payback<\/td><td>CAC ÷ (monthly ARPU × gross margin)<\/td><td>Months to earn back acquisition cost<\/td><\/tr>\n<tr><td>Net revenue retention<\/td><td>(Start + expansion − churn − contraction) ÷ start<\/td><td>Above 100% means existing customers grow<\/td><\/tr>\n<\/table>\n<div class=\"eg\"><b>Subscription app.<\/b> Monthly ARPU ₹400, gross margin 70%, monthly churn 5%, CAC ₹1,400.\n<ul><li>Gross profit per customer per month = 400 × 0.70 = ₹280.<\/li>\n<li>LTV = 280 ÷ 0.05 = ₹5,600.<\/li>\n<li>LTV : CAC = 5,600 ÷ 1,400 = 4.0 (healthy).<\/li>\n<li>Payback = 1,400 ÷ 280 = 5 months.<\/li><\/ul><\/div>\n\n<h3>8. Marketplaces and delivery businesses<\/h3>\n<ul>\n<li><b>GMV<\/b> (gross merchandise value) is the value of goods sold through the platform, not the platform's revenue.<\/li>\n<li><b>Take rate<\/b> = platform revenue ÷ GMV. A 20% take rate on ₹1,000 order is ₹200 revenue.<\/li>\n<li><b>Contribution per order<\/b> = commission + delivery fee + ad revenue − delivery cost − discounts − payment fees. Positive contribution per order is what lets scale eventually cover fixed costs.<\/li>\n<\/ul>\n<div class=\"eg\">Order value ₹500. Commission 20% (₹100), customer delivery fee ₹30, rider cost ₹55, discount funded by platform ₹25, payment fee 1.5% of ₹500 (₹7.50). Contribution = 100 + 30 − 55 − 25 − 7.5 = ₹42.50 per order. At ₹20 lakh of fixed monthly cost, break-even is about 47,059 orders a month.<\/div>\n\n<h3>9. Business model types<\/h3>\n<table>\n<tr><th>Model<\/th><th>How it makes money<\/th><th>Key number<\/th><\/tr>\n<tr><td>Subscription<\/td><td>Recurring fee<\/td><td>Churn, LTV : CAC<\/td><\/tr>\n<tr><td>Marketplace<\/td><td>Commission on transactions<\/td><td>Take rate, orders per user<\/td><\/tr>\n<tr><td>Freemium<\/td><td>Small share of free users pay<\/td><td>Conversion to paid<\/td><\/tr>\n<tr><td>Razor and blade<\/td><td>Cheap device, profitable consumables<\/td><td>Attach rate, repeat purchase<\/td><\/tr>\n<tr><td>Franchise / asset-light<\/td><td>Royalty or fee; partner funds assets<\/td><td>Royalty %, outlet count<\/td><\/tr>\n<tr><td>Advertising<\/td><td>Sell users' attention<\/td><td>Engagement, revenue per user<\/td><\/tr>\n<tr><td>Manufacturing / retail<\/td><td>Margin on goods<\/td><td>Gross margin, inventory turnover<\/td><\/tr>\n<\/table>\n\n<h3>Common traps<\/h3>\n<ul>\n<li>Using revenue instead of gross profit in LTV.<\/li>\n<li>Mixing monthly churn with annual ARPU.<\/li>\n<li>Rounding break-even down; round up.<\/li>\n<li>Including fixed costs in per-unit cost when asked for contribution.<\/li>\n<li>Confusing markup with margin; confusing GMV with revenue.<\/li>\n<\/ul>\n"}, {"id": "bf-bank", "sec": "BF", "title": "Banks and financial institutions", "r1": "Banks and financial institutions", "min": 35, "html": "\n<p class=\"lead\">A bank is a business that borrows from people with spare money and lends to people who need it, earning the difference. Everything else in this topic (ratios, regulation, bad loans) follows from that one fact and from the fact that a bank's failure harms the whole economy.<\/p>\n\n<h3>1. What banks do and why they exist<\/h3>\n<ul>\n<li><b>Intermediation<\/b>: gather many small deposits, lend in large chunks. Depositors get safety and liquidity; borrowers get credit.<\/li>\n<li><b>Maturity transformation<\/b>: deposits are short-term (you can withdraw anytime), loans are long-term (a home loan for 20 years). This earns a spread but creates liquidity risk.<\/li>\n<li><b>Payments<\/b>: moving money between accounts (UPI, NEFT, RTGS, cards).<\/li>\n<li><b>Risk management<\/b>: assessing borrowers and spreading risk across thousands of loans.<\/li>\n<\/ul>\n<div class=\"why\"><b>Fractional reserve banking.<\/b> A bank does not keep all deposits in the vault. It keeps a fraction as reserves and lends the rest, which is deposited again elsewhere, and so on. If the reserve fraction is 10%, ₹100 of new deposits can support up to ₹100 ÷ 0.10 = ₹1,000 of total deposits across the system (the money multiplier = 1 ÷ reserve ratio). This is why a run on deposits can sink a bank: it cannot pay everyone at once.<\/div>\n\n<h3>2. A bank's balance sheet (the opposite of a normal firm's)<\/h3>\n<table>\n<tr><th>Assets (use
